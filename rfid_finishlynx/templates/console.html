/* The Stations panel: one row per reader - the local mat first, then every
   LoRa station (heard, pre-registered, or merely configured) - with its
   state and a Location select (where it stands: a mile marker, the finish,
   one mat crossed more than once, or a loop-course skip). Changing a
   location re-labels reads already heard, so it can be fixed mid-race. */
function renderStations(force) {
  const t = document.getElementById('units');
  if (!t) return;
  // don't yank a menu out from under the operator on a poll
  if (!force && document.activeElement && t.contains(document.activeElement)) return;
  const s = STATUS || {};
  const rows = [];
  rows.push({ id: LOCAL_READER, name: 'This PC', sub: CFG.reader && CFG.reader.type ? `${CFG.reader.type} reader` : 'local reader',
              cls: !s.running ? '' : s.reader_connected ? 'good' : 'crit',
              state: !s.running ? 'stopped' : s.reader_connected ? 'reading' : 'down',
              age: null, pop: 'reader', port: null });
  const seen = new Set([LOCAL_READER]);
  for (const u of UNITS) {
    const age = u.last_seen ? Math.round((Date.now() - new Date(u.last_seen)) / 1000) : null;
    const fresh = age !== null && age < 40;
    // reading = radio + RFID reader both up; idle = radio only (reader
    // down or supervisor still retrying); anything stale/error = red.
    rows.push({ id: u.reader_id, name: u.reader_id, sub: u.version ? `LoRa v${u.version}` : 'LoRa',
                cls: !fresh ? 'crit' : u.state === 'reading' ? 'good' : u.state === 'idle' ? 'warn' : 'crit',
                state: !fresh ? (age === null ? 'never heard' : 'silent') : (u.state || '?'),
                age, pop: 'unit', port: u.reader_id });
    seen.add(u.reader_id);
  }
  for (const id of Object.keys((DATA && DATA.reader_points) || {}))
    if (!seen.has(id)) rows.push({ id, name: id, sub: 'LoRa (from config)', cls: '', state: 'not heard', age: null, pop: 'unit', port: id });
  // Reader… swaps this popover for that reader's (anchored on the chip);
  // its "All stations" button comes back here
  t.innerHTML = '<tr><th>Station</th><th>Location</th></tr>' + rows.map(r => {
    const fin = readerIsFinish(r.id), off = readerOff(r.id);
    const port = r.port ? `'${esc(r.port)}'` : 'null';
    return `<tr><td class="bib">${esc(r.name)} <span class="dot ${off ? '' : r.cls}"></span> <span style="font-weight:normal">${esc(r.state)}${r.age !== null && r.age >= 40 ? ` ${r.age} s` : ''}</span>
        <div class="sub" style="font-weight:normal">${esc(r.sub)}
          <button class="btn rdr pop-anchor" onclick="openPop('${r.pop}', ${port}, document.getElementById('chip-st'))" title="Antenna ports, power and commands">⚙ Reader…</button></div></td>
      <td class="loc"><select class="${fin ? 'finish' : ''}" title="Where this station stands on the course" onchange="setLocation('${esc(r.id)}', this.value)">${locationOptions(r.id)}</select></td></tr>`;
  }).join('');
  const f = document.getElementById('units-foot');
  if (f.querySelector('.msg-ok, .msg-bad')) return;           // a save message is showing
  const multi = rows.some(r => (unitPoints(r.id) || []).length > 1);
  f.hidden = !multi;
  if (multi) f.innerHTML = `Same pass within <input type="number" min="0" max="3600" step="5" value="${esc(DATA && DATA.pass_window_sec != null ? DATA.pass_window_sec : 90)}" onchange="setPassWindow(this.value)"> s — a bib read again at one mat sooner than this is the same crossing, not the next location.`;
}

/* A station's reader config as last reported over the radio (CFGR strings:
   antennas "1.3.5.7" or "" for every port; ports "8"; active "1.2.3.4"). */
function unitReaderCfg(id) {
  const u = UNITS.find(x => x.reader_id === id) || {};
  return { unit: u, rc: (u.config_cache || {}).reader || null };
}
function unitPorts(str) { return str ? String(str).split('.').filter(Boolean).map(Number) : []; }
function unitPollingText(rc) {
  if (!rc) return 'not fetched yet';
  const sel = unitPorts(rc.antennas), act = unitPorts(rc.active);
  const every = rc.antennas === '' || rc.antennas === undefined;
  return (every ? 'every port' : 'ports ' + sel.join(', '))
       + (act.length ? ` <span style="color:var(--ink-3)">· polling ${act.join(', ')}</span>` : '');
}

/* ---------------------------- race panes ---------------------------- */

function render() {
  const root = document.getElementById('panes');
  if (!DATA || !DATA.enabled) {
    root.innerHTML = '<div class="note">Race manager is not enabled — set races.enabled: true in config.yaml (finish line mode).</div>';
    return;
  }
  const html = panesHtml();
  // render() runs every second, but the DOM is only rebuilt when the panes'
  // content actually changed (a read landed, a status flipped): rebuilding
  // a table while the operator is dragging it makes the scroll catch and
  // lose its momentum. The per-second race clocks are updated in place
  // (tickClocks), and a rebuild that falls inside an active scroll waits
  // for the next tick. When it does rebuild, each table keeps its place.
  if (html !== LAST_PANES_HTML && (Date.now() - LAST_PANE_SCROLL_AT > 500 || !LAST_PANES_HTML)) {
    const scrolled = {};
    root.querySelectorAll('.scroll[data-key]').forEach(el => { if (el.scrollTop) scrolled[el.dataset.key] = el.scrollTop; });
    const before = paneBoxes(root);
    root.innerHTML = html;
    root.querySelectorAll('.scroll[data-key]').forEach(el => { if (scrolled[el.dataset.key]) el.scrollTop = scrolled[el.dataset.key]; });
    LAST_PANES_HTML = html;
    morphPanes(root, before);
  }
  tickClocks(root);
}
let LAST_PANES_HTML = '', LAST_PANE_SCROLL_AT = 0;

/* Expand / collapse morph (2026-09-27): when a race changes size (card or
   strip <-> pane, auto-big at the gun, the fold after Close race, Pin/Unpin,
   Held/Ignored), its old box glides and resizes to where the race now lives
   and the new one fades in under it with a short ring; every other race
   slides to its new place instead of jumping. Only a size change animates -
   a read landing never does. The race the operator just opened or folded is
   scrolled into view if it landed off screen. */
const MORPH_MS = 420, MORPH_EASE = 'cubic-bezier(.2, .7, .2, 1)';
const REDUCED_MOTION = matchMedia('(prefers-reduced-motion: reduce)');
let FOLLOW = null;
function paneBoxes(root) {
  const boxes = {};
  root.querySelectorAll('[data-race]').forEach(el => {
    const r = el.getBoundingClientRect();
    boxes[el.dataset.race] = { el, mode: el.dataset.mode, x: r.left + scrollX, y: r.top + scrollY, w: r.width, h: r.height };
  });
  return boxes;
}
function morphPanes(root, before) {
  const after = paneBoxes(root);
  const follow = FOLLOW && after[FOLLOW];
  FOLLOW = null;
  if (follow) {
    const r = follow.el.getBoundingClientRect();
    if (r.top < 0 || r.bottom > innerHeight) follow.el.scrollIntoView({ block: r.height > innerHeight ? 'start' : 'nearest', behavior: 'smooth' });
  }
  const changed = Object.keys(after).filter(k => before[k] && before[k].mode !== after[k].mode);
  if (!changed.length || REDUCED_MOTION.matches) return;
  for (const [k, a] of Object.entries(after)) {
    const b = before[k];
    if (!b) continue;
    if (changed.includes(k)) {
      const ghost = document.createElement('div');
      ghost.className = 'pane-ghost';
      b.el.style.width = b.w + 'px';
      ghost.appendChild(b.el);
      const box = x => ({ left: x.x + 'px', top: x.y + 'px', width: x.w + 'px', height: x.h + 'px' });
      Object.assign(ghost.style, box(b));
      document.body.appendChild(ghost);
      ghost.animate([Object.assign(box(b), { opacity: 1 }), Object.assign(box(a), { opacity: 1, offset: 0.8 }), Object.assign(box(a), { opacity: 0 })],
                    { duration: MORPH_MS, easing: MORPH_EASE }).onfinish = () => ghost.remove();
      a.el.animate([{ opacity: 0 }, { opacity: 0, offset: 0.6 }, { opacity: 1 }], { duration: MORPH_MS })
        .onfinish = () => a.el.classList.add('landed');
    } else if (Math.abs(b.x - a.x) + Math.abs(b.y - a.y) > 1) {
      a.el.animate([{ transform: `translate(${b.x - a.x}px, ${b.y - a.y}px)` }, { transform: 'none' }], { duration: MORPH_MS, easing: MORPH_EASE });
    }
  }
}
document.addEventListener('scroll', e => {
  if (e.target && e.target.classList && e.target.classList.contains('scroll')) LAST_PANE_SCROLL_AT = Date.now();
}, true);
/* The "+M:SS since the gun" readouts tick without touching anything else. */
function tickClocks(root) {
  const now = Date.now();
  root.querySelectorAll('.clock[data-gun]').forEach(el => {
    const gun = new Date(el.dataset.gun).getTime();
    el.textContent = now > gun ? '+' + fmtElapsed((now - gun) / 1000).split('.')[0] : '';
  });
  root.querySelectorAll('[data-until]').forEach(el => {
    el.textContent = Math.max(0, Math.ceil((+el.dataset.until - now) / 1000)) + ' s';
  });
}

/* Panes sized by status (2026-09-26): a race with a gun that is not final
   is ACTIVE - full size, big clock and counts, a taller table. Pending and
   check-in races are one-line cards; finished races are one-line strips
   (count, winner, top team, and an amber badge while anyone is missing a
   split). Order: active, check-in, pending, final, then Held/Ignored.
   Auto-focus: a race goes big by itself when its gun arms; after Close
   race it stays open 8 s (Keep open cancels) and then folds to a strip.
   Pin open keeps any race full size whatever its status (saved in this
   browser); clicking a card or strip opens it until Collapse. */
const CLOSE_DELAY_MS = 8000;
const PREV_STATUS = {}, CLOSING = {}, OPENED = {};
let PINS = {};
try { PINS = JSON.parse(localStorage.getItem('console-pins') || '{}') || {}; } catch (e) { PINS = {}; }
function savePins() { try { localStorage.setItem('console-pins', JSON.stringify(PINS)); } catch (e) {} }
function togglePin(key) {
  if (PINS[key]) delete PINS[key]; else PINS[key] = true;
  delete CLOSING[key];
  savePins(); render();
}
function keepOpen(key) { delete CLOSING[key]; PINS[key] = true; savePins(); render(); }
function openPane(key) { OPENED[key] = true; FOLLOW = String(key); render(); }
function collapsePane(key) { FOLLOW = String(key); delete OPENED[key]; delete PINS[key]; delete CLOSING[key]; savePins(); render(); }
let HELD_OPEN = { held: false, ignored: false };
function toggleHeld(which) { FOLLOW = which; HELD_OPEN[which] = !HELD_OPEN[which]; render(); }

function paneMode(race) {
  const k = race.key;
  if (race.status !== 'final' && (race.status === 'racing' || race.gun)) return 'big';
  if (PINS[k] || OPENED[k] || CLOSING[k]) return 'full';
  return race.status === 'final' ? 'strip' : 'card';
}
function panesHtml() {
  const now = Date.now();
  // race keys restart at 1 after Close meet: drop pins for races that are gone
  let pruned = false;
  for (const k of Object.keys(PINS)) if (!DATA.races[k]) { delete PINS[k]; pruned = true; }
  if (pruned) savePins();
  // a race seen going final here stays open CLOSE_DELAY_MS before it folds
  for (const key of DATA.order) {
    const r = DATA.races[String(key)];
    if (r.status === 'final' && PREV_STATUS[key] && PREV_STATUS[key] !== 'final' && !PINS[key]) CLOSING[key] = now + CLOSE_DELAY_MS;
    if (r.status !== 'final') delete CLOSING[key];
    PREV_STATUS[key] = r.status;
  }
  for (const k of Object.keys(CLOSING)) if (CLOSING[k] <= now) delete CLOSING[k];
  const rank = { big: 0, full: 1, card: 2, strip: 3 }, srank = { racing: 0, checkin: 1, pending: 2, final: 3 };
  const races = DATA.order.map((k, i) => ({ r: DATA.races[String(k)], i }))
    .map(x => Object.assign(x, { mode: paneMode(x.r) }))
    .sort((a, b) => (rank[a.mode] - rank[b.mode]) || (srank[a.r.status] - srank[b.r.status]) || (a.i - b.i));
  const res = r => DATA.results[String(r.key)];
  const active = races.filter(x => x.mode === 'big' || x.mode === 'full');
  const cards = races.filter(x => x.mode === 'card'), strips = races.filter(x => x.mode === 'strip');
  let html = '';
  if (active.length) html += `<div class="grid-active">${active.map(x => paneHtml(x.r, res(x.r), x.mode)).join('')}</div>`;
  if (cards.length) html += `<div class="grid-cards">${cards.map(x => cardHtml(x.r)).join('')}</div>`;
  html += strips.map(x => stripHtml(x.r, res(x.r))).join('');
  html += HELD_OPEN.held ? heldPaneHtml('Held reads', DATA.held, 'held reads auto-promote when their bib finishes', 'held')
                         : heldStripHtml('Held reads', DATA.held, 'held');
  if (DATA.ignored.length) html += HELD_OPEN.ignored ? heldPaneHtml('Ignored reads', DATA.ignored, 'manually removed — restorable', 'ignored')
                                                     : heldStripHtml('Ignored reads', DATA.ignored, 'ignored');
  return html;
}
const gtag = g => `<span class="g ${g}" title="${g === 'X' ? 'Mixed: takes any athlete' : g === 'U' ? 'No gender: roster only' : ''}">${g === 'F' ? 'G' : g === 'M' ? 'B' : g === 'X' ? 'GB' : '?'}</span>`;
/* Pending / check-in race folded to one line; click it to open the pane. */
function cardHtml(race) {
  const k = race.key;
  return `<div data-race="${k}" data-mode="card" class="ccard ${race.status}" onclick="if (!event.target.closest('button')) openPane(${k})" title="${race.status === 'checkin' ? 'Checking in: the next gun arms this race. ' : ''}Click to open this race">
    ${gtag(race.gender || 'U')}<div><h2>${esc(race.name)}</h2><div class="sub">Evt ${race.event}-${race.round}-${race.heat} · ${race.status === 'checkin' ? `<b style="color:var(--boys)">${race.roster_count} checked in</b>` : `roster ${race.roster_count}`}</div></div>
    <span style="margin-left:auto"></span>
    <button class="btn small" onclick="openScoring(${k})" title="Scoring, gender, pace, delete pane">Settings</button>
    <button class="btn small" onclick="openGun(${k})">Gun ▾</button>
    ${race.status === 'pending' ? `<button class="btn" title="Open check-in for this race" onclick="api('/api/races/${k}/status',{status:'checkin'})">Check-in</button>` : ''}
    <span class="badge ${race.status}" style="margin-left:0">${race.status.toUpperCase()}</span></div>`;
}
/* Finished race folded to one line: the count, the winner, the top team,
   and the missing-split badge (so folding never hides work). */
function stripHtml(race, res) {
  const k = race.key, f = res ? res.finishers : [], w = f[0];
  const miss = f.filter(r => (r.missing || []).length).length;
  // finishers FinishLynx has no time for (a straggler after the event was
  // done there): open the race, the finish cell is a "Save to .lif" button
  const untimed = f.filter(r => r.finish && r.finish.fl_untimed).length;
  return `<div data-race="${k}" data-mode="strip" class="strip" onclick="if (!event.target.closest('button')) openPane(${k})" title="Click to open this race">
    <span class="chev">▸</span>${gtag(race.gender || 'U')}<h2>${esc(race.name)}</h2>
    <span class="num">${f.length}/${race.roster_count} finished</span>
    ${w ? `<span>1st <span style="color:var(--ink)">${esc(w.last_name)}</span> <span class="num">${fmtElapsed(w.finish.elapsed)}</span></span>` : ''}
    ${res && res.teams.length ? `<span>${esc(res.teams[0].team)} <span class="num" style="color:var(--ink)">${res.teams[0].score}</span></span>` : ''}
    ${miss ? `<span class="flag miss" style="font-size:11px;padding:1px 6px" title="Open the race to fix: Needs attention at the top">⚠ ${miss} missing a split</span>` : ''}
    ${untimed ? `<span class="btn lifsave" style="cursor:pointer" title="${untimed} finisher${untimed > 1 ? 's' : ''} the mat read ${untimed > 1 ? 'are' : 'is'} not in MeetPro's .lif (no FinishLynx time, or not on the start list). Open the race and decide: their finish time is a Save to .lif button.">${untimed} waiting for Save to .lif</span>` : ''}
    <span class="acts">
      <button class="btn" onclick="saveAs('/api/races/${k}/export.csv', '${esc(csvName(race))}', 'CSV file', 'text/csv', '.csv')">Export CSV…</button>
      ${f.length ? `<button class="btn" onclick="openSaveLif(${k})">Save .lif…</button>` : ''}
      <button class="btn" onclick="api('/api/races/${k}/status',{status:'racing'})">Reopen</button>

}
function heldStripHtml(title, reads, which) {
  const newest = reads.slice().sort((a, b) => new Date(b.clock) - new Date(a.clock))[0];
  return `<div data-race="${which}" data-mode="strip" class="strip${reads.length && which === 'held' ? ' heldon' : ''}" onclick="toggleHeld('${which}')" title="Click to open">
    <span class="chev">▸</span><h2>${title}</h2>
    ${newest ? `<span class="reason" style="font-size:12px">newest ${esc(newest.bib)} · ${esc(newest.reason)}</span>` : '<span class="sub">none</span>'}

/* The pane's More ▾ menu (floating, so a re-render does not close it) */
function paneMenu(btn, key) {
  const race = DATA.races[String(key)], res = DATA.results[String(key)] || { finishers: [] };
  openMenu(btn, [
    ['Export CSV…', () => saveAs(`/api/races/${key}/export.csv`, csvName(race), 'CSV file', 'text/csv', '.csv')],
    ...(res.finishers.length ? [['Save .lif… (for MeetPro)', () => openSaveLif(key)]] : []),
    ...(race.status === 'pending' ? [['Close race', () => closeRace(key)]] : []),
  ]);
}

/* Per-pane table order chosen with the tile arrows: null = place order
   (finishers by place, then on course); 'finish' asc/desc = by finish time
   with the on-course rows kept last; 'team' asc/desc = grouped by team in
   alphabetical order, place order inside each team, no-team rows last. */
const SORT = {};
function setSort(key, by, dir) {
  const cur = SORT[key];
  SORT[key] = cur && cur.by === by && cur.dir === dir ? null : { by, dir };
  render();
}
function sortRows(finishers, onCourse, sort) {
  if (!sort) return finishers.concat(onCourse);
  if (sort.by === 'finish') {
    const f = finishers.slice().sort((a, b) => a.finish.elapsed - b.finish.elapsed);
    return (sort.dir === 'desc' ? f.reverse() : f).concat(onCourse);
  }
  const rows = finishers.concat(onCourse);
  const team = r => (r.school || '').trim().toLowerCase();
  const dir = sort.dir === 'desc' ? -1 : 1;
  return rows.map((r, i) => [r, i]).sort(([a, ia], [b, ib]) => {
    const ta = team(a), tb = team(b);
    if (!ta !== !tb) return ta ? -1 : 1;             // rows without a team last
    if (ta !== tb) return dir * (ta < tb ? -1 : 1);
    return ia - ib;                                   // place order inside a team
  }).map(([r]) => r);
}
function sortArrows(key, by, title) {
  const cur = SORT[key], on = d => cur && cur.by === by && cur.dir === d ? ' on' : '';
  return `<span class="sort" title="${title}"><b class="${on('asc')}" onclick="setSort(${key}, '${by}', 'asc')">▲</b><b class="${on('desc')}" onclick="setSort(${key}, '${by}', 'desc')">▼</b></span>`;
}

function paneHtml(race, res, mode) {
  const g = race.gender || 'U', k = race.key, big = mode === 'big';
  const finishers = res ? res.finishers : [];
  const onCourse = res ? res.on_course : [];
  // the whole race: every finisher in place order, then everyone still on
  // course - one column per split point plus the finish (the table scrolls);
  // the Finish / Top team tile arrows re-order it
  // + everyone checked in (or on the roster) with no read yet, at the bottom,
  // so the table is the whole field; each moves up when a split or the
  // finish is read (2026-09-30)
  const notSeen = res ? (res.not_seen || []) : [];
  const rows = sortRows(finishers, onCourse, SORT[race.key]).concat(notSeen);
  const pts = (DATA.points || []).filter(p => !p.finish);
  // flash for 0.9 s after a read lands in this race; the pane is re-rendered
  // every second, so the animation is resumed from where it was
  const flashAt = FLASH[race.key] || 0, since = Date.now() - flashAt;
  const flash = since < 900 ? ` flash" style="animation-delay:-${since}ms` : '';
  // the newest finisher (finish within the last 8 s) is tinted green
  const newest = race.status === 'racing' ? finishers.filter(r => r.finish && Date.now() - new Date(r.finish.clock) < 8000).map(r => r.bib) : [];
  const closing = CLOSING[k], canFold = !big && OPENED[k] && !PINS[k];
  return `
  <div data-race="${k}" data-mode="${mode}" class="pane${race.status === 'racing' ? ' racing' : ''}${big ? ' big' : ''}${flash}">
    <div class="pane-head${canFold ? ' fold' : ''}"${canFold ? ` onclick="if (!event.target.closest('button')) collapsePane(${k})" title="Click to fold this race back to one line"` : ''}>
      ${gtag(g)}
      <div><h2>${esc(race.name)}</h2><div class="sub">Evt ${race.event}-${race.round}-${race.heat}</div></div>
      <span style="margin-left:auto"></span>
      <button class="btn small${PINS[k] ? ' on' : ''}" onclick="togglePin(${k})" title="${PINS[k] ? 'Pinned: stays full size whatever its status. Click to unpin.' : 'Keep this race full size whatever its status'}">${PINS[k] ? '● Pinned' : 'Pin open'}</button>
      <button class="btn small" onclick="openScoring(${k})" title="Scoring ${race.scoring.scorers}+${race.scoring.displacers} · fastest pace ${fmtPace(race.fastest_pace || DATA.fastest_pace_default)}/mi · gender · delete pane">Settings</button>
      <span class="badge ${race.status}" style="margin-left:0">${race.status.toUpperCase()}</span>
    </div>
    ${closing ? `<div class="countdown">Closed · folds to one line in <b class="num" data-until="${closing}"></b><button class="btn" onclick="keepOpen(${k})">Keep open</button></div>` : ''}
    <div class="gunrow">
      <span>Gun <span class="num">${race.gun ? fmtClock(race.gun) : '—'}</span>
        <span style="color:var(--ink-3)">${esc(race.gun_source)}</span>
        <button class="btn small" onclick="openGun(${race.key})">Gun ▾</button></span>
      <span class="clock num"${race.gun ? ` data-gun="${esc(race.gun)}"` : ''}></span>
      ${race.gun && race.status !== 'final' ? (STATUS && STATUS.led_clock_override && STATUS.led_clock_override.mode === 'race' && STATUS.led_clock_override.race === race.key
        ? `<button class="btn small" style="color:var(--good)" title="The LED clocks are pinned to this race. Click to go back to automatic." onclick="unpinClocks()">● on clocks</button>`
        : `<button class="btn small" title="Pin every LED clock (finish + split stations) to this race's time, e.g. for a straggler while the next race runs. Changes no gun." onclick="pinClocks(${race.key})">Show on clocks</button>`) : ''}
    </div>
    ${outageNote(race, STATUS)}
    ${attentionHtml(race, res)}
    <div class="summ">
      <span><span class="n num">${finishers.length}</span> / ${race.roster_count} finished ${sortArrows(k, 'finish', 'Order the table by finish time: ▲ fastest first, ▼ slowest first (click again for place order)')}</span>
      <span><span class="n num">${onCourse.length}</span> on course</span>
      <span title="${race.status === 'final' ? 'On the roster (checked in) but never read in this race' : 'Checked in, not read on the course yet - listed at the bottom of the table'}"><span class="n num">${notSeen.length}</span> ${race.status === 'final' ? 'no-show' : 'not seen yet'}</span>
      ${res && res.film ? filmPaneHtml(res.film) : ''}
      <span class="team">Top team <span class="n num">${res && res.teams.length ? res.teams[0].score : '—'}</span>${res && res.teams.length ? ' ' + esc(res.teams[0].team) : ''}
        ${sortArrows(k, 'team', 'Group the table by team: ▲ A to Z, ▼ Z to A (click again for place order)')}</span>
    </div>
    <div class="scroll" data-key="race-${k}"><table>
      <tr><th>Pl</th><th>Bib</th><th>Athlete</th>${pts.map(p => `<th class="right">${esc(p.label)}</th>`).join('')}<th class="right">Finish</th><th></th></tr>
      ${rows.map(r => rowHtml(k, r, pts, newest.includes(r.bib))).join('')}
    </table>
    ${res && res.teams.length ? teamsHtml(res.teams) : ''}</div>
    <div class="pane-foot">
      <button class="btn" onclick="openAdd(${k})">Add athlete</button>
      ${race.status === 'pending' ? `<button class="btn" title="Open check-in for this race" onclick="api('/api/races/${k}/status',{status:'checkin'})">Check-in</button>`
        : race.status !== 'final' ? `<button class="btn" onclick="closeRace(${k})">Close race</button>`
        : `<button class="btn" onclick="api('/api/races/${k}/status',{status:'racing'})">Reopen</button>`}
      <button class="btn" onclick="paneMenu(this, ${k})" title="Export CSV, Save .lif for MeetPro">More ▾</button>
    </div>
  </div>`;
}

/* "Save to .lif": FinishLynx lists the athlete without a time; the timer
   decides whether the mat read is a real finish (never automatic - a DNF
   walking past the mat must not become a result). */
async function chipToLif(key, bib, on) {
  const res = DATA.results[String(key)] || { finishers: [] }, r = res.finishers.find(x => x.bib === bib);
  const t = r && r.finish ? fmtElapsed(r.finish.elapsed) : '';
  if (on && !confirm(`Put bib ${bib}${r ? ' ' + r.last_name : ''}'s chip time ${t} into the .lif MeetPro reads?\n\nFinishLynx has no time for this athlete. Only do this if it is a real finish, not someone walking past the mat.`)) return;
  if (!on && !confirm(`Take bib ${bib}'s chip time back out of the .lif? MeetPro then shows them without a time again.`)) return;
  await api(`/api/races/${key}/chip_lif`, { bib, on });
}

function deletePane(key) {
  const r = DATA.races[String(key)], res = DATA.results[String(key)] || { finishers: [], on_course: [] };
  const n = res.finishers.length + res.on_course.length;
  if (!confirm(`Delete the "${r.name}" pane?` + (n ? ` Its ${n} athlete(s)' reads move to the Held pane (nothing is lost).` : ''))) return;
  api(`/api/races/${key}/delete`);
}

/* One row per athlete with every split in its own column. A time reads
   "6:12.3", "~6:12.3" when estimated, "6:12.3*" when hand-edited, "m" flag
   when typed. A finisher missing a split the race has gets a clickable ⚠
   in that column; a runner still on course shows "—" for what is to come. */
function cellHtml(s) {
  if (!s) return '—';
  return `${s.estimated ? '~' : ''}${fmtElapsed(s.elapsed)}${s.overridden ? '*' : ''}${s.manual && !s.estimated ? ' <span class="flag">m</span>' : ''}${s.fl_only ? ' <span class="flag miss" title="Only in FinishLynx: the reader has no finish for this athlete. The time is FinishLynx&#39;s, from its saved .lif.">FL only</span>' : ''}${s.corrected ? ` <span class="flag" title="mat read ${fmtElapsed(s.raw_elapsed)}${s.antenna ? ' on A' + s.antenna : ''} − film offset ${(s.correction || 0).toFixed(3)} s">f</span>` : ''}${s.not_in_finishlynx ? ' <span class="flag miss" title="Finished while another race was running: kept out of FinishLynx (it would have landed in that race). It is in this pane and the .lif for MeetPro; add it in FinishLynx by hand if you want it there.">not in FL</span>' : ''}`;
}
function rowHtml(raceKey, r, pts, newest) {
  if (r.checked_in !== undefined) {
    // on the roster, nothing read in this race yet
    return `<tr class="notseen">
      <td class="num"></td>
      <td class="bib num">${esc(r.bib)}</td>
      <td>${esc(r.last_name)}${r.school ? ' · ' + esc(r.school) : ''}</td>
      ${(pts || []).map(() => '<td class="right num split">—</td>').join('')}
      <td class="right split">${r.checked_in ? `checked in <span class="num">${fmtClock(r.checked_in).slice(0, 8)}</span>` : 'on roster'}</td>
      <td><button class="btn small" title="Add a time for this athlete (hand time, coach's split)" onclick="openAdd(${raceKey}, '${esc(r.bib)}')">+ time</button></td>
    </tr>`;
  }
  const fin = r.finish;
  const missing = r.missing || [];
  const cells = (pts || []).map(p => {
    const s = r.splits.find(x => x.point === p.id);
    if (s) return `<td class="right num split">${cellHtml(s)}</td>`;
    if (missing.includes(p.id))
      return `<td class="right num split"><span class="miss" title="No ${esc(p.label)} for this finisher — click to add it (estimate offered)" onclick="openAdd(${raceKey}, '${esc(r.bib)}', '${esc(p.id)}', true)">⚠ add</span></td>`;
    return `<td class="right num split">—</td>`;
  }).join('');
  return `<tr${missing.length ? ' class="review"' : newest ? ' class="newest"' : ''}>
    <td class="num">${r.place || ''}</td>
    <td class="bib num">${esc(r.bib)}</td>
    <td>${esc(r.last_name)}${r.school ? ' · ' + esc(r.school) : ''}</td>
    ${cells}
    <td class="right num split">${!fin ? '—'

/* Race picker fed by the meet folder's .evt: one row per event/round/heat

async function openFromEvt() {
  let d;

}
let EVT_RACES = [];
function evtToggleRow(ev, i) {
  if (ev.target.tagName === 'INPUT' || ev.target.tagName === 'BUTTON') return;
  const cb = document.querySelector(`.evt-pick[data-i="${i}"]`);
  if (cb) { cb.checked = !cb.checked; evtCount(); }
}
function evtSelectAll(on) {
  document.querySelectorAll('.evt-pick').forEach(cb => { cb.checked = on; });

}
function evtCount() {
  const n = document.querySelectorAll('.evt-pick:checked').length;
  const b = document.getElementById('evt-add-sel');
  if (b) { b.disabled = !n; b.textContent = n ? `Add ${n} selected` : 'Add selected'; }

}
async function addFromEvt(i) {
  const r = EVT_RACES[i];
  if (!r || r.pane_key) return;
  const btn = document.getElementById(`evt-add-${i}`);
  if (btn) { btn.disabled = true; btn.textContent = '…'; }
  const res = await api('/api/races/create', {
    name: r.name, event: r.event, round: r.round, heat: r.heat, gender: r.gender,
    distance: r.distance, scorers: 5, displacers: 2, entries: r.bibs || [] });
  if (res && res.key) {
    r.pane_key = res.key;
    if (btn) btn.outerHTML = '<span class="pt fin">has pane</span>';
    const cb = document.querySelector(`.evt-pick[data-i="${i}"]`);

async function addSelectedFromEvt() {

/* Start-signal options: time of day the gun fired, where it came from, and
   what the race clock would read right now if that were the gun ("now
   +12:34") - the quickest way to tell a real start from a sensor knock
   once a dozen triggers have piled up. The "now" part re-renders every
   second while a dialog is open (tickStartOptions). */
function startOptionLabel(ts, source) {
  const secs = (Date.now() - new Date(ts).getTime()) / 1000;
  return `${fmtClock(ts)} · ${source} · now +${fmtRace(secs)}`;
}
function startOption(s, extra) {
  return `<option value="${esc(s.ts)}" data-ts="${esc(s.ts)}" data-source="${esc(s.source)}"${extra || ''}>${esc(startOptionLabel(s.ts, s.source))}</option>`;
}
function tickStartOptions() {
  const d = document.getElementById('dlg');
  if (!d.open) return;

function optionSource(selectId) {
  const sel = document.getElementById(selectId), o = sel && sel.options[sel.selectedIndex];
  return (o && o.dataset.source) || 'picked signal';
}

function openGun(key) {
  const race = DATA.races[String(key)];
  // This pane's own candidates first (newest on top), then every other
  // start the console heard recently that is not already among them - a
  // start that was routed to another pane, or to none, is still one click
  // away here.
  const own = race.gun_candidates.slice().reverse();
  const near = ts => own.some(c => Math.abs(new Date(c.ts) - new Date(ts)) < 2000);
  const others = ((STATUS && STATUS.recent_starts) || []).filter(s => !near(s.ts));
  const cands = own.map(c => startOption(c, race.gun === c.ts ? ' selected' : '')).join('');
  const extra = others.length
    ? `<optgroup label="Other starts heard by the console">${others.map(s => startOption(s)).join('')}</optgroup>` : '';
  dlg(`<h3>Gun — ${esc(race.name)}</h3><div class="body">

    ${race.gun ? `<div class="hint" style="font-size:11.5px;color:var(--ink-3)">Current gun ${fmtClock(race.gun)} (${esc(race.gun_source)}).</div>` : ''}
    <label>…or set manually (HH:MM:SS.mmm, blank = pick above)</label>

/* Add a read by hand. For a split point the server offers an estimate
   (the athlete's own pace over the course distances, and the pack they
   were running with) - "Use" fills the time and marks the read estimated,
   which shows as an "est" flag here and a tilde + column in the CSV. A
   finish is never estimated: it is typed, or it is not a result. */
/* "Needs attention" (2026-09-26, replaces the review badge, the pop-up at
   finish time and the close-race detour): a strip at the top of the pane
   listing every finisher lacking a split the other runners have (a
   station is "expected" once anyone has a real read there), each with
   Estimate (add dialog, estimate pre-accepted), Add time (the coach's
   hand time) and Publish without splits (accept the gap: they leave the
   list, undo below). Until a row is fixed, MeetPro shows that athlete's
   splits up to the gap - it files splits by position, so a later split
   cannot be written past a missing one. Empty = nothing rendered. */
function attentionHtml(race, res) {
  if (!res) return '';
  const rows = res.finishers.filter(r => (r.missing || []).length);
  const waived = res.finishers.filter(r => (r.waived || []).length && !(r.missing || []).length);
  if (!rows.length && !waived.length) return '';
  const n = rows.reduce((s, r) => s + r.missing.length, 0);
  return `<div class="attention">
    ${rows.length ? `<h4 title="MeetPro shows their splits up to the gap until it is filled">Needs attention · ${rows.length} finisher${rows.length === 1 ? '' : 's'} missing a split
      ${n > 1 ? `<button class="btn" title="Estimate every missing split in this race at once (each flagged est)" onclick="estimateAllMissing(${race.key})">Estimate all (${n})</button>` : ''}</h4>` : ''}
    ${rows.map(r => `<div class="row"><span class="num">${r.place}</span><span class="bib num">${esc(r.bib)}</span>
        <span>${esc(r.last_name)}${r.first_name ? ', ' + esc(r.first_name) : ''}${r.school ? ' · ' + esc(r.school) : ''}</span>
        ${r.missing.map(p => `<span class="flag miss" style="cursor:default">no ${esc(pointLabel(p))}</span>
          <button class="btn primary" title="Add ${esc(pointLabel(p))} with the estimate filled in — press Add to accept it (flagged est), or overtype it" onclick="openAdd(${race.key}, '${esc(r.bib)}', '${esc(p)}', true)">Estimate</button>
          <button class="btn" title="Type the coach's hand time for ${esc(pointLabel(p))}" onclick="openAdd(${race.key}, '${esc(r.bib)}', '${esc(p)}', false)">Add time</button>`).join('')}
        <button class="btn" style="margin-left:auto" title="Accept that this athlete has no ${r.missing.map(pointLabel).map(esc).join(' / ')} read: they keep their finish and place, MeetPro gets their splits up to the gap, and they leave this list (undo below)" onclick="waiveMissing(${race.key}, '${esc(r.bib)}')">Publish without split${r.missing.length > 1 ? 's' : ''}</button></div>`).join('')}
    ${waived.length ? `<div class="row hint">Published without splits: ${waived.map(r => `<span class="bib num">${esc(r.bib)}</span> ${esc(r.last_name)} <a href="#" onclick="waiveMissing(${race.key}, '${esc(r.bib)}', true); return false">undo</a>`).join(' · ')}</div>` : ''}
  </div>`;
}
function waiveMissing(key, bib, undo) {
  api(`/api/races/${key}/waive`, { bib, undo: !!undo });
}

/* Publishing switch (Stations panel): OFF keeps every read here - heard,
   classified, backed up to reads-<date>.txt in the RFID folder - but sends
   nothing to FinishLynx and writes no merged .lif (warm-ups, tag checks, a
   test start). Always ON after a restart. Switching ON asks whether the
   reads kept back meanwhile should go to FinishLynx now; the .lif files
   catch up by themselves. */
async function setPublishing(on) {
  const s = STATUS || {};
  const racing = DATA && DATA.enabled ? DATA.order.map(k => DATA.races[String(k)]).filter(r => r.status === 'racing') : [];
  if (!on && racing.length && !confirm(`${racing.map(r => r.name).join(', ')} is racing. Switch publishing OFF anyway?\n\nFinishes will NOT reach FinishLynx or MeetPro until it is switched back on.`)) {
    applyPublishing(s); return;
  }
  let flush = false;
  if (on && s.publish_kept_back)
    flush = confirm(`${s.publish_kept_back} read${s.publish_kept_back > 1 ? 's' : ''} reached the console while publishing was off.\n\nSend them to FinishLynx now?\nOK = send (in time order; a runner's finish becomes their result there).\nCancel = leave them out (warm-ups, tests). The .lif files catch up either way.`);
  const d = await api('/api/publish', { on, flush });
  if (d && d.ok) {
    STATUS = Object.assign(STATUS || {}, { publishing: d.publishing, publish_kept_back: d.kept_back,
                                           publish_off_since: on ? null : new Date().toISOString() });
    applyPublishing(STATUS); renderAlarm(STATUS);
    if (on && flush) alert(`${d.sent} read${d.sent === 1 ? '' : 's'} sent to FinishLynx.`);
  }
}
function applyPublishing(s) {
  const cb = document.getElementById('pub-on'), v = document.getElementById('pub-v');
  if (!cb) return;
  const on = s.publishing !== false;
  cb.checked = on;
  v.textContent = on ? 'ON' : 'OFF';
  v.style.color = on ? 'var(--good)' : 'var(--crit)';
}

/* Save as...: fetch a file from the console and let the operator choose
   where it goes (Chrome/Edge save picker on this PC). Browsers without the
   picker - or a console opened from another machine - get a normal
   download instead. */
async function saveAs(url, name, desc, mime, ext) {
  let blob;
  try {
    const r = await fetch(url);
    if (!r.ok) { let e = {}; try { e = await r.json(); } catch (x) {} alert(e.error || 'export failed'); return false; }
    blob = await r.blob();
  } catch (e) { alert('request failed: ' + e); return false; }
  if (window.showSaveFilePicker) {
    try {
      const h = await window.showSaveFilePicker({ suggestedName: name, types: [{ description: desc, accept: { [mime]: [ext] } }] });
      const w = await h.createWritable(); await w.write(blob); await w.close();
      return true;
    } catch (e) {
      if (e && e.name === 'AbortError') return false;       // operator cancelled the picker
    }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  return true;
}
function csvName(race) {
  return `${(race.name || 'race' + race.key).replace(/[^A-Za-z0-9_-]+/g, '_').replace(/^_+|_+$/g, '')}-results.csv`;
}
function exportMeet() {
  const d = new Date(), pad = n => String(n).padStart(2, '0');
  saveAs('/api/races/export.csv', `meet-results-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}.csv`,
         'CSV file', 'text/csv', '.csv');
}

/* Save .lif: the pane's results in the same merged layout the console

function openSaveLif(key) {

    <label style="display:flex;align-items:center;gap:8px;white-space:nowrap"><input type="radio" name="f-lif" value="splits" checked onchange="saveLifMode()" style="width:auto;flex:none;margin:0"> Finish times <b>&nbsp;and splits&nbsp;</b> (${(DATA.points || []).filter(p => !p.finish).map(p => esc(p.label)).join(', ')})</label>
    <label style="display:flex;align-items:center;gap:8px;white-space:nowrap;margin-top:4px"><input type="radio" name="f-lif" value="finish" onchange="saveLifMode()" style="width:auto;flex:none;margin:0"> Finish times only</label>

        ${missing.map(r => `<tr><td class="num">${r.place}</td><td class="bib num">${esc(r.bib)}</td>
          <td>${esc(r.last_name)}${r.school ? ' · ' + esc(r.school) : ''}</td>
          <td>${r.missing.map(p => `<button class="btn small" title="Add ${esc(pointLabel(p))} with the estimate filled in, or type the coach's hand time" onclick="closeDlg(); openAdd(${key}, '${esc(r.bib)}', '${esc(p)}', true)">+ ${esc(pointLabel(p))}</button>`).join(' ')}</td></tr>`).join('')}
      </table>
      <div class="hint" style="font-size:11.5px;color:var(--ink-3);margin-top:6px">How to proceed, per athlete: <b>+ Mile</b> opens the add dialog with an estimate ready (press Add, or overtype a hand time from the coach) — or press <b>Estimate all</b> below — or <b>save anyway</b>: that athlete's splits stop before the missing one (MeetPro files splits by position, so a later split can't be written without it).</div>` :
      `<div class="hint" style="font-size:11.5px;color:var(--good)">Every finisher has all the splits the race has.</div>`}</div>
    <div class="hint" style="font-size:11.5px;color:var(--ink-3);margin-top:8px">File name: <span class="num">${esc(name)}</span>. <b>Save as…</b> asks where to put it; <b>Save to lif-exports</b> writes <span class="num">lif-exports\\${esc(name)}</span> inside the meet folder. Neither touches FinishLynx's own file. ${res.on_course.length ? `${res.on_course.length} athlete${res.on_course.length > 1 ? 's are' : ' is'} still on course (listed with their splits so far).` : ''}</div>
  </div><div class="foot">
    <button class="btn" onclick="closeDlg()">Cancel</button>
    ${missing.length ? `<button class="btn" onclick="estimateAllMissing(${key}).then(() => openSaveLif(${key}))">Estimate all</button>` : ''}
    <button class="btn" id="f-lif-save" onclick="saveLif(${key})">Save to lif-exports</button>
    <button class="btn primary" onclick="saveLifAs(${key}, '${esc(name)}')">Save as…</button>

}

/* The pick-list in the Add dialog: each read the console has heard, newest
   first, with who it was (from the .ppl) and what its finish time would be
   in THIS race (read clock minus this pane's gun). Reads already in the
   race are dimmed; a read from before the gun shows no race time. */
function liveReadsHtml(key) {
  const race = DATA.races[String(key)], res = DATA.results[String(key)];
  const inRace = new Set(res ? res.finishers.concat(res.on_course).map(r => r.bib) : []);
  const gun = race.gun ? new Date(race.gun).getTime() : null;
  if (!LIVE_READS.length) return '<div class="note">no reads heard yet</div>';
  return '<table>' + LIVE_READS.map((r, i) => {
    const a = r.athlete || {};
    const who = [a.last_name ? `${a.last_name}${a.first_name ? ', ' + a.first_name : ''}` : '', a.school, a.gender].filter(Boolean).join(' · ');
    const t = new Date(r.ts).getTime();
    const fin = gun && isFinite(t) && t > gun ? fmtElapsed((t - gun) / 1000) : '';
    const dim = inRace.has(r.bib) ? ' style="opacity:.55"' : '';
    return `<tr${dim} title="click to fill the form with this read" onclick="useLiveRead(${key}, ${i})" style="cursor:pointer">
      <td class="right num">${esc(r.time || fmtClock(r.ts))}</td>
      <td class="bib num">${esc(r.bib)}</td>
      <td>${esc(who) || '<span style="color:var(--ink-3)">not in roster</span>'}</td>
      <td><span class="pt">${esc(r.point || r.reader_id || '')}</span></td>
      <td class="right num">${fin ? `<b>${esc(fin)}</b>` : '<span style="color:var(--ink-3)">—</span>'}</td>
    </tr>`;
  }).join('') + '</table>';
}
function useLiveRead(key, i) {
  const r = LIVE_READS[i]; if (!r) return;
  document.getElementById('f-bib').value = r.bib;
  document.getElementById('f-clock').value = r.time || fmtClock(r.ts);
  document.getElementById('f-elapsed').value = '';
  document.getElementById('f-estflag').checked = false;
  const pt = (DATA.points || []).find(p => p.id === r.point) ? r.point
           : (r.reader_id === 'FINISH' || !r.point ? 'FINISH' : null);
  if (pt) document.getElementById('f-point').value = pt;
  const race = DATA.races[String(key)];
  const t = new Date(r.ts).getTime(), gun = race.gun ? new Date(race.gun).getTime() : null;
  document.getElementById('f-conv').textContent = gun && t > gun
    ? `read at ${r.time || fmtClock(r.ts)} = ${fmtElapsed((t - gun) / 1000)} after the gun`
    : `read at ${r.time || fmtClock(r.ts)}`;
  estimateNow(key);
}
/* Coach says "6:12 at the mile": convert against the pane's gun so the
   clock field shows what will be stored; typing a clock time clears the
   race-time field so there is only ever one source of truth. */
function raceTimeTyped(key) {
  const race = DATA.races[String(key)], secs = parseElapsed(gv('f-elapsed'));
  const conv = document.getElementById('f-conv');
  document.getElementById('f-estflag').checked = false;
  if (!gv('f-elapsed').trim()) { conv.textContent = ''; return; }
  if (secs == null || !race.gun) { conv.textContent = 'Race time like 6:12.3 or 1:02:03'; return; }
  const ts = new Date(new Date(race.gun).getTime() + secs * 1000);
  const pad = (n, w) => String(n).padStart(w, '0');
  document.getElementById('f-clock').value =
    `${pad(ts.getHours(), 2)}:${pad(ts.getMinutes(), 2)}:${pad(ts.getSeconds(), 2)}.${pad(ts.getMilliseconds(), 3)}`;
  conv.textContent = `${fmtElapsed(secs)} after the gun = clock ${document.getElementById('f-clock').value}`;
}
function clockTyped() {
  document.getElementById('f-estflag').checked = false;
  document.getElementById('f-elapsed').value = '';
  document.getElementById('f-conv').textContent = '';
}
let EST_TIMER = null, EST_LAST = null;
function estimateLater(key) { clearTimeout(EST_TIMER); EST_TIMER = setTimeout(() => estimateNow(key), 350); }
async function estimateNow(key) {
  const box = document.getElementById('f-est'); if (!box) return;
  const bib = gv('f-bib').trim(), point = gv('f-point');
  EST_LAST = null;
  if (!bib) { box.textContent = ''; return; }
  const p = (DATA.points || []).find(x => x.id === point);
  if (p && p.finish) { box.textContent = 'Finish times are typed, never estimated.'; return; }
  box.textContent = 'estimating…';
  let d;
  try { d = await (await fetch(`/api/races/${key}/estimate?bib=${encodeURIComponent(bib)}&point=${encodeURIComponent(point)}`)).json(); }
  catch (e) { d = { ok: false, reason: String(e) }; }
  if (gv('f-bib').trim() !== bib || gv('f-point') !== point) return;   // stale
  if (!d.ok) { box.textContent = 'No estimate: ' + d.reason; return; }
  EST_LAST = d;
  const line = x => x ? `${fmtElapsed(x.elapsed)} (${x.detail})` : '—';
  box.innerHTML = `<div><b style="color:var(--ink-1)">Suggested ${esc(fmtElapsed(d.suggested.elapsed))}</b>
      <span class="num">${esc(fmtClock(d.suggested.clock))}</span> · ${esc(d.method)}
      <button class="btn small" onclick="useEstimate()">Use</button></div>
    <div>pace: ${esc(line(d.pace))}</div><div>neighbours: ${esc(line(d.neighbours))}</div>`;
}
function useEstimate() {
  if (!EST_LAST) return;
  document.getElementById('f-clock').value = fmtClock(EST_LAST.suggested.clock);
  document.getElementById('f-elapsed').value = '';
  document.getElementById('f-conv').textContent = `estimate: ${fmtElapsed(EST_LAST.suggested.elapsed)} after the gun`;
  document.getElementById('f-estflag').checked = true;
}
function submitAdd(key) {
  const body = { bib: gv('f-bib').trim(), point: gv('f-point'), clock: gv('f-clock').trim(),
                 estimated: document.getElementById('f-estflag').checked };

  // the clock field was only a preview.
  if (gv('f-elapsed').trim()) { body.elapsed = gv('f-elapsed').trim(); delete body.clock; }
  if (!body.bib || !(body.clock || body.elapsed)) { alert('Bib and a race time or clock time are required'); return; }

}

    <div class="hint" style="font-size:11.5px;color:var(--ink-3);margin-top:4px">

function editTime(readId, current) {

/* Assign a held/ignored read: who it is, and the time it would have in each
   race from that race's gun (a finish-mat read film-corrected like the
   race's own finishers). The likeliest race is picked: same gender, the
   latest gun before the read. (2026-09-30, user's ask) */
function filmCorr(r, race) { return (r.corrections || {})[String(race.key)] || 0; }   // each race its own
function assignTime(r, race) {
  if (!race || !race.gun) return null;
  return (new Date(r.clock) - new Date(race.gun)) / 1000 - filmCorr(r, race);
}
function openAssign(readId) {
  const r = (DATA.held || []).concat(DATA.ignored || []).find(x => x.id === readId);
  if (!r) return;
  const races = DATA.order.map(k => DATA.races[String(k)]);
  const timeText = race => { const t = assignTime(r, race); return t == null ? 'no gun' : t < 0 ? 'before the gun' : fmtElapsed(t); };
  const fits = race => race.gun && assignTime(r, race) >= 0 && (!r.gender || !race.gender || race.gender === 'X' || race.gender === r.gender);
  const best = races.filter(fits).sort((a, b) => new Date(b.gun) - new Date(a.gun))[0];
  const who = [r.last_name ? `${esc(r.last_name)}${r.first_name ? ', ' + esc(r.first_name) : ''}` : 'not in the .ppl',
               r.gender, r.school].filter(Boolean).join(' · ');
  dlg(`<h3>Assign read to race</h3><div class="body">
    <div style="margin-bottom:8px"><b class="num">${esc(r.bib)}</b> ${who} — ${esc(r.label)} at <span class="num">${fmtClock(r.clock)}</span></div>
    <label>Race</label><select id="f-to" onchange="assignPreview(${readId})">${races.map(x =>
      `<option value="${x.key}" ${best && x.key === best.key ? 'selected' : ''}>${esc(x.name)} (${x.status}) — ${timeText(x)}</option>`).join('')}</select>
    <div id="f-assign-time" style="margin-top:8px"></div>
  </div><div class="foot">
    <button class="btn" onclick="closeDlg()">Cancel</button>
    <button class="btn primary" onclick="closeDlg();api('/api/reads/${readId}/assign',{race: gv('f-to')}).then(d => { if (d && d.finishlynx && d.finishlynx.startsWith('not sent')) alert(d.finishlynx); })">Assign</button>
  </div>`);
  assignPreview(readId);
}
function assignPreview(readId) {
  const r = (DATA.held || []).concat(DATA.ignored || []).find(x => x.id === readId);
  const race = DATA.races[String(gv('f-to'))], el = document.getElementById('f-assign-time');
  if (!r || !race || !el) return;
  const t = assignTime(r, race);
  el.innerHTML = t == null ? `<span style="color:var(--warn)">${esc(race.name)} has no gun yet: no time until it gets one.</span>`
    : t < 0 ? `<span style="color:var(--crit)">This read is ${fmtElapsed(-t)} before ${esc(race.name)}'s gun (${fmtClock(race.gun)}) - not this race.</span>`
    : `${r.finish ? 'Finish' : esc(r.label)} time in ${esc(race.name)}: <b class="num" style="font-size:16px">${fmtElapsed(t)}</b>
       <span style="color:var(--ink-3)">(gun ${fmtClock(race.gun)}${filmCorr(r, race) ? `, film offset ${filmCorr(r, race).toFixed(2)} s` : ''})</span>`
      + (r.gender && race.gender && race.gender !== 'X' && race.gender !== r.gender ? `<div style="color:var(--warn)">Gender: athlete ${r.gender}, race ${race.gender}.</div>` : '');
}

/* ---------------------------- wiring ---------------------------- */

const socket = io();
/* Flash a pane when a read lands in its race: compare each race's count of
   assigned reads with the previous snapshot (the read itself carries no
   race key; the races_update that follows it does). */
const FLASH = {}, READ_COUNTS = {};
function noteNewReads(d) {
  if (!d || !d.enabled) return;
  for (const key of d.order) {
    const res = d.results[String(key)] || { finishers: [], on_course: [] };
    const n = res.finishers.concat(res.on_course).reduce((a, r) => a + r.splits.length + (r.finish ? 1 : 0), 0);
    if (key in READ_COUNTS && n > READ_COUNTS[key]) FLASH[key] = Date.now();
    READ_COUNTS[key] = n;
  }
}
socket.on('races_update', d => { noteNewReads(d); DATA = d; render(); renderStations(); renderEvtSync(); });
socket.on('status_update', applyStatus);
socket.on('tag_read', onTagRead);
socket.on('reads_cleared', () => { LIVE_READS = []; });
socket.on('remote_unit_update', pollUnits);

(async () => {
  refresh(); pollStatus(); pollUnits(); seedLiveReads();
  try {
    const c = await (await fetch('/api/config')).json();
    CFG = c;
    if (c.event_directory) {
      showMeet(c.event_directory);
      // athletes reload at boot from the remembered folder
      try {
        const a = await (await fetch('/api/athletes')).json();
        if (a.success) showMeet(c.event_directory, `${Object.keys(a.by_bib || {}).length} athletes · ${(a.schools || []).length} schools`);
      } catch (e) {}
    }
  } catch (e) {}
  // #gun=<race key> opens that pane's Gun picker on load (screenshots/tests);
  // #add=<race key>:<bib>:<point> opens the Add-split dialog prefilled.
  const g = /[#&]gun=(\d+)/.exec(location.hash);
  if (g) setTimeout(() => { if (DATA && DATA.races[g[1]]) openGun(parseInt(g[1])); }, 1500);
  // (append :auto to accept the estimate up front, as the review buttons do)
  const a = /[#&]add=(\d+):([^:&]*):([^:&]*)(?::(auto))?/.exec(location.hash);
  if (a) setTimeout(() => { if (DATA && DATA.races[a[1]]) openAdd(parseInt(a[1]), decodeURIComponent(a[2]), decodeURIComponent(a[3]), !!a[4]); }, 1500);
  // #settings=<key> opens a pane's race settings
  const st = /[#&]settings=(\d+)/.exec(location.hash);
  if (st) setTimeout(() => { if (DATA && DATA.races[st[1]]) openScoring(parseInt(st[1])); }, 1500);
  const sl = /[#&]savelif=(\d+)/.exec(location.hash);
  if (sl) setTimeout(() => { if (DATA && DATA.races[sl[1]]) openSaveLif(parseInt(sl[1])); }, 1500);
  // #pop=stations, #pop=fl, #pop=clocks, #pop=app, #pop=reader or
  // #pop=unit:S1 opens a popover on load (handy for screenshots/tests).
  // Old names still work: sb/cam/film -> fl, pi/lora -> stations,
  // reads -> app, clock:COMx -> clocks.
  const m = /[#&]pop=([a-z]+)(?::([^&]+))?/.exec(location.hash);
  if (m) setTimeout(() => {
    const kind = { sb: 'fl', cam: 'fl', film: 'fl', pi: 'stations', lora: 'stations', reads: 'app', clock: 'clocks' }[m[1]] || m[1];
    const chip = document.querySelector(`.chip[data-pop="${kind}"]`);
    if (chip) togglePop(chip);
    else if (kind === 'unit' || kind === 'reader')
      openPop(kind, kind === 'unit' ? decodeURIComponent(m[2] || '') : null, document.getElementById('chip-st'));
  }, 1500);
})();
setInterval(pollStatus, 3000);
setInterval(pollUnits, 5000);
setInterval(() => { if (DATA && DATA.enabled) render(); }, 1000);
setInterval(tickStartOptions, 1000);
setInterval(renderStationsChip, 1000);     // the dots fade by the second
setInterval(() => { if (CLOCK_STATUS) renderClocksChip(CLOCK_STATUS); }, 1000);   // the clocks tick
</script>
</body>
</html>
