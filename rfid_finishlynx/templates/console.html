  const own = ((DATA && DATA.points) || []).find(q => q.id === id);
  return own ? own.label : `"${id}" (not a known split point)`;
}
/* The Location <select> of one row in the Stations panel: any single point
   (a mile marker or the finish), a run of points for one mat crossed more
   than once (by pass order), and the loop-course "skip the first crossing"
   forms. The value is the comma-joined point list; choosing a station's
   own id (or Finish for the local mat) clears its entry in reader_points. */
function locationValue(id) {
  const cur = unitPoints(id);
  return cur ? cur.join(',') : id;
}
function locationOptions(id) {
  const all = (DATA && DATA.points) || [];
  const splits = all.filter(p => !p.finish), fins = all.filter(p => p.finish);
  const curKey = locationValue(id);
  const opts = [];
  for (const p of fins.concat(splits)) opts.push([p.id, p.label]);
  if (splits.length >= 2)
    opts.push([splits.map(p => p.id).join(','), splits.map(p => p.label).join(', then ') + ' (one mat)']);
  for (const f of fins)
    for (let i = 0; i < splits.length; i++) {
      const run = splits.slice(i).concat([f]);
      opts.push([run.map(p => p.id).join(','), run.map(p => p.label).join(', then ') + ' (one mat)']);
    }
  for (const p of fins.concat(splits)) opts.push([`-,${p.id}`, `${p.label}, skip 1st crossing (loop)`]);
  // check-in chute: every tag read joins the race whose Check-in is open
  opts.push([chuteId(), 'Check-in (chute)']);
  opts.push(['off', 'Not in use']);
  if (!opts.some(o => o[0] === curKey)) opts.push([curKey, (unitPoints(id) || [id]).map(pointLabel).join(', then ')]);
  return opts.map(([v, t]) => `<option value="${esc(v)}" ${v === curKey ? 'selected' : ''}>${esc(t)}</option>`).join('');
}

async function setLocation(id, v) {
  const pts = v.split(',').filter(Boolean);
  const rp = Object.assign({}, (DATA && DATA.reader_points) || {});
  if (pts.length === 1 && pts[0] === id) delete rp[id]; else rp[id] = pts;
  const fin = finishPointIds();
  const isFin = pts.some(p => fin.includes(p));
  // every other reader that is at the finish right now
  const others = Object.keys(rp).filter(r => r !== id && rp[r].some(p => fin.includes(p)))
    .concat(fin.filter(f => f !== id && !rp[f]));
  const name = r => r === LOCAL_READER ? 'This PC' : r;

      && !confirm(`No station would be at the finish line: nobody gets placed until one is set to Finish. Move ${name(id)} to ${pts.map(pointLabel).join(', then ')} anyway?`)) {

  // use (two mats at the line is legitimate, so Cancel keeps them).

    for (const o of others) rp[o] = ['off'];

function clockCheckText(c) {
  if (!c || !c.sent) return '';

  if (!c.replies) return 'No replies: the link is down, or the station runs software without the clock check.';
  const late = c.offset >= 0 ? 'late' : 'early';
  let t = `${c.replies} of ${c.sent} replied · round trip ${secMs(c.delay_min)} best, ${secMs(c.delay_median)} typical<br>`
        + `Station read times ${secMs(Math.abs(c.offset))} ${late} (±${secMs(c.offset_spread / 2)})`;
  if (c.air_suggested !== undefined && Math.abs(c.offset) > 0.02)

  else if (c.air !== null && c.air !== undefined) t += ` · air latency ${c.air} s is right`;
  return t;

/* One chip for all LED clocks. Green = every clock in use is driving, amber
   = some are (the rest unplugged since, or their port held by FinishLynx),
   red = none is. A configured clock not plugged in since the console
   started is not in use at this meet and is left out. The text says what the clocks show right now. With clocks
   disabled in config the chip is simply absent. */
function fmtRace(sec) {
  if (sec == null || !isFinite(sec)) return '';
  sec = Math.max(0, sec);
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = Math.floor(sec % 60);
  return (h ? `${h}:${String(m).padStart(2, '0')}` : `${m}`) + ':' + String(s).padStart(2, '0');
}
/* What every clock is being sent right now: race time from the gun in use
   (and whose gun it is), a manual count-up, or this PC's time of day in
   the clocks' 12/24-hour format. Worked out on the PC's clock (status
   server_time), so a browser on another laptop shows the same thing. */
let SERVER_SKEW = 0;      // PC clock - browser clock, ms
function clockDisplay(s) {
  const now = Date.now() + SERVER_SKEW;
  const ov = s.led_clock_override;
  if (s.led_clock_gun) {
    const gun = new Date(s.led_clock_gun).getTime();
    const pane = () => {
      const r = (DATA && DATA.enabled ? Object.values(DATA.races) : [])
        .find(r => r.gun && Math.abs(new Date(r.gun).getTime() - gun) < 1000);
      return r ? r.name : 'race pane';
    };
    const what = { manual: 'count-up', pinned: (ov && ov.race_name) || 'pinned race', race: pane(),
                   camera: 'camera start', finishlynx: 'FinishLynx clock', lora: 'gun over radio' }[s.led_clock_source] || 'race time';
    return { value: fmtRace((now - gun) / 1000), what };
  }
  const d = new Date(now);
  const hf = (CFG && CFG.led_clock && CFG.led_clock.hour_format) || '24';
  const h = hf === '12' ? (d.getHours() % 12 || 12) : String(d.getHours()).padStart(2, '0');
  const p2 = n => String(n).padStart(2, '0');
  return { value: `${h}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`,
           what: ov && ov.mode === 'tod' ? 'time of day (held)' : 'time of day' };
}
let CLOCK_STATUS = null;
function renderClocksChip(s) {
  // the skew is taken when a status arrives, not on the per-second redraw
  if (s !== CLOCK_STATUS && s.server_time) SERVER_SKEW = new Date(s.server_time).getTime() - Date.now();
  CLOCK_STATUS = s;

  chip.hidden = !s.led_clock_enabled;
  if (chip.hidden) return;
  const all = Array.isArray(s.led_clocks) ? s.led_clocks : [];
  // unidentified serial devices, clocks disabled here, and configured clocks
  // not plugged in since the console started (not used at this meet) do not
  // count; one that was plugged in and went away does (2026-09-30)
  const clocks = all.filter(c => c.enabled !== false && c.status !== 'unknown'
                                 && !(c.status === 'missing' && c.seen === false));
  const driving = clocks.filter(c => c.status === 'driving').length;
  const el = document.getElementById('st-clocks');
  // what the clocks are being sent, then words only for what needs a look
  const show = clockDisplay(s);
  let html = `Clocks <b class="num">${esc(show.value)}</b> · ${esc(show.what)}`;
  if (!clocks.length) { el.className = 'dot'; html = 'Clocks · none found'; }
  else {
    dot('st-clocks', driving === clocks.length, driving > 0);
    if (driving < clocks.length) html += ` · ${driving}/${clocks.length} driving`;
  }
  document.getElementById('st-clocks-t').innerHTML = html;

function clockCol(c) {

   second pane refresh never closes it. items: [label, fn] or 'hr'. */

  const m = document.getElementById('menu');
  if (!m.hidden && MENU_BTN === btn) { closeMenu(); return; }
  MENU_FNS = [];
  m.innerHTML = items.map(it => {
    if (it === 'hr') return '<hr>';
    MENU_FNS.push(it[1]);
    return `<button class="${it[2] || ''}" onclick="menuPick(${MENU_FNS.length - 1})">${it[0]}</button>`;
  }).join('');
  m.hidden = false; MENU_BTN = btn;
  const r = btn.getBoundingClientRect(), w = m.offsetWidth, h = m.offsetHeight;
  let left = Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - w - 12);
  let top = r.bottom + window.scrollY + 4;
  if (r.bottom + h + 8 > window.innerHeight && r.top > h + 8) top = r.top + window.scrollY - h - 4;   // no room below: open upward
  m.style.left = Math.max(12, left) + 'px'; m.style.top = top + 'px';

/* The Stations panel: one row per reader - the local mat first, then every
   LoRa station (heard, pre-registered, or merely configured) - with its
   state and a Location select (where it stands: a mile marker, the finish,
   one mat crossed more than once, or a loop-course skip). Changing a
   location re-labels reads already heard, so it can be fixed mid-race. */
function renderStations(force) {
  const t = document.getElementById('units');
  if (!t) return;
  // don't yank a menu out from under the operator on a poll
  if (!force && document.activeElement && t.contains(document.activeElement)) return;
  const s = STATUS || {};
  const rows = [];
  rows.push({ id: LOCAL_READER, name: 'This PC', sub: CFG.reader && CFG.reader.type ? `${CFG.reader.type} reader` : 'local reader',
              cls: !s.running ? '' : s.reader_connected ? 'good' : 'crit',
              state: !s.running ? 'stopped' : s.reader_connected ? 'reading' : 'down',
              age: null, pop: 'reader', port: null });
  const seen = new Set([LOCAL_READER]);
  for (const u of UNITS) {
    const age = u.last_seen ? Math.round((Date.now() - new Date(u.last_seen)) / 1000) : null;
    const fresh = age !== null && age < 40;
    // reading = radio + RFID reader both up; idle = radio only (reader
    // down or supervisor still retrying); anything stale/error = red.
    rows.push({ id: u.reader_id, name: u.reader_id, sub: u.version ? `LoRa v${u.version}` : 'LoRa',
                cls: !fresh ? 'crit' : u.state === 'reading' ? 'good' : u.state === 'idle' ? 'warn' : 'crit',
                state: !fresh ? (age === null ? 'never heard' : 'silent') : (u.state || '?'),
                age, pop: 'unit', port: u.reader_id });

  for (const id of Object.keys((DATA && DATA.reader_points) || {}))
    if (!seen.has(id)) rows.push({ id, name: id, sub: 'LoRa (from config)', cls: '', state: 'not heard', age: null, pop: 'unit', port: id });
  // Reader… swaps this popover for that reader's (anchored on the chip);
  // its "All stations" button comes back here
  t.innerHTML = '<tr><th>Station</th><th>Location</th></tr>' + rows.map(r => {
    const fin = readerIsFinish(r.id), off = readerOff(r.id);

        <div class="sub" style="font-weight:normal">${esc(r.sub)}
          <button class="btn rdr pop-anchor" onclick="openPop('${r.pop}', ${port}, document.getElementById('chip-st'))" title="Antenna ports, power and commands">⚙ Reader…</button></div></td>
      <td class="loc"><select class="${fin ? 'finish' : ''}" title="Where this station stands on the course" onchange="setLocation('${esc(r.id)}', this.value)">${locationOptions(r.id)}</select></td></tr>`;
  }).join('');
  const f = document.getElementById('units-foot');
  if (f.querySelector('.msg-ok, .msg-bad')) return;           // a save message is showing
  const multi = rows.some(r => (unitPoints(r.id) || []).length > 1);

/* ---------------------------- race panes ---------------------------- */

function render() {
  const root = document.getElementById('panes');
  if (!DATA || !DATA.enabled) {
    root.innerHTML = '<div class="note">Race manager is not enabled — set races.enabled: true in config.yaml (finish line mode).</div>';
    return;
  }
  const html = panesHtml();
  // render() runs every second, but the DOM is only rebuilt when the panes'
  // content actually changed (a read landed, a status flipped): rebuilding
  // a table while the operator is dragging it makes the scroll catch and
  // lose its momentum. The per-second race clocks are updated in place
  // (tickClocks), and a rebuild that falls inside an active scroll waits
  // for the next tick. When it does rebuild, each table keeps its place.
  const typing = document.activeElement && document.activeElement.tagName === 'INPUT' && root.contains(document.activeElement);
  if (html !== LAST_PANES_HTML && !typing && (Date.now() - LAST_PANE_SCROLL_AT > 500 || !LAST_PANES_HTML)) {
    const scrolled = {};
    root.querySelectorAll('.scroll[data-key]').forEach(el => { if (el.scrollTop) scrolled[el.dataset.key] = el.scrollTop; });
    const before = paneBoxes(root);
    root.innerHTML = html;
    root.querySelectorAll('.scroll[data-key]').forEach(el => { if (scrolled[el.dataset.key]) el.scrollTop = scrolled[el.dataset.key]; });
    LAST_PANES_HTML = html;
    morphPanes(root, before);
  }
  const side = document.getElementById('side-held'), sideHtml = sideHeldHtml();
  if (sideHtml !== LAST_SIDE_HTML) {
    const keep = {};
    side.querySelectorAll('.scroll[data-key]').forEach(el => { keep[el.dataset.key] = el.scrollTop; });
    side.innerHTML = sideHtml;
    side.querySelectorAll('.scroll[data-key]').forEach(el => { if (keep[el.dataset.key]) el.scrollTop = keep[el.dataset.key]; });
    LAST_SIDE_HTML = sideHtml;
  }
  tickClocks(root);
}
let LAST_SIDE_HTML = '';
let LAST_PANES_HTML = '', LAST_PANE_SCROLL_AT = 0;

/* Expand / collapse morph (2026-09-27): when a race changes size (card or
   strip <-> pane, auto-big at the gun, the fold after Close race, Pin/Unpin,
   Held/Ignored), its old box glides and resizes to where the race now lives
   and the new one fades in under it with a short ring; every other race
   slides to its new place instead of jumping. Only a size change animates -
   a read landing never does. The race the operator just opened or folded is
   scrolled into view if it landed off screen. */
const MORPH_MS = 420, MORPH_EASE = 'cubic-bezier(.2, .7, .2, 1)';
const REDUCED_MOTION = matchMedia('(prefers-reduced-motion: reduce)');
let FOLLOW = null;
function paneBoxes(root) {
  const boxes = {};
  root.querySelectorAll('[data-race]').forEach(el => {
    const r = el.getBoundingClientRect();
    boxes[el.dataset.race] = { el, mode: el.dataset.mode, x: r.left + scrollX, y: r.top + scrollY, w: r.width, h: r.height };
  });
  return boxes;
}
function morphPanes(root, before) {
  const after = paneBoxes(root);
  const follow = FOLLOW && after[FOLLOW];
  FOLLOW = null;
  if (follow) {
    const r = follow.el.getBoundingClientRect();
    if (r.top < 0 || r.bottom > innerHeight) follow.el.scrollIntoView({ block: r.height > innerHeight ? 'start' : 'nearest', behavior: 'smooth' });
  }
  const changed = Object.keys(after).filter(k => before[k] && before[k].mode !== after[k].mode);
  if (!changed.length || REDUCED_MOTION.matches) return;
  for (const [k, a] of Object.entries(after)) {
    const b = before[k];
    if (!b) continue;
    if (changed.includes(k)) {
      const ghost = document.createElement('div');
      ghost.className = 'pane-ghost';
      b.el.style.width = b.w + 'px';
      ghost.appendChild(b.el);
      const box = x => ({ left: x.x + 'px', top: x.y + 'px', width: x.w + 'px', height: x.h + 'px' });
      Object.assign(ghost.style, box(b));
      document.body.appendChild(ghost);
      ghost.animate([Object.assign(box(b), { opacity: 1 }), Object.assign(box(a), { opacity: 1, offset: 0.8 }), Object.assign(box(a), { opacity: 0 })],
                    { duration: MORPH_MS, easing: MORPH_EASE }).onfinish = () => ghost.remove();
      a.el.animate([{ opacity: 0 }, { opacity: 0, offset: 0.6 }, { opacity: 1 }], { duration: MORPH_MS })
        .onfinish = () => a.el.classList.add('landed');
    } else if (Math.abs(b.x - a.x) + Math.abs(b.y - a.y) > 1) {
      a.el.animate([{ transform: `translate(${b.x - a.x}px, ${b.y - a.y}px)` }, { transform: 'none' }], { duration: MORPH_MS, easing: MORPH_EASE });
    }

}

/* The "+M:SS since the gun" readouts tick without touching anything else. */

    el.textContent = now > gun ? '+' + fmtElapsed((now - gun) / 1000).split('.')[0] : '';

/* Panes sized by status (2026-09-26): a race with a gun that is not final
   is ACTIVE - full size, big clock and counts, a taller table. Pending and
   check-in races are one-line cards; finished races are one-line strips
   (count, winner, top team, and an amber badge while anyone is missing a
   split). Order: active, check-in, pending, final, then Held/Ignored.

   race it stays open 8 s (Keep open cancels) and then folds to a strip.
   Pin open keeps any race full size whatever its status (saved in this

const CLOSE_DELAY_MS = 8000;
const PREV_STATUS = {}, CLOSING = {}, OPENED = {};
let PINS = {};

  if (PINS[key]) delete PINS[key]; else PINS[key] = true;

function keepOpen(key) { delete CLOSING[key]; PINS[key] = true; savePins(); render(); }
function openPane(key) { OPENED[key] = true; FOLLOW = String(key); render(); }

  if (race.status !== 'final' && (race.status === 'racing' || race.gun)) return 'big';

function panesHtml() {
  const now = Date.now();
  // race keys restart at 1 after Close meet: drop pins for races that are gone
  let pruned = false;
  for (const k of Object.keys(PINS)) if (!DATA.races[k]) { delete PINS[k]; pruned = true; }
  if (pruned) savePins();
  // a race seen going final here stays open CLOSE_DELAY_MS before it folds
  for (const key of DATA.order) {
    const r = DATA.races[String(key)];
    if (r.status === 'final' && PREV_STATUS[key] && PREV_STATUS[key] !== 'final' && !PINS[key]) CLOSING[key] = now + CLOSE_DELAY_MS;
    if (r.status !== 'final') delete CLOSING[key];
    PREV_STATUS[key] = r.status;
  }
  for (const k of Object.keys(CLOSING)) if (CLOSING[k] <= now) delete CLOSING[k];

  const races = DATA.order.map((k, i) => ({ r: DATA.races[String(k)], i }))
    .map(x => Object.assign(x, { mode: paneMode(x.r) }))
    .sort((a, b) => (rank[a.mode] - rank[b.mode]) || (srank[a.r.status] - srank[b.r.status]) || (a.i - b.i));

  if (active.length) html += `<div class="grid-active">${active.map(x => paneHtml(x.r, res(x.r), x.mode)).join('')}</div>`;
  if (cards.length) html += `<div class="grid-cards">${cards.map(x => cardHtml(x.r)).join('')}</div>`;
  html += strips.map(x => stripHtml(x.r, res(x.r))).join('');

/* Crossings per station (2026-10-09, after Jim Crawford: a runner walking

/* Per-pane table order chosen with the column heads: null = place order

const SORT = {};
/* Column heads sort too (2026-10-10, user): Pl, Bib, Athlete (last name),
   each split, Finish - click again to reverse. Runners without the value
   (no split there, no finish) stay below the ones with it either way. */
function paneSortCol(key, by) {
  const cur = SORT[key];
  if (by === 'place') {
    SORT[key] = cur ? null : { by: 'place', dir: 'desc' };   // place order, then reversed, then back
  } else {
    SORT[key] = cur && cur.by === by ? { by, dir: cur.dir === 'asc' ? 'desc' : 'asc' } : { by, dir: 'asc' };
  }
  render();
}
function paneTh(key, by, label, cls, tip) {
  const cur = SORT[key];
  const on = by === 'place' ? !cur || cur.by === 'place' : cur && cur.by === by;
  // place order is the default: Pl shows ▴ so the heads read as sortable
  const arrow = on ? (cur && cur.dir === 'desc' ? ' ▾' : ' ▴') : '';
  return `<th class="${cls || ''}" style="cursor:pointer;user-select:none;white-space:nowrap" title="Sort by ${tip || label.toLowerCase()} - click again to reverse" onclick="paneSortCol(${key}, '${by}')">${label}${arrow}</th>`;
}
function sortRows(finishers, onCourse, sort) {
  if (!sort) return finishers.concat(onCourse);
  const dirN = sort.dir === 'desc' ? -1 : 1;
  if (sort.by === 'place') {
    return (sort.dir === 'desc' ? finishers.slice().reverse() : finishers).concat(onCourse);
  }
  if (['bib', 'name', 'school'].includes(sort.by)) {
    const num = v => { const n = parseInt(v, 10); return isNaN(n) ? Infinity : n; };
    const val = { bib: r => num(r.bib), name: r => `${r.last_name || ''} ${r.first_name || ''}`.trim().toLowerCase(),
                  school: r => (r.school || '').toLowerCase() }[sort.by];
    return finishers.concat(onCourse).map((r, i) => [r, i]).sort(([a, ia], [b, ib]) => {
      const va = val(a), vb = val(b);
      return (va < vb ? -dirN : va > vb ? dirN : 0) || ia - ib;
    }).map(([r]) => r);
  }
  if (sort.by.startsWith('pt:')) {
    const pt = sort.by.slice(3);
    const t = r => { const x = (r.splits || []).find(s => s.point === pt); return x && x.elapsed != null ? x.elapsed : null; };
    return finishers.concat(onCourse).map((r, i) => [r, i]).sort(([a, ia], [b, ib]) => {
      const ta = t(a), tb = t(b);
      if ((ta == null) !== (tb == null)) return ta == null ? 1 : -1;
      return (ta != null ? dirN * (ta - tb) : 0) || ia - ib;
    }).map(([r]) => r);
  }
  if (sort.by === 'finish') {
    const f = finishers.slice().sort((a, b) => a.finish.elapsed - b.finish.elapsed);
    return (sort.dir === 'desc' ? f.reverse() : f).concat(onCourse);
  }
  const rows = finishers.concat(onCourse);
  const team = r => (r.school || '').trim().toLowerCase();
  const dir = sort.dir === 'desc' ? -1 : 1;
  return rows.map((r, i) => [r, i]).sort(([a, ia], [b, ib]) => {
    const ta = team(a), tb = team(b);
    if (!ta !== !tb) return ta ? -1 : 1;             // rows without a team last
    if (ta !== tb) return dir * (ta < tb ? -1 : 1);
    return ia - ib;                                   // place order inside a team
  }).map(([r]) => r);
}
function paneHtml(race, res, mode) {
  const g = race.gender || 'U', k = race.key, big = mode === 'big';
  const finishers = res ? res.finishers : [];
  const onCourse = res ? res.on_course : [];
  // the whole race: every finisher in place order, then everyone still on
  // course - one column per split point plus the finish (the table scrolls);
  // the column heads re-order it
  // + everyone checked in (or on the roster) with no read yet, at the bottom,
  // so the table is the whole field; each moves up when a split or the
  // finish is read (2026-09-30)
  const notSeen = res ? (res.not_seen || []) : [];
  // Flagged runners (2026-10-06) take no place, so the places behind them
  // close up as in the meet's results; ignored ones leave the table.
  const iss = (DATA.issues || {})[String(k)] || null;
  const gone = new Set(iss ? iss.ignored.map(String) : []);
  const rows = sortRows(finishers, onCourse, SORT[race.key]).concat(notSeen).filter(r => !gone.has(String(r.bib)));
  const plAdj = iss ? issuePlaces(finishers, iss) : null;
  const pts = (DATA.points || []).filter(p => !p.finish);
  // flash for 0.9 s after a read lands in this race; the pane is re-rendered
  // every second, so the animation is resumed from where it was
  const flashAt = FLASH[race.key] || 0, since = Date.now() - flashAt;
  const flash = since < 900 ? ` flash" style="animation-delay:-${since}ms` : '';
  // the newest finisher (finish within the last 8 s) is tinted green
  const newest = race.status === 'racing' ? finishers.filter(r => r.finish && Date.now() - new Date(r.finish.clock) < 8000).map(r => r.bib) : [];
  const closing = CLOSING[k], canFold = !big && (OPENED[k] || PINS[k]);
  const dv = (DATA.divisions || {})[String(k)];
  return `
  <div data-race="${k}" data-mode="${mode}" class="pane${race.status === 'racing' ? ' racing' : ''}${big ? ' big' : ''}${flash}">
    <div class="pane-head${canFold ? ' fold' : ''}"${canFold ? ` onclick="if (!event.target.closest('button')) collapsePane(${k})" title="Click to fold this race back to one line"` : ''}>
      ${gtag(g)}
      <div><h2>${esc(race.name)}</h2><div class="sub">Evt ${race.event}-${race.round}-${race.heat}${paneStartText(race)}</div></div>
      <span style="margin-left:auto"></span>${bibCheckBadge(race)}${crossingsBadge(race)}${lifBadge(race)}
      <button class="btn small" onclick="openScoring(${k})" title="Scoring ${race.scoring.scorers}+${race.scoring.displacers} · fastest pace ${fmtPace(race.fastest_pace || DATA.fastest_pace_default)}/mi · gender · delete pane">Settings</button>
      <span class="badge ${race.status}" style="margin-left:0">${race.status.toUpperCase()}</span>
    </div>
    ${closing ? `<div class="countdown">Closed · folds to one line in <b class="num" data-until="${closing}"></b><button class="btn" onclick="keepOpen(${k})">Keep open</button></div>` : ''}
    <div class="gunrow">
      <span class="gl">${race.gun && race.status !== 'final' ? `<span class="clock num" data-gun="${esc(race.gun)}"></span>` : ''}
        <span>Gun <span class="num">${race.gun ? fmtClock(race.gun) : '—'}</span>
        <span style="color:var(--ink-3)">${esc(race.gun_source)}</span></span>
        <button class="btn small" onclick="openGun(${race.key})">Gun ▾</button>
        ${race.gun && race.status !== 'final' ? (STATUS && STATUS.led_clock_override && STATUS.led_clock_override.mode === 'race' && STATUS.led_clock_override.race === race.key
          ? `<button class="btn small" style="color:var(--good)" title="The LED clocks are pinned to this race. Click to go back to automatic." onclick="unpinClocks()">● on clocks</button>`
          : `<button class="btn small" title="Pin every LED clock (finish + split stations) to this race's time, e.g. for a straggler while the next race runs. Changes no gun." onclick="pinClocks(${race.key})">Show on clocks</button>`) : ''}</span>
      <span class="gr">
        <button class="btn small" onclick="openAdd(${k})">Add athlete</button>
        ${['pending', 'checkin'].includes(race.status) ? checkinButton(race, k)
          : race.status !== 'final' ? `<button class="btn small" onclick="closeRace(${k})">Close race</button>`
          : `<button class="btn small" onclick="api('/api/races/${k}/status',{status:'racing'})">Reopen</button>`}
        <button class="btn small" onclick="selectLif(${k})" title="Use a FinishLynx .lif as this race&#39;s results: its times replace the finish mat&#39;s">Select .lif file…</button>
        <button class="btn small" onclick="paneMenu(this, ${k})" title="Export CSV, Save .lif, Crossings">More ▾</button></span>
    </div>
    ${outageNote(race, STATUS)}
    ${attentionHtml(race, res)}
    <div class="summ">
      <span><span class="n num">${finishers.length}</span> / ${race.roster_count} finished</span>
      <span><span class="n num">${onCourse.length}</span> on course</span>
      <span title="${race.status === 'final' ? 'On the roster (checked in) but never read in this race' : 'Checked in, not read on the course yet - listed at the bottom of the table'}"><span class="n num">${notSeen.length}</span> ${race.status === 'final' ? 'no-show' : 'not seen yet'}</span>
      ${res && res.film ? filmPaneHtml(res.film) : ''}
      <span class="team">Top team <span class="n num">${res && res.teams.length ? res.teams[0].score : '—'}</span>${res && res.teams.length ? ' ' + esc(res.teams[0].team) : ''}</span>
    </div>
    <div class="scroll" data-key="race-${k}"><table>
      <tr>${paneTh(k, 'place', 'Pl', '', 'place')}${dv ? '<th title="Place within the runner\'s own race">Race Pl</th>' : ''}${paneTh(k, 'bib', 'Bib')}${paneTh(k, 'name', 'Athlete', '', 'last name')}${paneTh(k, 'school', 'School')}${pts.map(p => paneTh(k, 'pt:' + p.id, esc(p.label), 'right', esc(p.label) + ' time')).join('')}${paneTh(k, 'finish', 'Finish', 'right', 'finish time')}<th></th></tr>
      ${rows.map(r => rowHtml(k, r, pts, newest.includes(r.bib), dv, iss, plAdj)).join('')}
    </table>
    ${res && res.teams.length ? teamsHtml(res.teams) : ''}</div>
  </div>`;
}

/* "Save to .lif": FinishLynx lists the athlete without a time; the timer
   decides whether the mat read is a real finish (never automatic - a DNF
   walking past the mat must not become a result). */
async function chipToLif(key, bib, on) {
  const res = DATA.results[String(key)] || { finishers: [] }, r = res.finishers.find(x => x.bib === bib);
  const t = r && r.finish ? fmtElapsed(r.finish.elapsed) : '';
  if (on && !confirm(`Put bib ${bib}${r ? ' ' + r.last_name : ''}'s chip time ${t} into the merged .lif and count it as their finish?\n\nFinishLynx has no time for this athlete. Only do this if it is a real finish, not someone walking past the mat.`)) return;
  if (!on && !confirm(`Take bib ${bib}'s chip time back out of the .lif? They are then listed without a time again, and a meet race waits for a decision before it can be marked final.`)) return;
  await api(`/api/races/${key}/chip_lif`, { bib, on });
}

function deletePane(key) {
  const r = DATA.races[String(key)], res = DATA.results[String(key)] || { finishers: [], on_course: [] };
  const n = res.finishers.length + res.on_course.length;
  if (!confirm(`Delete the "${r.name}" pane?` + (n ? ` Its ${n} athlete(s)' reads move to the Held pane (nothing is lost).` : ''))) return;
  api(`/api/races/${key}/delete`);
}

/* One row per athlete with every split in its own column. A time reads
   "6:12.3", "~6:12.3" when estimated, "6:12.3*" when hand-edited, "m" flag
   when typed. A finisher missing a split the race has gets a clickable ⚠
   in that column; a runner still on course shows "—" for what is to come. */
function cellHtml(s, mBtn) {
  if (!s) return '—';
  return `${s.estimated ? '~' : ''}${fmtElapsed(s.elapsed)}${cellFlags(s, mBtn)}`;
}
function cellFlags(s, mBtn) {
  return `${s.overridden && !mBtn ? '*' : ''}${s.manual && !s.estimated && !mBtn ? ' <span class="flag">m</span>' : ''}${s.fl_only ? ' <span class="flag miss" title="Only in FinishLynx: the reader has no finish for this athlete. The time is FinishLynx&#39;s, from its saved .lif.">FL only</span>' : ''}${s.corrected ? ` <span class="flag" title="mat read ${fmtElapsed(s.raw_elapsed)}${s.antenna ? ' on A' + s.antenna : ''} − film offset ${(s.correction || 0).toFixed(3)} s">f</span>` : ''}${s.not_in_finishlynx ? ' <span class="flag miss" title="Finished while another race was running: kept out of FinishLynx (it would have landed in that race). It is in this pane, the results and the merged .lif; add it in FinishLynx by hand if you want it there.">not in FL</span>' : ''}`;
}
const DIV_COLORS = ['#4ea1ff', '#f0a83a', '#b48cf2', '#34c3a0'];
/* A run-together pane's row: its race's colour, tag and place in that race. */
function divBits(dv, bib) {
  const hit = dv && dv.bibs[String(bib)];
  if (!hit) return { cls: '', style: '', tag: '', place: dv ? '<td class="num"></td>' : '' };
  const i = Object.keys(dv.events).indexOf(String(hit[0])), c = DIV_COLORS[i % DIV_COLORS.length];
  return { cls: 'div', style: ` style="--dc:${c}"`, tag: `<span class="divtag">${esc(dv.events[String(hit[0])])}</span>`,
           place: `<td class="num" style="color:${c};font-weight:600">${hit[1] ?? ''}</td>` };
}
/* The athlete cell of a race pane: "Last, First · School" (2026-10-09:
   the panes showed the last name only). */
function paneName(r) {
  return `${esc(r.last_name)}${r.first_name ? ', ' + esc(r.first_name) : ''}`;
}
/* School in its own column after Athlete (2026-10-10, user) */
function paneSchool(r) { return `<td style="color:var(--ink-2)">${esc(r.school || '')}</td>`; }
function rowHtml(raceKey, r, pts, newest, dv, iss, plAdj) {
  const d = divBits(dv, r.bib);
  const flag = iss && iss.issues[String(r.bib)];
  if (r.checked_in !== undefined) {
    // on the roster, nothing read in this race yet
    return `<tr class="notseen ${d.cls}"${d.style}>
      <td class="num"></td>${d.place}
      <td class="bib num">${esc(r.bib)}</td>
      <td>${paneName(r)}${d.tag}</td>${paneSchool(r)}
      ${(pts || []).map(() => '<td class="right num split">—</td>').join('')}
      <td class="right split">${r.checked_in ? `checked in <span class="num">${fmtClock(r.checked_in).slice(0, 8)}</span>` : 'on roster'}</td>
      <td><button class="btn small" title="Add a time for this athlete (hand time, coach's split)" onclick="openAdd(${raceKey}, '${esc(r.bib)}')">+ time</button></td>
    </tr>`;
  }
  const fin = r.finish;
  const missing = r.missing || [];
  const cells = (pts || []).map(p => {
    const s = r.splits.find(x => x.point === p.id);
    if (s) return `<td class="right num split">${cellHtml(s)}</td>`;
    if (missing.includes(p.id))
      return `<td class="right num split"><span class="miss" title="No ${esc(p.label)} for this finisher — click to add it (estimate offered)" onclick="openAdd(${raceKey}, '${esc(r.bib)}', '${esc(p.id)}', true)">⚠ add</span></td>`;
    return `<td class="right num split">—</td>`;
  }).join('');
  const pl = flag ? '' : plAdj && String(r.bib) in plAdj ? plAdj[String(r.bib)] : (r.place || '');
  return `<tr class="${flag ? 'issue' : missing.length ? 'review' : newest ? 'newest' : ''} ${d.cls}"${d.style}>
    <td class="num">${pl}</td>${d.place}
    <td class="bib num">${esc(r.bib)}</td>
    <td>${paneName(r)}${d.tag}${flag ? issueChip(rkOf(DATA.races[String(raceKey)]), r.bib, flag) : ''}</td>${paneSchool(r)}
    ${cells}
    <td class="right num split">${!fin ? (DATA.races[String(raceKey)].status !== 'final' && !flag ? paneTimeBox(raceKey, r.bib, null) : '—')
      : flag && fin.fl_untimed ? `<span class="pt" title="Held out of the merged .lif until the flag is decided (the chip)">${fmtElapsed(fin.elapsed)}</span>`
      : fin.fl_untimed ? `<button class="btn lifsave" onclick="chipToLif(${raceKey}, '${esc(r.bib)}', true)" title="${fin.lif_why === 'off_list'
          ? 'Not on this race&#39;s start list (the .evt entries / check-in), and FinishLynx does not have them: nothing of theirs goes into the merged .lif, and a meet race cannot be marked final until you decide. If this is a real finisher (a missed check-in, a late entry), click to put their chip time and splits into the .lif.'
          : 'FinishLynx lists this athlete without a time, so the merged .lif has no result for them (and a meet race cannot be marked final). If this finish-mat read is a real finish (not someone walking past the mat), click to put the chip time into the .lif.'}">${fmtElapsed(fin.elapsed)} · Save to .lif</button>`
      : `${finCellHtml(raceKey, r, fin)}${fin.chip_in_lif ? ` <span class="flag" style="cursor:pointer" title="Chip time put into the .lif by hand (FinishLynx has no time for this athlete). Click to take it back out." onclick="chipToLif(${raceKey}, '${esc(r.bib)}', false)">in .lif</span>` : ''}`}</td>
    <td><button class="btn small" title="Edit time, switch bib, reads, remove" onclick="paneRowMenu(this, ${raceKey}, '${esc(r.bib)}')">⋯</button></td>
  </tr>`;
}
/* The finish time on a race pane row (2026-10-10, user): click it to type a
   time while the race is open; a time set by hand (typed, edited, a read
   picked by hand) carries a big "M" - click it to go back to the read. */
function finHand(fin) { return !!fin && !fin.from_lif && ((fin.manual && !fin.estimated) || fin.overridden || fin.pinned); }
function finCellHtml(key, r, fin) {
  const race = DATA.races[String(key)], open = race && race.status !== 'final';
  const t = open ? paneTimeBox(key, r.bib, fin) + cellFlags(fin, finHand(fin))
                 : `<span class="pt fin">${cellHtml(fin, finHand(fin))}</span>`;
  if (!finHand(fin)) return t;
  return t + (open
    ? `<button class="mbtn" title="Manual override, click to revert" onclick="revertFinish(${key}, '${esc(r.bib)}', ${!!(fin.manual && !fin.overridden)})">M</button>`
    : `<button class="mbtn" disabled title="Manual override. The race is closed: Reopen to revert">M</button>`);
}
async function revertFinish(key, bib, typed) {
  if (typed && !confirm(`Bib ${bib}'s finish was typed by hand, with no read behind it. Reverting removes it (their reader or FinishLynx time comes back, if they have one).`)) return;
  await api(`/api/races/${key}/revert_finish`, { bib: String(bib) });
}
/* Type the finish in the cell (2026-10-10, user: as on the Results page,
   no pop-up). Enter saves, Esc or leaving puts it back. While the box has
   the cursor the panes are not rebuilt (see render), so a read landing
   meanwhile does not take the typing away. */
function paneTimeBox(key, bib, fin) {
  const v = fin ? fmtElapsed(fin.elapsed) : '';
  return `<input class="pt pin${fin ? ' fin' : ''}" value="${v}" placeholder="—" aria-label="Finish time" title="Type a race time (26:33.4) or a clock time and press Enter (Esc puts it back)" data-key="${key}" data-bib="${esc(bib)}" data-old="${v}" onkeydown="paneTimeKey(event, this)" onblur="paneTimeBlur(this)">`;
}
function paneTimeKey(e, inp) {
  if (e.key === 'Enter') { e.preventDefault(); paneSaveTime(inp); }
  else if (e.key === 'Escape') { e.stopPropagation(); inp.value = inp.dataset.old; inp.blur(); }
}
function paneTimeBlur(inp) {
  setTimeout(() => { if (document.activeElement !== inp && !inp.dataset.saving) inp.value = inp.dataset.old; render(); }, 150);
}
async function paneSaveTime(inp) {
  const v = inp.value.trim(), key = inp.dataset.key, bib = inp.dataset.bib;
  if (!v || v === inp.dataset.old) { inp.value = inp.dataset.old; inp.blur(); return; }
  inp.dataset.saving = '1';
  const r = await fetch(`/api/races/${key}/finish_time`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ bib, time: v }) });
  const out = await r.json().catch(() => ({}));
  delete inp.dataset.saving;
  if (!r.ok) { alert(out.error || 'request failed'); inp.focus(); inp.select(); return; }
  inp.dataset.old = v;
  inp.blur();
  await refresh();
  if (DRAWER.rk) drawerLoad();
}
async function paneEditTime(key, bib, elapsed) {
  const v = prompt(`Finish time for bib ${bib}: a race time (26:33.36) or a clock time.\nIt wins over the reader and a picked .lif; the M next to it puts the read back.`, elapsed != null ? fmtElapsed(elapsed) : '');
  if (v === null || !v.trim()) return;
  await api(`/api/races/${key}/finish_time`, { bib: String(bib), time: v.trim() });
  if (DRAWER.rk) drawerLoad();
}
/* The pane row's tools, the same as the Results page's (2026-10-10, user).
   Only while the race is open; a closed race offers Reads… (to look) and
   says to Reopen. */
function paneRowMenu(btn, key, bib) {
  const race = DATA.races[String(key)], res = DATA.results[String(key)] || {};
  const row = (res.finishers || []).concat(res.on_course || []).find(r => String(r.bib) === String(bib)) || { bib };
  const rk = rkOf(race), meet = MEET.active && meetRace(rk);
  const name = row.last_name ? `${row.last_name}${row.first_name ? ', ' + row.first_name : ''}` : '';
  if (race.status === 'final') {
    openMenu(btn, [['Reads…', () => openAthlete(key, String(bib))],
                   [`<span style="color:var(--ink-3)">Closed: Reopen to edit times, bibs or remove</span>`, null]]);
    return;
  }
  const el = row.finish ? row.finish.elapsed : null;
  openMenu(btn, [
    ...(meet ? [[`Swap bib ${esc(bib)} with…`, () => issuePickDlg(rk, bib, 'swap', { bib, name, team: row.school || '' })],
                ['Change bib number…', () => paneChangeBib(bib, name)]] : []),
    ['Reads…', () => openAthlete(key, String(bib))],
    'hr',
    ['Remove from race', () => { if (confirm(`Remove bib ${bib}${name ? ' (' + name + ')' : ''} and all their reads from ${race.name}? Restorable from Ignored.`)) api(`/api/races/${key}/remove_bib`, { bib: String(bib) }); }, 'danger'],
  ]);
}
async function paneChangeBib(bib, name) {
  const r = await meetApi(`/api/meet/athletes?q=${encodeURIComponent(bib)}&limit=20`);
  const a = ((r.data || {}).athletes || []).find(x => String(x.bib) === String(bib));
  if (!a) { alert(`No athlete in the meet has bib ${bib}: use Swap bib, or the flag on the row.`); return; }
  resultsChangeBib(a.athlete_id, bib, name || `${a.last}, ${a.first}`);
}

function teamsHtml(teams) {
  return `<div class="teams"><table>
    <tr><th></th><th>Team</th><th class="right">Score</th><th class="right">Places</th></tr>
    ${teams.map(t => `<tr><td class="num">${t.rank}</td><td>${esc(t.team)}</td>
      <td class="right num">${t.score}</td><td class="right num">${t.places.join('-')}</td></tr>`).join('')}
  </table></div>`;
}

function heldPaneHtml(title, reads, note, key) {
  // newest read at the top: the one the operator is most likely looking for
  reads = reads.slice().sort((a, b) => new Date(b.clock) - new Date(a.clock));
  return `
  <div class="pane" data-race="${key}" data-mode="pane">
    <div class="pane-head fold" onclick="if (!event.target.closest('button')) toggleHeld('${key}')" title="Click to fold"><div><h2>${title}</h2></div>
      <span style="margin-left:auto"></span>
      <span class="badge held" style="margin-left:0">${reads.length}</span></div>
    <div class="scroll" data-key="${key || 'pool'}"><table>
      <tr><th>Bib</th><th>Athlete</th><th>Pt</th><th class="right">Clock</th><th></th></tr>
      ${reads.map(r => `<tr>
        <td class="bib num">${esc(r.bib)}</td>
        <td>${r.last_name ? esc(r.last_name) + (r.first_name ? ', ' + esc(r.first_name) : '') : '<span style="color:var(--ink-3)">not in the roster</span>'}

async function postJson(path, body) {
  try {
    const r = await fetch(path, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
    return { ok: r.ok, status: r.status, d: await r.json().catch(() => ({})) };
  } catch (e) { return { ok: false, status: 0, d: { error: 'request failed: ' + e } }; }
}

/* Start-signal options: time of day the gun fired, where it came from, and
   what the race clock would read right now if that were the gun ("now
   +12:34") - the quickest way to tell a real start from a sensor knock
   once a dozen triggers have piled up. The "now" part re-renders every
   second while a dialog is open (tickStartOptions). */
function startOptionLabel(ts, source) {
  const secs = (Date.now() - new Date(ts).getTime()) / 1000;
  return `${fmtClock(ts)} · ${source} · now +${fmtRace(secs)}`;
}
function startOption(s, extra) {
  return `<option value="${esc(s.ts)}" data-ts="${esc(s.ts)}" data-source="${esc(s.source)}"${extra || ''}>${esc(startOptionLabel(s.ts, s.source))}</option>`;
}
function tickStartOptions() {
  const d = document.getElementById('dlg');

}
function optionSource(selectId) {
  const sel = document.getElementById(selectId), o = sel && sel.options[sel.selectedIndex];

function openGun(key) {

  // start the console heard recently that is not already among them - a

  // away here.
  const own = race.gun_candidates.slice().reverse();
  const near = ts => own.some(c => Math.abs(new Date(c.ts) - new Date(ts)) < 2000);
  const others = ((STATUS && STATUS.recent_starts) || []).filter(s => !near(s.ts));
  const cands = own.map(c => startOption(c, race.gun === c.ts ? ' selected' : '')).join('');
  const extra = others.length

/* Add a read by hand. For a split point the server offers an estimate
   (the athlete's own pace over the course distances, and the pack they
   were running with) - "Use" fills the time and marks the read estimated,
   which shows as an "est" flag here and a tilde + column in the CSV. A
   finish is never estimated: it is typed, or it is not a result. */
/* "Needs attention" (2026-09-26, replaces the review badge, the pop-up at
   finish time and the close-race detour): a strip at the top of the pane
   listing every finisher lacking a split the other runners have (a
   station is "expected" once anyone has a real read there), each with
   Estimate (add dialog, estimate pre-accepted), Add time (the coach's
   hand time) and Publish without splits (accept the gap: they leave the
   list, undo below). Until a row is fixed, MeetPro shows that athlete's
   splits up to the gap - it files splits by position, so a later split
   cannot be written past a missing one. Empty = nothing rendered. */
function attentionHtml(race, res) {
  if (!res) return '';
  const rows = res.finishers.filter(r => (r.missing || []).length);
  const waived = res.finishers.filter(r => (r.waived || []).length && !(r.missing || []).length);
  const extra = extraCrossingsHtml(race, res);
  if (!rows.length && !waived.length && !extra) return '';
  const n = rows.reduce((s, r) => s + r.missing.length, 0);
  return `<div class="attention">
    ${rows.length ? `<h4 title="The merged .lif carries their splits only up to the gap until it is filled; the results leave the missing split blank">Needs attention · ${rows.length} finisher${rows.length === 1 ? '' : 's'} missing a split
      ${n > 1 ? `<button class="btn" title="Estimate every missing split in this race at once (each flagged est)" onclick="estimateAllMissing(${race.key})">Estimate all (${n})</button>` : ''}</h4>` : ''}
    ${rows.map(r => `<div class="row"><span class="num">${r.place}</span><span class="bib num">${esc(r.bib)}</span>
        <span>${esc(r.last_name)}${r.first_name ? ', ' + esc(r.first_name) : ''}${r.school ? ' · ' + esc(r.school) : ''}</span>
        ${r.missing.map(p => `<span class="flag miss" style="cursor:default">no ${esc(pointLabel(p))}</span>
          <button class="btn primary" title="Add ${esc(pointLabel(p))} with the estimate filled in — press Add to accept it (flagged est), or overtype it" onclick="openAdd(${race.key}, '${esc(r.bib)}', '${esc(p)}', true)">Estimate</button>
          <button class="btn" title="Type the coach's hand time for ${esc(pointLabel(p))}" onclick="openAdd(${race.key}, '${esc(r.bib)}', '${esc(p)}', false)">Add time</button>`).join('')}
        <button class="btn" style="margin-left:auto" title="Accept that this athlete has no ${r.missing.map(pointLabel).map(esc).join(' / ')} read: they keep their finish and place, the .lif carries their splits up to the gap, and they leave this list (undo below)" onclick="waiveMissing(${race.key}, '${esc(r.bib)}')">Publish without split${r.missing.length > 1 ? 's' : ''}</button></div>`).join('')}
    ${waived.length ? `<div class="row hint">Published without splits: ${waived.map(r => `<span class="bib num">${esc(r.bib)}</span> ${esc(r.last_name)} <a href="#" onclick="waiveMissing(${race.key}, '${esc(r.bib)}', true); return false">undo</a>`).join(' · ')}</div>` : ''}
    ${extra}
  </div>`;
}
function waiveMissing(key, bib, undo) {

}

/* Publishing switch (Stations panel): OFF keeps every read here - heard,
   classified, backed up to reads-<date>.txt in the RFID folder - but sends
   nothing to FinishLynx and writes no merged .lif (warm-ups, tag checks, a
   test start). Always ON after a restart. Switching ON asks whether the
   reads kept back meanwhile should go to FinishLynx now; the .lif files
   catch up by themselves. */
async function setPublishing(on) {
  const s = STATUS || {};
  const racing = DATA && DATA.enabled ? DATA.order.map(k => DATA.races[String(k)]).filter(r => r.status === 'racing') : [];
  if (!on && racing.length && !confirm(`${racing.map(r => r.name).join(', ')} is racing. Switch Finish Reads OFF anyway?\n\nFinishes will NOT reach FinishLynx or the merged .lif files until it is switched back on.`)) {
    applyPublishing(s); return;
  }
  let flush = false;
  if (on && s.publish_kept_back)
    flush = confirm(`${s.publish_kept_back} read${s.publish_kept_back > 1 ? 's' : ''} reached the console while Finish Reads was off.\n\nSend them to FinishLynx now?\nOK = send (in time order; a runner's finish becomes their result there).\nCancel = leave them out (warm-ups, tests). The .lif files catch up either way.`);
  const d = await api('/api/publish', { on, flush });
  if (d && d.ok) {
    STATUS = Object.assign(STATUS || {}, { publishing: d.publishing, publish_kept_back: d.kept_back,
                                           publish_off_since: on ? null : new Date().toISOString() });
    applyPublishing(STATUS); renderAlarm(STATUS);
    if (on && flush) alert(`${d.sent} read${d.sent === 1 ? '' : 's'} sent to FinishLynx.`);
  }
}
/* Live Results (2026-10-03, user's ask): the top-bar shortcut for MileSplit
   Live on the open meet - same call as Meet → Info's Live buttons. */
async function setLiveResults(on) {
  const cb = document.getElementById('live-on');
  cb.disabled = true;

  if (!r.ok) alert('Live Results: ' + r.data.error);

  applyLiveSwitch();
  if (MV.on && MV.page === 'info') renderMeetInfo();
  if (DRAWER.rk) renderDrawer();
}
function applyLiveSwitch() {
  const sw = document.getElementById('live-switch'), cb = document.getElementById('live-on'), v = document.getElementById('live-v');
  if (!sw) return;
  const ms = MEET.active ? (MEET.milesplit || {}) : null;
  const linked = !!(MEET.active && ((MEET.info || {}).milesplit || {}).meet_id);
  const on = !!(ms && ms.live);
  // Greyed out unless it can actually be switched on (2026-10-03, user's
  // ask): a meet open, logged in to MileSplit, linked, not preview. While
  // Live is on it can always be switched off.
  const why = !MEET.active ? 'No meet open'
    : MEET.preview ? 'Preview mode: nothing is sent to MileSplit'
    : !ms.logged_in ? 'Log in to MileSplit on Meet → Info first'
    : !linked ? 'This meet is not linked to a MileSplit meet (import it from MileSplit or set its meet id)' : '';
  const usable = on || !why;
  cb.checked = on;
  cb.disabled = !usable;
  sw.classList.toggle('off', !usable);
  v.textContent = on ? 'ON' : 'OFF';
  v.style.color = on ? 'var(--boys)' : 'var(--ink-3)';
  sw.title = on ? `Sending results to MileSplit Live: ${liveText(ms.live)}`
    : why || 'OFF: results are not sent to MileSplit Live. Switch on to start sending.';
}

/* Save as...: fetch a file from the console and let the operator choose
   where it goes (Chrome/Edge save picker on this PC). Browsers without the
   picker - or a console opened from another machine - get a normal
   download instead. */
async function saveAs(url, name, desc, mime, ext) {
  // On the console PC: the OS Save dialog (name + folder, last folder
  // remembered), written by the console itself (2026-10-03, user's ask).
  try {
    const r = await fetch('/api/fs/save', { method: 'POST', headers: {'Content-Type': 'application/json'},
                                            body: JSON.stringify({ url, name, desc, ext }) });
    const d = await r.json().catch(() => ({}));
    if (r.ok) { if (d.path) savedNote(d.path); return !!d.path; }
    if (r.status !== 403 && r.status !== 501) { alert(d.error || 'export failed'); return false; }
  } catch (e) { /* fall through to the browser's own save */ }
  let blob;
  try {
    const r = await fetch(url);
    if (!r.ok) { let e = {}; try { e = await r.json(); } catch (x) {} alert(e.error || 'export failed'); return false; }
    blob = await r.blob();
  } catch (e) { alert('request failed: ' + e); return false; }
  if (window.showSaveFilePicker) {
    try {
      const h = await window.showSaveFilePicker({ suggestedName: name, types: [{ description: desc, accept: { [mime]: [ext] } }] });
      const w = await h.createWritable(); await w.write(blob); await w.close();
      return true;
    } catch (e) {
      if (e && e.name === 'AbortError') return false;       // operator cancelled the picker
    }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  return true;
}

/* Add athlete's search (2026-10-03, user's ask): type a bib or part of a
   name, pick from the list (arrows + Enter, or click). Meet mode asks the
   meet (exact bib or name part); with no meet open the loaded .ppl is
   searched here. Athletes entered in this race come first; another race,
   a gender that doesn't fit or no bib is said on the row. Picking one fills
   the bib, narrows the live reads to that bib, and runs the estimate. */
let WHO = { list: [], hl: -1, seq: 0 }, PPL_CACHE = null;
async function whoLookup(key, q) {
  q = q.trim();
  if (!q) return [];
  const digits = /^\d+$/.test(q);
  if (MEET.active) {
    const r = await meetApi(`/api/meet/athletes?q=${encodeURIComponent(q)}&limit=12`);
    return r.ok ? (r.data.athletes || []).map(v => ({ bib: v.bib ? String(v.bib) : '', first: v.first, last: v.last,
      team: v.team, gender: v.gender, races: (v.races || []).map(rkStr), status: athStatus(v) })) : [];
  }
  if (!PPL_CACHE) {
    try { PPL_CACHE = (await (await fetch('/api/athletes')).json()).by_bib || {}; } catch (e) { PPL_CACHE = {}; }
  }
  const words = q.toLowerCase().split(/\s+/);
  return Object.entries(PPL_CACHE).filter(([bib, a]) => digits ? bib.startsWith(q)
      : words.every(w => `${a.first_name} ${a.last_name}`.toLowerCase().includes(w)))
    .slice(0, 12).map(([bib, a]) => ({ bib, first: a.first_name, last: a.last_name, team: a.school, gender: a.gender, races: [] }));
}
function whoNote(key, a) {
  const race = DATA.races[String(key)], rk = rkOf(race);
  const res = DATA.results[String(key)];
  const notes = [];
  if (!a.bib) notes.push(['crit', 'no bib — give one in Meet → Athletes']);
  else if (res && res.finishers.concat(res.on_course).some(r => r.bib === a.bib)) notes.push(['ink', 'already in this pane']);
  if (a.races.includes(rk)) notes.push(['good', 'entered in this race']);
  else if (a.races.length) notes.push(['warn', 'entered in ' + a.races.map(meetRaceName).join(', ')]);
  else if (MEET.active) notes.push(['warn', a.status === 'scratched' ? 'scratched' : 'not entered in a race']);
  if (a.gender && race.gender && race.gender !== 'X' && race.gender !== a.gender) notes.push(['warn', `${genderWord(a.gender) || a.gender} in a ${genderWord(race.gender)} race`]);
  return notes;
}
function whoRowHtml(key, a, i) {
  const notes = whoNote(key, a).map(([c, t]) => `<span style="color:var(--${c === 'ink' ? 'ink-3' : c})">${esc(t)}</span>`).join(' · ');
  return `<div class="row${a.bib ? '' : ' off'}${i === WHO.hl ? ' hl' : ''}" onmousedown="event.preventDefault()" onclick="whoPick(${key}, ${i})">
    <b class="num" style="min-width:42px;color:var(--ink)">${esc(a.bib || '—')}</b>
    <span style="color:var(--ink)">${esc(a.last)}, ${esc(a.first)}</span>
    <span>${esc([a.team, a.gender].filter(Boolean).join(' · '))}</span>
    <span style="margin-left:auto;text-align:right">${notes}</span></div>`;
}
function whoRender(key) {
  const box = document.getElementById('f-who-list');
  if (!box) return;
  const q = gv('f-bib').trim();
  if (!q) { box.hidden = true; return; }
  box.innerHTML = WHO.list.length ? WHO.list.map((a, i) => whoRowHtml(key, a, i)).join('')
    : `<div class="row off">${/^\d+$/.test(q) ? `No athlete has bib ${esc(q)} — it can still be added as a bib` : 'No athlete matches'}</div>`;
  box.hidden = false;
}
async function whoTyped(key) {
  document.getElementById('f-who-sel').innerHTML = '';
  liveReadsFor(key, '');
  const q = gv('f-bib'), seq = ++WHO.seq;
  const list = await whoLookup(key, q);
  if (seq !== WHO.seq) return;                                   // a newer keystroke won
  const race = DATA.races[String(key)], rk = rkOf(race);
  WHO.list = list.sort((x, y) => (y.races.includes(rk) - x.races.includes(rk)) || (!!y.bib - !!x.bib));
  WHO.hl = WHO.list.length ? 0 : -1;
  whoRender(key);
  if (/^\d+$/.test(q.trim())) estimateLater(key);
}
function whoKey(ev, key) {
  const box = document.getElementById('f-who-list');
  if (!box || box.hidden) return;
  if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
    ev.preventDefault();
    if (!WHO.list.length) return;
    WHO.hl = (WHO.hl + (ev.key === 'ArrowDown' ? 1 : WHO.list.length - 1)) % WHO.list.length;
    whoRender(key);
  } else if (ev.key === 'Enter' && WHO.hl >= 0) { ev.preventDefault(); whoPick(key, WHO.hl); }
  else if (ev.key === 'Escape') { ev.preventDefault(); whoClose(); }
}
function whoClose() { const box = document.getElementById('f-who-list'); if (box) box.hidden = true; }
function whoPick(key, i) {
  const a = WHO.list[i];
  if (!a || !a.bib) return;
  document.getElementById('f-bib').value = a.bib;
  whoClose();
  whoShow(key, a);
  estimateNow(key);
}
function whoShow(key, a) {
  const notes = whoNote(key, a).map(([c, t]) => `<span style="color:var(--${c === 'ink' ? 'ink-3' : c})">${esc(t)}</span>`).join(' · ');
  document.getElementById('f-who-sel').innerHTML = `<b class="num" style="color:var(--ink)">${esc(a.bib)}</b>
    <span style="color:var(--ink)">${esc(a.last)}, ${esc(a.first)}</span> · ${esc([a.team, a.gender].filter(Boolean).join(' · '))}${notes ? ' · ' + notes : ''}`;
  liveReadsFor(key, a.bib);
}
/* Live reads narrowed to the picked bib (all of them when it has none yet) */
function liveReadsFor(key, bib) {
  const el = document.getElementById('f-live');
  if (el) el.innerHTML = liveReadsHtml(key, bib);
}
/* The pick-list in the Add dialog: each read the console has heard, newest
   first, with who it was (from the .ppl) and what its finish time would be
   in THIS race (read clock minus this pane's gun). Reads already in the
   race are dimmed; a read from before the gun shows no race time. */
function liveReadsHtml(key, bib) {
  const race = DATA.races[String(key)], res = DATA.results[String(key)];
  const inRace = new Set(res ? res.finishers.concat(res.on_course).map(r => r.bib) : []);
  const gun = race.gun ? new Date(race.gun).getTime() : null;
  if (!LIVE_READS.length) return '<div class="note">no reads heard yet</div>';
  const only = bib && LIVE_READS.some(r => r.bib === bib) ? bib : '';
  return (only ? `<div class="note" style="padding:4px 10px">Reads for bib ${esc(only)} only</div>` : '') + '<table>' + LIVE_READS.map((r, i) => {
    if (only && r.bib !== only) return '';
    const a = r.athlete || {};
    const who = [a.last_name ? `${a.last_name}${a.first_name ? ', ' + a.first_name : ''}` : '', a.school, a.gender].filter(Boolean).join(' · ');
    const t = new Date(r.ts).getTime();
    const fin = gun && isFinite(t) && t > gun ? fmtElapsed((t - gun) / 1000) : '';
    const dim = inRace.has(r.bib) ? ' style="opacity:.55"' : '';
    return `<tr${dim} title="click to fill the form with this read" onclick="useLiveRead(${key}, ${i})" style="cursor:pointer">
      <td class="right num">${esc(r.time || fmtClock(r.ts))}</td>
      <td class="bib num">${esc(r.bib)}</td>
      <td>${esc(who) || '<span style="color:var(--ink-3)">not in roster</span>'}</td>
      <td><span class="pt">${esc(r.point || r.reader_id || '')}</span></td>
      <td class="right num">${fin ? `<b>${esc(fin)}</b>` : '<span style="color:var(--ink-3)">—</span>'}</td>
    </tr>`;
  }).join('') + '</table>';
}
function useLiveRead(key, i) {
  const r = LIVE_READS[i]; if (!r) return;
  document.getElementById('f-bib').value = r.bib;
  whoClose();
  whoLookup(key, r.bib).then(list => { const a = list.find(x => x.bib === r.bib); if (a) whoShow(key, a); });
  document.getElementById('f-clock').value = r.time || fmtClock(r.ts);
  document.getElementById('f-elapsed').value = '';
  document.getElementById('f-estflag').checked = false;
  const pt = (DATA.points || []).find(p => p.id === r.point) ? r.point
           : (r.reader_id === 'FINISH' || !r.point ? 'FINISH' : null);
  if (pt) document.getElementById('f-point').value = pt;
  const race = DATA.races[String(key)];
  const t = new Date(r.ts).getTime(), gun = race.gun ? new Date(race.gun).getTime() : null;
  document.getElementById('f-conv').textContent = gun && t > gun
    ? `read at ${r.time || fmtClock(r.ts)} = ${fmtElapsed((t - gun) / 1000)} after the gun`
    : `read at ${r.time || fmtClock(r.ts)}`;
  estimateNow(key);
}
/* Coach says "6:12 at the mile": convert against the pane's gun so the
   clock field shows what will be stored; typing a clock time clears the
   race-time field so there is only ever one source of truth. */
function raceTimeTyped(key) {
  const race = DATA.races[String(key)], secs = parseElapsed(gv('f-elapsed'));
  const conv = document.getElementById('f-conv');
  document.getElementById('f-estflag').checked = false;
  if (!gv('f-elapsed').trim()) { conv.textContent = ''; return; }
  if (secs == null || !race.gun) { conv.textContent = 'Race time like 6:12.3 or 1:02:03'; return; }
  const ts = new Date(new Date(race.gun).getTime() + secs * 1000);
  const pad = (n, w) => String(n).padStart(w, '0');
  document.getElementById('f-clock').value =
    `${pad(ts.getHours(), 2)}:${pad(ts.getMinutes(), 2)}:${pad(ts.getSeconds(), 2)}.${pad(ts.getMilliseconds(), 3)}`;
  conv.textContent = `${fmtElapsed(secs)} after the gun = clock ${document.getElementById('f-clock').value}`;
}
function clockTyped() {
  document.getElementById('f-estflag').checked = false;
  document.getElementById('f-elapsed').value = '';
  document.getElementById('f-conv').textContent = '';
}
let EST_TIMER = null, EST_LAST = null;
function estimateLater(key) { clearTimeout(EST_TIMER); EST_TIMER = setTimeout(() => estimateNow(key), 350); }
async function estimateNow(key) {
  const box = document.getElementById('f-est'); if (!box) return;
  const bib = gv('f-bib').trim(), point = gv('f-point');

/* Clickable column headers (2026-10-03). A table rendered with

   for up, again for down, a third time for the list's own order. The choice
   is kept per table name, so it survives the live re-renders (a
   MutationObserver re-applies it to every freshly drawn table). A cell's
   data-sv overrides its text as the sort value; blanks sort last both ways.

    v = box ? (box.checked ? '0' : '1') : inp ? inp.value : sel ? (sel.selectedOptions[0] || {}).text || '' : td.textContent;
  }
  v = String(v).trim();

}

async function meetOpenChoice(target, name) {

    <div class="note" style="margin:0">

/* One file picker for every import (2026-10-03, user: work out JSON vs
   txt/csv, no per-format inputs). MileSplit JSON: the entries pull, plus the
   team-rosters pull when both are picked (the file with fewer entries);
   anything else is one Hy-Tek .txt or .csv. Creates + activates a meet when
   none is open, else refreshes / merges into the open one (contract). */
function importFileRowHtml(fileId, rosterId, roster) {
  return `<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12.5px">
      <input type="file" id="${fileId}" multiple accept=".json,.txt,.csv,.hy3,application/json,text/plain,text/csv"
             title="MileSplit entries JSON (pick its team-rosters JSON too for full rosters), a Hy-Tek .txt or a .csv">
      <label class="chk"><input type="checkbox" id="${rosterId}"${roster ? ' checked' : ''}> include roster-only athletes</label>
      <button class="btn${MEET.active ? '' : ' primary'}" onclick="meetImportAny('${fileId}', '${rosterId}')">Import</button></div>`;
}
// [entries, athletes] in a MileSplit pull: the entries pull has the most
// entries; on a tie the team-rosters pull has the most athletes.
function msPullSize(j) {
  let d = Array.isArray(j) ? j : (j.data !== undefined ? j.data : j);
  if (d && !Array.isArray(d)) d = d.teams || d.entries || [];
  const aths = (Array.isArray(d) ? d : []).flatMap(t => (t && t.roster) || []);
  return [aths.reduce((k, a) => k + ((a && a.entries) || []).length, 0), aths.length];
}
async function meetImportAny(fileId, rosterId) {
  const files = [...(document.getElementById(fileId).files || [])];
  if (!files.length) { meetMsg('Choose a file first', false); return; }
  const roster = document.getElementById(rosterId).checked, json = [], other = [];
  for (const f of files) {
    let j = null;
    try { j = JSON.parse(await f.text()); } catch (e) { j = null; }
    if (j && typeof j === 'object') json.push(j); else other.push(f);
  }
  if ((json.length && other.length) || other.length > 1 || json.length > 2) {
    meetMsg('Choose one Hy-Tek/CSV file, or the MileSplit entries JSON (and its team-rosters JSON)', false); return;
  }
  meetMsg('Importing…', true);
  if (other.length) {
    const fd = new FormData();
    fd.append('file', other[0]);
    fd.append('include_roster_only', roster ? '1' : '0');
    importDone(await meetApi('/api/meet/import/file', fd));
    return;
  }
  json.sort((a, b) => { const x = msPullSize(a), y = msPullSize(b); return (y[0] - x[0]) || (x[1] - y[1]); });
  const body = { entries: json[0] };
  if (json[1] && roster) body.rosters = json[1];
  importDone(await meetApi(MEET.active ? '/api/meet/refresh' : '/api/meet/import/milesplit', body));
}
/* A meet already on this PC is never imported twice: its bibs would be
   numbered again (2026-10-10). Offer the one that's here instead. */
function alreadyHere(r) {
  if (!r.data || !r.data.existing) return false;
  dlg(`<h3>Already on this PC</h3><div class="body" style="max-width:520px">${esc(r.data.error)}</div>
    <div class="foot"><button class="btn" onclick="closeDlg()">Cancel</button>
      <button class="btn primary" onclick='closeDlg();meetOpenGo(${JSON.stringify({ id: r.data.existing })})'>Open ${esc(r.data.existing_name || r.data.existing)}</button></div>`);
  return true;
}
function importDone(r) {
  if (!r.ok && alreadyHere(r)) { meetMsg(r.data.error, false); return; }
  if (!r.ok) { meetMsg(r.data.error, false); if (r.data.report) showImportReport(r.data.report); return; }
  meetMsg('Imported', true);
  showImportReport(r.data.report);
  if (r.data.meet) applyMeet(r.data.meet);
  meetLists(true).then(() => { if (MV.on && MEET.active) meetPage(true); });
}
function showImportReport(rep) {
  if (!rep) return;
  if (!MEET.active) { NOMEET.report = rep; const b = document.getElementById('nm-body'); if (b) b.innerHTML = noMeetBody(); return; }
  dlg(`<h3>Import report</h3><div class="body" style="max-width:640px;max-height:60vh;overflow:auto">${importReportHtml(rep)}</div>
    <div class="foot"><button class="btn primary" onclick="closeDlg()">OK</button></div>`);
}
/* ImportReport is the importers' own dict: counts first, then lists (warnings, changes) */
function importReportHtml(rep) {
  if (!rep || typeof rep !== 'object') return '';
  const nums = [], lists = [];
  for (const [k, v] of Object.entries(rep)) {
    const label = k.replace(/_/g, ' ');
    if (typeof v === 'number' || typeof v === 'string' || typeof v === 'boolean') { if (v !== '' && v !== false) nums.push(`${esc(label)} <b class="num" style="color:var(--ink)">${esc(v)}</b>`); }
    else if (Array.isArray(v)) { if (v.length) lists.push([label, v]); }
    else if (v && typeof v === 'object') nums.push(`${esc(label)}: ${Object.entries(v).map(([a, b]) => `${esc(a)} ${esc(typeof b === 'object' ? JSON.stringify(b) : b)}`).join(', ')}`);
  }
  return `<div style="display:flex;gap:14px;flex-wrap:wrap">${nums.map(n => `<span>${n}</span>`).join('')}</div>` +
    lists.map(([k, v]) => `<div style="margin-top:8px"><div class="lbl">${esc(k)} (${v.length})</div>
      ${v.slice(0, 40).map(x => `<div style="font-size:12px;color:var(--ink-2)">${esc(typeof x === 'object' ? (x.text || x.message || JSON.stringify(x)) : x)}</div>`).join('')}
      ${v.length > 40 ? `<div style="color:var(--ink-3)">… ${v.length - 40} more</div>` : ''}</div>`).join('');
}

/* MileSplit login (never logged by the server) + meet picker for a fetch */
function milesplitLoginHtml() {
  const ms = MEET.milesplit || {};
  const logged = MEET.milesplit ? ms.logged_in : NOMEET.msLogged;
  const remembered = MEET.milesplit ? ms.remembered : NOMEET.msRemembered;
  // Remember me (2026-10-03): the login is saved encrypted for this Windows
  // user and the middleware logs itself in again when the token runs out.
  const saved = remembered ? `<span style="font-size:11.5px;color:var(--ink-3)" title="Saved on this computer, encrypted for this Windows user; used to log in again automatically">· remembered as ${esc(remembered)}</span>
      <button class="btn small" onclick="milesplitLogout(true)" title="Log out and delete the saved login from this computer">Forget saved login</button>` : '';
  if (logged || remembered) return `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px"><span class="dot good"></span> ${logged ? 'Logged in to MileSplit' : 'MileSplit: logs in automatically'}
      ${saved}<button class="btn small" onclick="milesplitLogout(false)">Log out</button></div>`;
  return `<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center" class="mtool">
      <input id="ms-email" type="email" placeholder="MileSplit email" autocomplete="username" style="width:200px">
      <input id="ms-pass" type="password" placeholder="Password" autocomplete="current-password" style="width:150px"
             onkeydown="if (event.key === 'Enter') milesplitLogin()">
      ${(MEET.milesplit ? MEET.milesplit.can_remember : NOMEET.msCanRemember) === false ? ''
        : '<label class="inl" title="Saved encrypted for this Windows user on this PC; the middleware logs in again by itself"><input id="ms-remember" type="checkbox" checked> Remember me on this computer</label>'}
      <button class="btn" onclick="milesplitLogin()">Log in</button>
      <span style="font-size:11.5px;color:var(--ink-3)">timing-company account; the password is never written to the logs</span></div>`;
}
async function milesplitLogin() {
  const rem = document.getElementById('ms-remember');
  const r = await meetApi('/api/meet/milesplit/login', { email: gv('ms-email').trim(), password: gv('ms-pass'),
                                                         remember: !!(rem && rem.checked) });
  if (!r.ok || !r.data.logged_in) { meetMsg(r.data.error || 'MileSplit login failed', false); return; }
  NOMEET.msLogged = true;
  NOMEET.msRemembered = r.data.remembered || null;
  if (MEET.milesplit) { MEET.milesplit.logged_in = true; MEET.milesplit.remembered = r.data.remembered || null; }
  meetMsg(r.data.remembered ? 'Logged in to MileSplit (remembered on this computer)' : 'Logged in to MileSplit', true);
  if (MEET.active) { loadMeetSummary().then(() => MV.page === 'info' && renderMeetInfo()); } else renderNoMeet();
}
async function milesplitLogout(forget) {
  if (forget && !confirm('Delete the saved MileSplit login from this computer?')) return;
  const r = await meetApi('/api/meet/milesplit/logout', { forget: !!forget });
  NOMEET.msLogged = false;
  NOMEET.msRemembered = (r.ok && r.data.remembered) || null;
  if (MEET.milesplit) { MEET.milesplit.logged_in = false; MEET.milesplit.remembered = NOMEET.msRemembered; }
  if (MEET.active) { loadMeetSummary().then(() => MV.page === 'info' && renderMeetInfo()); } else renderNoMeet();
}
/* "full team rosters" is ticked by default (2026-10-08, user: the timer

   a re-render doesn't tick it again. A meet that has its rosters keeps them

let MS_FULL = true;
function msFullBox() {

function msPickHtml() {
  const now = new Date(), i = MEET.info || {}, ms = i.milesplit || {};

      <button class="btn" onclick="milesplitMeets()">List meets</button>
      <span class="vsep"></span>
      <label class="inl">Timing co. <input id="ms-tc" class="num" style="width:80px" value="${esc(ms.tc_id || '')}"></label>
      <label class="inl">Meet id <input id="ms-meet" class="num" style="width:100px" value="${esc(ms.meet_id || '')}"></label>
      ${msFullBox()}
      <button class="btn primary" onclick="milesplitFetch()">${MEET.active ? 'Refresh from MileSplit' : 'Fetch &amp; import'}</button></div>
    ${list ? `<div class="tbox" style="margin-top:8px">${list.length ? `<table style="font-size:12.5px">
      <tr><th>Date</th><th>Meet</th><th class="right" title="Entries as MileSplit's meet list counts them (can lag)">Entries</th>
        <th class="right">Teams</th><th class="right">Athletes</th><th>Entry deadline</th><th></th></tr>
      ${msSorted(list).map(m => { const id = msId(m), c = MS_COUNTS[id] || {}, su = m.setup, st = (su && su.stats) || {};
        const teams = su ? st.teamsEntered : c.teams, aths = su ? st.athletesTotal : c.athletes, open = MS_OPEN[id];
        return `<tr>
        <td class="num" style="white-space:nowrap">${esc(msDate(m.startDate || m.date || m.start_date))}</td>
        <td><span style="color:var(--ink)">${esc(m.name || m.meet_name || id)}</span>
          ${m.meetUrl ? `<a href="${esc(m.meetUrl)}" target="_blank" rel="noopener" style="color:var(--ink-3);font-size:11px">MileSplit ↗</a>` : ''}
          <div style="font-size:11px;color:var(--ink-3)">${esc([m.venueName, m.venueCity, m.hostTeam && m.hostTeam.name ? 'host ' + m.hostTeam.name : ''].filter(Boolean).join(' · '))} · #${esc(id)}</div></td>
        <td class="right num">${m.entryCount != null ? esc(m.entryCount) : ''}</td>
        <td class="right num"${su ? ` title="${esc(`${st.teamsScheduled || 0} scheduled, ${st.teamsTotal != null ? st.teamsTotal : '?'} total`)}"` : ''}>${teams != null ? teams : ''}</td>
        <td class="right num">${aths != null ? aths : (su ? '' : `<button class="btn small" title="Fetch this meet's entries for its team and athlete counts" onclick="msCount('${esc(m.tc_id || '')}', '${esc(id)}')">Count</button>`)}</td>
        <td style="font-size:11.5px;color:var(--ink-2);white-space:nowrap">${msDeadlineHtml(m)}</td>
        <td class="right" style="white-space:nowrap">${su ? (MS_BUSY[id] ? '<span style="color:var(--ink-3);font-size:11px">loading…</span>'
          : `<button class="btn small" title="Team list from the meet's MileSplit Teams page" onclick="msTeams('${esc(id)}')">${open ? 'Hide teams' : 'Teams'}</button>`) : ''}
          ${msUseButton(m, id)}</td></tr>
        ${su && open && MS_TEAMS[id] ? `<tr><td></td><td colspan="6">${msDetailsHtml(su, MS_TEAMS[id])}</td></tr>` : ''}`; }).join('')}
      </table>${NOMEET.msWeb && !NOMEET.msWeb.ok ? `<div style="font-size:11px;color:var(--warn);padding:4px 2px">No entry close dates: ${esc(NOMEET.msWeb.error || 'MileSplit website unavailable')}.</div>`
        : '<div style="font-size:11px;color:var(--ink-3);padding:4px 2px">Entry deadline is the registration Close Date/Time from each meet\'s MileSplit setup page.</div>'}`
      : '<div class="note">No meets that month.</div>'}</div>` : ''}`;
}
const MS_COUNTS = {};
const msId = m => String(m.meetId || m.id || m.meet_id || '');
const msTime = m => { const t = Date.parse(m.startDate || m.date || ''); return isNaN(t) ? 0 : t; };
const msSorted = list => list.slice().sort((a, b) => msTime(a) - msTime(b));
function msDate(v) {
  const t = Date.parse(v || '');
  return isNaN(t) ? (v || '') : new Date(t).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
}
const MS_TEAMS = {}, MS_OPEN = {}, MS_BUSY = {};
function msRerender() {
  const el = document.getElementById(MEET.active ? 'mi-ms-pick' : 'nm-ms-pick');
  if (el) el.innerHTML = msPickHtml();
}
function msCloseText(v) {
  const m = /^(\d{4})-(\d{2})-(\d{2})\s*(.*)$/.exec(v || '');
  if (!m) return v || '';
  const day = new Date(+m[1], m[2] - 1, +m[3]);
  return day.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }) + (m[4] ? ', ' + m[4] : '');
}
function msDeadlineHtml(m) {
  const su = m.setup;
  if (su && su.entries_close) {
    const day = /^(\d{4})-(\d{2})-(\d{2})/.exec(su.entries_close);
    const closed = day && new Date(+day[1], day[2] - 1, +day[3], 23, 59) < new Date();
    return `<span title="Registration close (MileSplit meet setup)${su.timezone ? ', ' + esc(su.timezone) : ''}">${esc(msCloseText(su.entries_close))}</span>${closed ? ' <span style="color:var(--ink-3)">(closed)</span>' : ''}`;
  }
  return `<span style="color:var(--ink-3)" title="${esc(m.setup_error || (su ? 'No close date set on MileSplit' : 'Setup page not read'))}">—</span>`;
}
function msDetailsHtml(su, teams) {
  const info = [su.date_start && (su.date_end && su.date_end !== su.date_start ? `${su.date_start} to ${su.date_end}` : su.date_start),
    su.venue, su.host && 'host ' + su.host, su.timer && 'timer ' + su.timer, (su.levels || []).join(', '),
    su.entries_open && 'entries open ' + msCloseText(su.entries_open)].filter(Boolean).join(' · ');
  return `<div style="font-size:11.5px;color:var(--ink-2);margin:2px 0 6px">${esc(info)}</div>
    ${teams.length ? `<table style="font-size:12px;width:auto"><tr><th>Team</th><th class="right">Entries</th><th>Status</th></tr>
      ${teams.map(t => `<tr><td>${esc(t.name)}</td><td class="right num">${t.entries != null ? t.entries : ''}</td><td style="color:var(--ink-3)">${esc(t.status)}</td></tr>`).join('')}</table>`
      : '<div class="note">No teams registered yet.</div>'}`;
}
async function msTeams(id) {

  const m = (NOMEET.msMeets || []).find(x => msId(x) === id) || {};
  MS_BUSY[id] = true; msRerender();
  const r = await meetApi(`/api/meet/milesplit/meets/${encodeURIComponent(id)}/page?page=teams&url=${encodeURIComponent(m.meetUrl || '')}`);
  delete MS_BUSY[id];
  if (r.ok) { MS_TEAMS[id] = r.data.teams || []; MS_OPEN[id] = true; } else meetMsg(`MileSplit Teams page: ${r.data.error}`, false);
  msRerender();
}
async function msCount(tc, id) {
  const r = await meetApi(`/api/meet/milesplit/meets/${encodeURIComponent(id)}/counts?tc=${encodeURIComponent(tc)}`);

async function milesplitMeets() {

  if (btn) { btn.disabled = false; btn.textContent = 'List meets'; }
  if (!r.ok) { meetMsg(r.data.error, false); return; }
  const companies = r.data.companies || [];

async function milesplitFetch() {

  const r = MEET.active
    ? await meetApi('/api/meet/refresh', Object.assign({ fetch: true, tc_id: tc || null, meet_id: mid, full_rosters: full }, about))
    : await meetApi('/api/meet/import/milesplit', Object.assign({ fetch: true, tc_id: tc || null, meet_id: mid, full_rosters: full }, about));
