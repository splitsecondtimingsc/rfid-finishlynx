/* ------------------------------ Meet sync (2026-10-07) ------------------------------ */
/* Meets shared between this team's machines (meet_sync.py): a shared folder
   (Google Drive for desktop) or a private git repo on the NAS. Status in the
   meet bar, settings + Sync now + clashes on the Info page. */
let SYNC = null;
async function syncLoad() {
  const r = await meetApi('/api/meet/sync');
  if (r.ok) { SYNC = r.data; syncRender(); }
}
function syncAgo(iso) {
  if (!iso) return 'never';
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : syncWhen(iso);
}
/* "Synced 2 min ago" read as sending when it was only the 5-minute look for
   other PCs' changes (2026-10-08, user): the check and the last time a meet
   actually went out (or came in) are said apart. */
function syncWhen(iso) {
  if (!iso) return 'never';
  const d = new Date(iso), today = new Date().toDateString() === d.toDateString();
  return today ? clock12(iso) : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' ' + clock12(iso);
}
function syncMoved(x) {
  return 'sent ' + syncWhen(x.last_sent) + (x.last_received ? ' · received ' + syncWhen(x.last_received) : '');
}
function syncClashCount() { return Object.values((SYNC && SYNC.conflicts) || {}).reduce((a, n) => a + n, 0); }
function syncLineHtml() {
  if (!SYNC || !SYNC.enabled) return '';
  // another PC's separate import, or one bib on two athletes: before anything else (2026-10-10)
  const sep = Object.keys(SYNC.separate || {}).length, dups = Object.values(SYNC.bib_dups || {}).reduce((a, b) => a + b.length, 0);
  if (sep) return `<span style="color:var(--bad);font-weight:600">Another PC imported this meet separately: bibs differ · see Sharing</span>`;
  if (dups) return `<span style="color:var(--bad);font-weight:600">${dups} bib${dups === 1 ? '' : 's'} on two athletes after sync · see Sharing</span>`;
  const n = syncClashCount();
  if (n) return `<span style="color:var(--warn)">${n} sync clash${n === 1 ? '' : 'es'} to check</span>`;
  if (SYNC.last_error) return `<span style="color:var(--warn)" title="${esc(SYNC.last_error)}">Sync offline</span>`;
  const tip = (SYNC.targets || []).map(t => `${t.label}: checked ${syncAgo(t.last_ok)}, ${syncMoved(t)}`).join('; ');
  return `<span style="color:var(--ink-3)" title="${esc(tip)}">${SYNC.waiting_to_send ? 'Sync: sending soon' : 'Checked ' + syncAgo(SYNC.last_ok) + ' · last sent ' + syncWhen(SYNC.last_sent)}</span>`;
}
function syncRender() {
  const line = document.getElementById('sync-line');
  if (line) line.innerHTML = syncLineHtml();
  const panel = document.getElementById('sync-panel');
  if (panel && !(document.activeElement && panel.contains(document.activeElement) && /^(INPUT|SELECT)$/.test(document.activeElement.tagName)))
    panel.innerHTML = syncPanelHtml();
}
/* The NAS and a shared folder are two checkboxes, either or both (2026-10-08,
   user: "select one or both options as backups, with a folder selection
   option for both"): each is its own sync with its own status. The NAS place
   is the git repo or a folder (a network share). */
function syncPanelHtml() {
  const S = SYNC || { mode: 'off' };
  const onGit = S.mode === 'git' || S.mode === 'both', onFolder = S.mode === 'folder' || S.mode === 'both';
  // the NAS only where the edition allows it (the public one: Google Drive only, 2026-10-10)
  const allowed = S.targets_allowed || ['git', 'folder'], driveOnly = !allowed.includes('git');
  const gitOk = !driveOnly && (onGit || !!S.remote);
  const val = v => esc(typeof v === 'string' ? v : JSON.stringify(v ?? null).slice(0, 80));
  const clashes = S.clashes || [];
  const tgt = t => (S.targets || []).find(x => x.target === t);
  // the setup hint goes once the folder has synced (back if it goes offline) (2026-10-08, user)
  const folderOk = !!(tgt('folder') && tgt('folder').last_ok && !tgt('folder').last_error);
  const state = t => {
    const x = tgt(t);
    if (!x) return '';
    return `<span style="font-size:11.5px;color:${x.last_error ? 'var(--warn)' : 'var(--ink-3)'}" title="${esc(x.last_error || '')}">${x.last_error ? 'offline' : 'checked ' + syncAgo(x.last_ok) + ' · ' + syncMoved(x)}</span>`;
  };
  const place = (id, on, label, inputId, value, placeholder, title) => `
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        <label style="width:150px;display:flex;gap:6px;align-items:center"><input type="checkbox" id="${id}"${on ? ' checked' : ''}> ${label}</label>
        <input id="${inputId}" value="${esc(value || '')}" placeholder="${placeholder}" title="${title}" style="flex:1;min-width:140px">
        <button class="btn" onclick="syncBrowse('${inputId}')">Browse…</button> ${state(id === 'sy-on-git' ? 'git' : 'folder')}</div>`;
  return `<div class="pane-head"><h2>Sharing</h2><span class="sub">meets shared with this team's other PCs (not reads or race state)</span></div>
    <div style="padding:10px 14px;display:grid;gap:10px;font-size:12.5px">
      ${S.preview ? '<div style="color:var(--warn)">Preview copy: it never syncs.</div>' : ''}
      ${gitOk ? place('sy-on-git', onGit, 'The NAS', 'sy-remote', S.remote, 'myserver:me/meets.git',
                      'The git repo on the NAS, or a folder on a network share') : ''}
      ${place('sy-on-folder', onFolder, driveOnly ? 'Google Drive' : 'Shared folder', 'sy-folder', S.folder, 'G:\\My Drive\\RFID meets',
              driveOnly ? 'A folder in My Drive (Google Drive for desktop), the same on every PC' : 'Google Drive for desktop, a network share or any folder the other PCs see')}
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <span style="width:150px;color:var(--ink-3)">This PC</span><input id="sy-machine" value="${esc(S.machine || '')}" style="width:120px" title="Its name on the other PCs"></div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <button class="btn" onclick="syncSave()">Save</button>
        ${S.enabled ? `<button class="btn primary" onclick="syncNow(this)">Sync now</button>
          <span style="color:${S.last_error ? 'var(--warn)' : 'var(--ink-3)'}">${S.last_error ? 'Offline: ' + esc(S.last_error) : 'Looks for changes from the other PCs every 5 min · last look ' + syncAgo(S.last_ok)}</span>` : ''}
        <span id="sy-msg" class="msg-line"></span></div>
      ${(onFolder && !folderOk) || (!gitOk && !onFolder) ? '<div class="hint" style="margin:0">Install Google Drive for desktop on each PC and pick the same folder in My Drive on all of them. Each PC writes only its own file per meet; edits to different athletes or races on different PCs all come through.</div>' : ''}
      ${onGit && onFolder ? '<div class="hint" style="margin:0">Both on: every meet goes to each place, so either one is a backup of the other.</div>' : ''}
      ${syncSeparateHtml(S, onGit && onFolder)}
      ${clashes.length ? `<div><div class="lbl" style="margin-bottom:6px;color:var(--warn)">Changed on two PCs (${clashes.length}): ours was kept</div>
        <table style="font-size:12px"><tr><th>Meet</th><th>What</th><th>Here</th><th>Other PC</th><th></th></tr>
        ${clashes.map(c => `<tr><td>${esc(c.meet)}</td><td class="num">${esc(c.path.replace(/^meet\./, ''))}</td>
          <td>${val(c.mine)}</td><td>${val(c.theirs)} <span style="color:var(--ink-3)">· ${esc(c.machine || '')}${onGit && onFolder ? ' via ' + (c.target === 'git' ? 'NAS' : 'folder') : ''}</span></td>
          <td class="right" style="white-space:nowrap"><button class="btn small" onclick="syncResolve('${esc(c.meet)}', ${c.index}, 'theirs', '${esc(c.target || '')}')">Take theirs</button>
            <button class="btn small" onclick="syncResolve('${esc(c.meet)}', ${c.index}, 'mine', '${esc(c.target || '')}')">Keep mine</button></td></tr>`).join('')}</table></div>` : ''}
    </div>`;
}
/* Separate imports (2026-10-10): the same meet imported from MileSplit on two
   PCs gets its bibs numbered twice, differently. Sync never merges such
   copies: the operator keeps one, on every PC. Plus bibs a merge left on two
   athletes (two PCs handing out the same next number while apart). */
function syncSeparateHtml(S, both) {
  const sep = S.separate_copies || [], dups = S.bib_dup_list || [];
  const via = x => both ? ' via ' + (x.target === 'git' ? 'NAS' : 'folder') : '';
  const open = sep.filter(x => !x.kept), kept = sep.filter(x => x.kept);
  return (open.length ? `<div style="border:1px solid var(--bad);border-radius:6px;padding:8px 10px">
      <div class="lbl" style="margin-bottom:6px;color:var(--bad)">Imported separately on another PC: not merged</div>
      <div style="margin-bottom:6px">The same meet was imported from MileSplit on two PCs, so its bibs were numbered twice. Keep the copy whose bibs were <b>printed and handed out</b>, and do the same on every PC. The copy you don't keep is saved on this PC, not deleted.</div>
      <table style="font-size:12px"><tr><th>Meet</th><th>Other PC</th><th>Differences</th><th></th></tr>
      ${open.map(x => `<tr><td>${esc(x.name || x.meet)}</td><td>${esc(x.machine)}${via(x)}</td>
        <td>${x.why === 'origin' ? 'a separate import · ' : ''}${x.bib_diffs} runner${x.bib_diffs === 1 ? '' : 's'} with another bib${x.other_runner ? `, ${x.other_runner} id${x.other_runner === 1 ? '' : 's'} for another runner` : ''}
          ${(x.examples || []).length ? `<div style="color:var(--ink-3)">${x.examples.map(e => `${esc(e.name)}: ${esc(e.mine)} here, ${esc(e.theirs)} there`).join(' · ')}</div>` : ''}</td>
        <td class="right" style="white-space:nowrap"><button class="btn small" onclick="syncSeparate('${esc(x.meet)}', '${esc(x.machine)}', 'theirs', '${esc(x.target || '')}')">Use theirs</button>
          <button class="btn small" onclick="syncSeparate('${esc(x.meet)}', '${esc(x.machine)}', 'mine', '${esc(x.target || '')}')">Keep mine</button></td></tr>`).join('')}</table></div>` : '')
    + (kept.length ? `<div style="color:var(--ink-3)">Kept this PC's copy over ${kept.map(x => `${esc(x.machine)}'s ${esc(x.name || x.meet)}`).join(', ')}: on ${kept.length === 1 ? 'that PC' : 'those PCs'}, pick "Use theirs".</div>` : '')
    + (dups.length ? `<div><div class="lbl" style="margin-bottom:6px;color:var(--bad)">One bib on two athletes after sync: renumber one of them (Athletes)</div>
      ${dups.map(x => `<div>${esc(x.meet)} · bib <b>${esc(x.bib)}</b>: ${(x.names || []).map(esc).join(' and ')} <span style="color:var(--ink-3)">(after ${esc(x.machine || '')}'s changes)</span></div>`).join('')}</div>` : '');
}
async function syncSeparate(meet, machine, take, target) {
  if (take === 'theirs' && !confirm(`Replace this PC's copy of ${meet} with ${machine}'s? Use it only if ${machine}'s bibs are the ones handed out. This PC's copy is saved, not deleted.`)) return;
  const r = await meetApi(`/api/meet/sync/separate/${encodeURIComponent(meet)}`, target ? { machine, take, target } : { machine, take });
  if (!r.ok) { syncMsg(r.data.error, false); return; }
  SYNC = r.data.sync; syncRender();
  syncMsg(take === 'theirs' ? `Now using ${machine}'s copy` : `Keeping this PC's copy: on ${machine}, pick "Use theirs"`, true);
}
async function syncBrowse(inputId) {
  const r = await osPick({ mode: 'dir', path: gv(inputId), title: inputId === 'sy-remote' ? 'NAS meets folder' : 'Shared meets folder' });

function syncMsg(t, ok) { const m = document.getElementById('sy-msg'); if (m) { m.textContent = t; m.className = 'msg-line ' + (ok ? 'ok' : 'bad'); } }
async function syncSave() {

async function syncNow(btn) {

    r.ok && !rep.error && !Object.keys(rep.errors || {}).length);
}
async function syncResolve(meet, index, take, target) {

/* ------------------------------ Divisions ------------------------------ */
/* Divisions (2026-10-06, user): extra standings inside a race, picked by
   gender (both / boys / girls), teams (all or some) and grades (all or
   some) and re-scored among their own runners. Set up here, in a dialog of
   their own; each race picks the ones it is scored in (Races › ⋮ ›
   Divisions…). None = the meet scores as it always has. */
const DIVD = { rows: [], msg: '' };
const DIV_GRADES = ['6', '7', '8', '9', '10', '11', '12'];
function divisionsLine() {
  const D = MEET.divisions || [];
  if (!D.length) return '<span style="color:var(--ink-3)">None: races score as usual</span>';
  return D.map(d => `<span title="${esc(d.text)}"><b style="color:var(--ink)">${esc(d.name)}</b> <span style="color:var(--ink-3)">(${d.races.length} race${d.races.length === 1 ? '' : 's'})</span></span>`).join(' · ');
}
async function divisionsDlg() {
  await meetLists();
  DIVD.rows = (MEET.divisions || []).map(d => ({ id: d.id, name: d.name, gender: d.gender || '', team_ids: (d.team_ids || []).slice(),
    teamMode: (d.team_ids || []).length ? 'pick' : 'all', grades: (d.grades || []).slice(), team_scores: d.team_scores !== false, races: d.races || [] }));
  DIVD.msg = '';

function divNewName() {
  const used = new Set(DIVD.rows.map(d => d.name.trim().toLowerCase()));

  while (used.has(`division ${k}`)) k++;

}
function divCount(v) {
  const n = Math.max(0, Math.min(20, parseInt(v, 10) || 0));
  if (n < DIVD.rows.length) {
    const gone = DIVD.rows.slice(n), used = gone.filter(d => d.races.length);
    const why = used.map(d => `${d.name} is scored in ${d.races.length} race${d.races.length === 1 ? '' : 's'}`).join('; ');
    if (!confirm(`Remove ${gone.map(d => d.name).join(', ')}?${why ? `\n\n${why}: it comes off ${used.length === 1 && used[0].races.length === 1 ? 'that race' : 'those races'} when you save.` : ''}`)) { divisionsRender(); return; }
    DIVD.rows = DIVD.rows.slice(0, n);
  }
  while (DIVD.rows.length < n) DIVD.rows.push({ id: '', name: divNewName(), gender: '', team_ids: [], teamMode: 'all', grades: [], team_scores: true, races: [] });
  divisionsRender();
}
function divRemove(i) {
  const d = DIVD.rows[i];
  if (d.races.length && !confirm(`Remove ${d.name}? It is scored in ${d.races.length} race${d.races.length === 1 ? '' : 's'} and comes off ${d.races.length === 1 ? 'it' : 'them'} when you save.`)) return;

  divisionsRender();
}
function divSet(i, k, v) {
  const d = DIVD.rows[i];
  if (k === 'grade') d.grades = v === 'all' ? [] : (d.grades.includes(v) ? d.grades.filter(g => g !== v) : d.grades.concat([v]));
  else if (k === 'team') d.team_ids = d.team_ids.includes(v) ? d.team_ids.filter(t => t !== v) : d.team_ids.concat([v]);

}
function divisionsRender() {
  const T = MEET_TEAMS.slice().sort((a, b) => a.name.localeCompare(b.name));
  const chip = (on, label, fn) => `<button class="btn small" aria-pressed="${on}" onclick="${fn}" style="font-size:12px;padding:2px 9px;${on ? 'color:var(--boys);border-color:var(--boys)' : 'border-color:var(--border)'}">${label}</button>`;

    const grades = [...new Set(DIV_GRADES.concat(d.grades))];

        <span style="font-size:11.5px;color:var(--ink-3);white-space:nowrap">${d.id ? `scored in ${d.races.length} race${d.races.length === 1 ? '' : 's'}` : 'new'}</span>
        <button class="btn small" aria-label="Remove ${esc(d.name)}" title="Remove this division" onclick="divRemove(${i})">&#215;</button></div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span style="width:58px;color:var(--ink-3)">Gender</span>
        <span class="mode" role="group" aria-label="Gender">${[['', 'Both'], ['M', 'Boys'], ['F', 'Girls']].map(([g, l]) => `<button class="${d.gender === g ? 'on' : ''}" aria-pressed="${d.gender === g}" onclick="divSet(${i}, 'gender', '${g}')">${l}</button>`).join('')}</span></div>
      <div style="display:flex;gap:8px;align-items:flex-start"><span style="width:58px;flex:0 0 58px;color:var(--ink-3);padding-top:2px">Teams</span>
        <div style="flex:1;display:grid;gap:4px">
          <span class="mode" role="group" aria-label="Teams" style="justify-self:start"><button class="${d.teamMode === 'all' ? 'on' : ''}" onclick="divSet(${i}, 'teamMode', 'all')">All teams</button><button class="${d.teamMode === 'pick' ? 'on' : ''}" onclick="divSet(${i}, 'teamMode', 'pick')">Pick teams${d.teamMode === 'pick' ? ` (${d.team_ids.length})` : ''}</button></span>
          ${d.teamMode === 'pick' ? `<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px 10px;max-height:132px;overflow:auto;padding:2px 0">
            ${T.map(t => `<label class="chk"><input type="checkbox" ${d.team_ids.includes(t.id) ? 'checked' : ''} onchange="divSet(${i}, 'team', '${esc(t.id)}')"> ${esc(t.name)}</label>`).join('') || '<span class="hint" style="margin:0">No teams in the meet yet.</span>'}</div>` : ''}</div></div>
      <div style="display:flex;gap:4px;align-items:center;flex-wrap:wrap"><span style="width:62px;color:var(--ink-3)">Grades</span>
        ${chip(!d.grades.length, 'All', `divSet(${i}, 'grade', 'all')`)}${grades.map(g => chip(d.grades.includes(g), esc(g), `divSet(${i}, 'grade', '${esc(g)}')`)).join('')}</div>

    </div>`;
  }).join('');
  dlg(`<h3>Divisions</h3><div class="body" style="width:640px;max-width:calc(100vw - 40px);display:grid;gap:10px">
    <p style="margin:0">Extra standings inside a race, each re-scored among its own runners (places, and team scores when on). A runner is in a division when gender, team and grade all match. Races with several scoring events (run together, or girls and boys scored apart) score each division in each event separately. Pick the races that score each division in Meet › Races › &#8942; › Divisions…</p>

    <div style="display:grid;gap:10px;max-height:60vh;overflow:auto">${rows}</div>
    <span id="div-msg" class="msg-line bad">${esc(DIVD.msg)}</span></div>
    <div class="foot"><button class="btn" onclick="closeDlg()">Cancel</button><button class="btn primary" onclick="divisionsSave()">Save divisions</button></div>`);

async function bibFix(action, ids, all) {
  if (action === 'restore' && !ids && !confirm('Put the printed number back on every runner whose bib changed? Anyone else holding one of those numbers loses it (they show under "without a bib" to number again).')) return;
  if (all && !confirm("Record every runner's current bib as the one handed out? Do this only when the bibs on the runners are the meet's current bibs.")) return;
  const body = { action };
  if (ids) body.athlete_ids = ids;
  if (all) body.all = true;
  const r = await meetApi('/api/meet/bibs/check', body);
  if (!r.ok) { dlg(bibCheckHtml(BIBCHK || {}, { ok: false, text: r.data.error })); return; }
  if (r.data.meet) applyMeet(r.data.meet);
  BIBCHK = r.data.check;
  const rep = r.data.report || {};
  const text = action === 'restore' ? `Put back ${(rep.restored || []).length} printed number(s)` + ((rep.cleared || []).length ? `; ${rep.cleared.map(x => `${x.name} (had ${x.bib})`).join(', ')} now without a bib` : '')
    + ((rep.skipped || []).length ? `; ${rep.skipped.length} left alone (two runners printed the same number)` : '')
    : action === 'accept' ? `Recorded ${rep.recorded || 0} bib(s) as handed out` : 'Start lists written';
  dlg(bibCheckHtml(BIBCHK, { ok: true, text }));
}
function liveText(live) {

  if (live.last_push_age != null) bits.push(`last push ${Math.round(live.last_push_age)} s ago`);
  else bits.push(live.in_flight ? 'sending…' : 'nothing sent yet');
  if (live.runners_sent) bits.push(`${live.runners_sent} runners`);
  if (live.start_times) bits.push(`${live.start_times} start time${live.start_times === 1 ? '' : 's'}`);
  if (live.errors) bits.push(`${live.errors} error${live.errors === 1 ? '' : 's'}${live.last_error ? ': ' + live.last_error : ''}`);
  return bits.join(' · ');
}

/* /api/meet/print/<report>.<pdf|txt>: a download, saved with the picker like Export CSV */
const PRINT_PARAMS = {                // mirrors meet_api.REPORTS
  'results': ['race', 'columns', 'places', 'grades', 'teams', 'hide', 'events', 'divisions'],
  'meet-results': ['columns', 'races', 'places', 'grades', 'teams', 'hide', 'events', 'divisions'],
  'team-scores': ['race', 'races', 'events', 'breakdown', 'divisions'], 'awards': ['race', 'races', 'events', 'divisions'],
  'award-labels': ['race', 'races', 'events', 'skip', 'divisions'], 'finish-line': ['race', 'races'], 'rosters': ['teams'],
  'team-labels': ['teams', 'skip'], 'competitor-labels': ['teams', 'skip'], 'split-scores': ['race', 'breakdown'],
  'start-list': ['race'], 'team-bibs': ['teams'], 'announcer': ['race', 'races', 'top', 'team_count', 'events', 'divisions'],
  'schedule': [],
};
function printUrl(report, ext, params) {
  const take = PRINT_PARAMS[report];
  params = Object.assign({}, params);
  if (ext !== 'pdf') delete params.columns;                     // columns is a PDF layout
  if (take) for (const k of Object.keys(params)) if (!take.includes(k)) delete params[k];
  const q = Object.entries(params || {}).filter(([, v]) => v !== '' && v != null && !(Array.isArray(v) && !v.length))
    .map(([k, v]) => `${k}=${encodeURIComponent(Array.isArray(v) ? v.join(',') : v)}`).join('&');
  return `/api/meet/print/${report}.${ext}${q ? '?' + q : ''}`;
}
function slugName(s) { return String(s || 'meet').replace(/[^A-Za-z0-9_-]+/g, '_').replace(/^_+|_+$/g, '') || 'meet'; }
/* Printouts open in a new browser tab (2026-10-06, user: "make it so that a
   generated results page opens in the browser"): the browser shows the PDF
   or text, prints it, and its Save asks for the name and folder. Whether a
   browser opens a download by itself is its own setting, so nothing is
   downloaded first. A blocked pop-up falls back to Save as. Called straight
   from the click, so the new tab is never blocked for that reason. */
function meetPrint(report, ext, params, label) {
  const base = slugName(label || (MEET.info ? MEET.info.name : 'meet'));
  const url = printUrl(report, ext, params), name = `${base}-${report}.${ext}`;
  const w = window.open(`${url}${url.includes('?') ? '&' : '?'}inline=1&name=${encodeURIComponent(name)}`, '_blank');
  if (w) return Promise.resolve(true);
  return saveAs(url, name, ext === 'pdf' ? 'PDF file' : 'Text file', ext === 'pdf' ? 'application/pdf' : 'text/plain', '.' + ext);
}
/* Announcer version of awards (2026-10-03, user): top N finishers and N (or
   All) teams, printed in reverse for reading aloud. Meet-wide without race. */
function announcerPrint(ext, rk, prefix, extra) {
  const top = parseInt(gv(prefix + '-top'), 10);
  const teams = String(gv(prefix + '-teams')).trim().toLowerCase();
  if (!(top > 0)) { meetMsg('Top finishers: a number', false); return; }
  if (teams !== 'all' && !(parseInt(teams, 10) >= 0)) { meetMsg('Teams: a number or All', false); return; }
  const params = { race: rk || '', top, team_count: teams === 'all' ? 'all' : parseInt(teams, 10) };
  if (rk && DRAWER.rk === rk && DRAWER.opt.events) params.events = DRAWER.opt.events;
  if (rk && DRAWER.rk === rk && DRAWER.opt.divs) params.divisions = DRAWER.opt.divs;
  Object.assign(params, extra || {});
  meetPrint('announcer', ext, params, rk ? meetRaceName(rk) : null);
}

/* Undo strip: one level, after an athlete/bib edit (POST /api/meet/undo) */

/* after any edit: undo line, then re-read the page */
function edited(text, warnings) {

  meetLists(true).then(() => meetPage(false));
  const fresh = staleRks().filter(rk => !STALE_ASKED.has(rk));
  staleRks().forEach(rk => STALE_ASKED.add(rk));

}

/* Re-finalize (2026-10-05, user's ask): a bib changed in a final race, whose
   frozen results still show the old bibs - Reopen + Mark final in one step.
   All or nothing on the server: if a finisher can't be placed the race keeps
   its old results and says why. Live follows by itself; the official
   MileSplit results are only sent again on request. */
const STALE_ASKED = new Set();
function staleRks() {
  const f = (MEET.fix || []).find(x => x.kind === 'stale_final');
  return f ? (f.detail || []) : [];
}
function staleFinalDlg(rks) {
  rks = (rks && rks.length ? rks : staleRks());
  if (!rks.length) { meetMsg('No final race shows old bibs', true); return; }
  const names = rks.map(rk => `<b>${esc(meetRaceName(rk))}</b>`).join(', ');
  dlg(`<h3>Final results show old bibs</h3><div class="body" style="max-width:500px">
    ${names} ${rks.length === 1 ? 'is' : 'are'} final, and ${rks.length === 1 ? 'its' : 'their'} results still show the
    bibs from before this change.<br><br>
    <b>Re-finalize</b> works the results out again from the reads with the bibs athletes hold now, and makes them final
    again in one step. If a finisher can't be placed, nothing changes and you're told why.
    MileSplit Live (if on) follows by itself.
    <div id="sf-out" style="margin-top:10px"></div>
  </div><div class="foot">
    <button class="btn" onclick="closeDlg()">Later</button>
    <button class="btn primary" id="sf-go" onclick='refinalizeAll(${esc(JSON.stringify(rks)).replace(/"/g, "&quot;")})'>Re-finalize now</button></div>`);
}
async function refinalizeAll(rks) {
  const go = document.getElementById('sf-go');
  if (go) { go.disabled = true; go.textContent = 'Working…'; }
  const out = [], resend = [];
  for (const rk of rks) {
    const r = await meetApi(`/api/meet/races/${rk}/refinalize`, {});
    if (r.ok) {
      out.push(`<div style="color:var(--good)">${ICO.check} ${esc(meetRaceName(rk))}: re-finalized</div>`);
      if (r.data.milesplit_sent) resend.push(rk);
    } else {
      const un = (r.data.unresolved || []).slice(0, 6).map(w => `<li>${esc(w.text)}</li>`).join('');
      out.push(`<div style="color:var(--warn)">${ICO.warn} ${esc(meetRaceName(rk))}: ${esc(r.data.error)}${un ? `<ul style="margin:4px 0;padding-left:18px">${un}</ul>` : ''}
        <button class="btn small" onclick="refinalizeReopen('${esc(rk)}')">Reopen ${esc(meetRaceName(rk))} instead</button></div>`);
    }
  }
  const el = document.getElementById('sf-out');
  if (el) el.innerHTML = out.join('') + (resend.length ? `<div style="margin-top:10px">These results were sent to MileSplit
      before; the official results there still show the old ones.
      <button class="btn small primary" onclick='refinalizeResend(${esc(JSON.stringify(resend)).replace(/"/g, "&quot;")}, this)'>Send the corrected results</button></div>` : '');
  if (go) go.remove();
  const done = rks.length - out.filter(x => x.includes('var(--warn)')).length;
  if (done) meetMsg(`Re-finalized ${done} race${done === 1 ? '' : 's'} with the current bibs`, true);   // replaces the old-bib warning
  meetLists(true).then(() => meetPage(false));
  if (DRAWER.rk) drawerLoad();
  refresh();
}
async function refinalizeResend(rks, btn) {
  if (btn) { btn.disabled = true; btn.textContent = 'Sending…'; }
  // one upload carries every final race (2026-10-09: MileSplit keeps only
  // the last upload, so one per race left only the last race up)
  const bad = [];
  const r = await meetApi(`/api/meet/races/${rks[0]}/milesplit/upload`, {});
  if (!r.ok) bad.push(r.data.error);
  if (btn) btn.outerHTML = bad.length ? `<span style="color:var(--crit)">${esc(bad.join(' · '))}</span>` : `<span style="color:var(--good)">Sent</span>`;
  if (DRAWER.rk) drawerLoad();
}
async function refinalizeReopen(rk) {
  const r = await meetApi(`/api/meet/races/${rk}/reopen`, {});
  closeDlg();
  if (!r.ok) { meetMsg(r.data.error, false); return; }

  meetGo('results');

/* inline bib: Enter saves, Esc puts it back; 409 = taken -> Swap popover */
function athBibKey(e, inp) {
  if (e.key === 'Enter') { e.preventDefault(); athSaveBib(inp.dataset.aid, inp.value.trim(), inp); }
  else if (e.key === 'Escape') { e.stopPropagation(); inp.value = inp.dataset.old; closeMpop(); inp.blur(); }
}
function athBibBlur(inp) {
  // a click into the popover that belongs to this cell keeps the typed value
  setTimeout(() => {

    if (document.activeElement !== inp) inp.value = inp.dataset.old;

async function athSaveBib(aid, bib, inp) {
  const v = ATH_BY_ID[aid] || { athlete_id: aid };

  if (!bib) {
    if (!confirm(`Take bib ${v.bib} off ${fullName(v)}? They will have no bib.`)) { inp.value = inp.dataset.old; return; }
    const r = await meetApi('/api/meet/bibs/clear', { athlete_ids: [aid] });
    if (!r.ok) { meetMsg(r.data.error, false); return; }
    edited(`Bib ${v.bib} taken off ${fullName(v)}`, (r.data.report || {}).warnings);
    return;
  }
  const r = await meetApi(`/api/meet/athletes/${aid}/bib`, { bib });
  if (r.status === 409 && r.data.holder) { openSwapPop(inp, v, bib, r.data); return; }

function placeMpop() {
  const el = document.getElementById('mpop'), a = MPOP.anchor;
  if (!a || el.hidden) return;
  const r = a.getBoundingClientRect(), w = el.offsetWidth, h = el.offsetHeight;
  const left = Math.max(12, Math.min(r.left + scrollX, scrollX + document.documentElement.clientWidth - w - 12));
  let top = r.bottom + scrollY + 6;
  if (r.bottom + h + 12 > innerHeight && r.top > h + 12) top = r.top + scrollY - h - 6;
  el.style.left = left + 'px'; el.style.top = top + 'px';

/* Scheduled start (2026-10-03): typed in the Start cell. Enter or leaving
   the cell saves, Esc puts it back, blank clears; the server reads "8am",
   "8:00 AM", "08:00", "20:15" and answers 400 to anything else. */
let RACE_FOCUS = null;
function raceTimeKey(e, inp) {
  if (e.key === 'Enter') { e.preventDefault(); raceTimeSave(inp, true); }
  else if (e.key === 'Escape') { e.stopPropagation(); inp.value = inp.dataset.old; inp.blur(); }
}
function raceTimeBlur(inp) {
  const tr = inp.closest('tr'); if (tr) tr.draggable = true;
  if (inp.value.trim() !== inp.dataset.old) raceTimeSave(inp, false);
}
async function raceTimeSave(inp, next) {
  const rk = inp.dataset.rk, val = inp.value.trim();
  if (val === inp.dataset.old) { if (next) { RACE_FOCUS = rk; racesLoad(); } return; }
  inp.dataset.old = val;                          // a blur right after Enter doesn't save twice
  const r = await meetApi(`/api/meet/races/${rk}`, { start_time: val });
  if (!r.ok) {
    meetMsg(r.data.error, false);
    const race = meetRace(rk) || {};
    inp.dataset.old = race.start_time_text || '';
    inp.value = inp.dataset.old;
    if (next) { inp.focus(); inp.select(); }
    return;
  }
  meetMsg(`${meetRaceName(rk)}: start time ${val ? 'saved' : 'cleared'}`, true);
  if (next) { RACE_FOCUS = rk; racesLoad(); return; }
  // Tabbed or clicked into another cell: don't redraw under the cursor.
  // Show the stored text here and redraw once focus leaves the page.
  await meetLists(true);
  const a = document.activeElement, m = meetRace(rk);
  if (a && a !== inp && a.tagName === 'INPUT' && a.closest && a.closest('#meet-page')) {
    if (m && document.body.contains(inp)) inp.value = inp.dataset.old = m.start_time_text || '';
    MV.stale = true;
    return;
  }
  racesLoad();
}
/* + New race (B4): another heat of an event, or a new event (open race) */

async function raceCancel(rk) {
  const r = meetRace(rk) || {};
  const n = (r.entries || 0) + (r.scratched || 0);
  if (!confirm(`Cancel ${r.name || rk}?${n ? ` Its ${n} entr${n === 1 ? 'y' : 'ies'} become not entered (the athletes stay in the meet).` : ''} Its race pane goes too. Only possible before the race has a gun or any reads.`)) return;
  const d = await meetApi(`/api/meet/races/${rk}`, undefined, 'DELETE');
  meetMsg(d.ok ? `${r.name || rk} cancelled` : d.data.error, d.ok);

let RACE_DRAG = null;
async function raceDrop(e, onto) {
  e.preventDefault();
  document.querySelectorAll('tr.drag-over').forEach(t => t.classList.remove('drag-over'));
  const from = RACE_DRAG; RACE_DRAG = null;
  if (!from || from === onto) return;
  const order = MEET_RACES.map(r => r.rk);
  order.splice(order.indexOf(from), 1);
  order.splice(order.indexOf(onto), 0, from);
  MEET_RACES.sort((a, b) => order.indexOf(a.rk) - order.indexOf(b.rk));
  const r = await meetApi('/api/meet/races/order', { order });
  meetMsg(r.ok ? 'Run order saved' : r.data.error, r.ok);
  racesLoad();
}

    ['Entries…', () => athShow({ race: rk })],

    [r.split_genders ? 'Score genders together' : 'Score genders separately', () => raceSplit(rk, !r.split_genders)],

  const groups = (Array.isArray(ts) ? [['', ts]] : Object.entries(ts)).filter(([ev]) => onlyEv == null || String(ev) === String(onlyEv));
  if (!groups.some(([, rows]) => (rows || []).length)) return '';
  const divName = ev => { const x = (race.divisions || []).find(v => String(v.event) === String(ev)); return x ? x.name : `Event ${ev}`; };
  return `<div class="sec"><div class="t">Team scores</div>
    ${groups.filter(([, rows]) => (rows || []).length).map(([ev, rows]) => `
      ${groups.length > 1 ? `<div style="color:var(--ink);font-weight:600;margin:6px 0 2px">${esc(divName(ev))}</div>` : ''}
      <table class="tsort" data-tsort="teamscores" style="font-size:12.5px"><tr><th></th><th>Team</th><th class="right">Score</th><th class="right">Places</th></tr>
      ${rows.map(t => {
        const name = t.team || t.name || meetTeamName(t.team_id) || t.team_id || '';
        if (!t.complete) return `<tr><td style="color:var(--ink-3)">&#8212;</td><td>${esc(name)}</td><td class="right num" style="color:var(--warn)">${esc(t.count || '')}</td><td class="right" style="color:var(--ink-3)">not scored</td></tr>`;
        const sc = (t.runners || []).filter(r => r.scorer).map(r => r.points), dp = (t.runners || []).filter(r => !r.scorer).map(r => r.points);
        return `<tr><td class="num">${t.rank ?? ''}</td><td style="color:var(--ink)">${esc(name)}</td><td class="right num" style="color:var(--ink);font-weight:650">${t.score}</td>
          <td class="right num">${sc.join('-')}${dp.length ? ` <span style="color:var(--ink-3)">(${dp.join(', ')})</span>` : ''}</td></tr>`;
      }).join('')}</table>`).join('')}
    <div class="hint">(n) = displacers. Exhibition runners don't score or displace.</div></div>`;
}
function drawerParams(extra) {
  const o = DRAWER.opt, p = { race: DRAWER.rk };
  if (o.from || o.to) p.places = `${o.from || 1}-${o.to || ''}`;          // '10-' = 10th onward
  if (o.grades.length) p.grades = o.grades;
  if (o.teams) p.teams = o.teams;
  if (o.hide.length) p.hide = o.hide;
  if (o.events) p.events = o.events;
  if (o.divs) p.divisions = o.divs;
  return Object.assign(p, extra || {});
}
function drawerPrint(report, ext, extra) {
  const race = meetRace(DRAWER.rk) || {};
  const p = report === 'results' ? drawerParams(ext === 'pdf' ? { columns: DRAWER.opt.columns } : {}) : { race: DRAWER.rk };
  if (report !== 'results' && DRAWER.opt.events) p.events = DRAWER.opt.events;
  if (report !== 'results' && DRAWER.opt.divs) p.divisions = DRAWER.opt.divs;
  Object.assign(p, extra || {});
  meetPrint(report, ext, p, race.name || DRAWER.rk);
}
/* Print option (2026-10-06): the division standings printed after each
   race's results (results, team scores, awards, labels, announcer). All =
   every division the race is scored in; None = the race's results only;
   picked = only those divisions, without the race's own results. */
function divOptHtml(o, chip) {
  const D = MEET.divisions || [];
  if (!D.length) return '';
  const sel = Array.isArray(o.divs) ? o.divs : [];
  return `<div style="display:flex;gap:4px;align-items:center;flex-wrap:wrap"><span style="width:54px;color:var(--ink-3)" title="Division standings printed after each race's own results">Divisions</span>
      ${chip(o.divs == null, 'All', "drawerOpt('divs', 'all')")}${chip(o.divs === 'none', 'None', "drawerOpt('divs', 'none')")}
      ${D.map(x => chip(sel.includes(x.id), esc(x.name), `drawerOpt('divs', '${esc(x.id)}')`)).join('')}</div>
    ${sel.length ? '<div class="hint" style="margin:0">Only the picked divisions print, without the race\'s own results.</div>' : ''}`;
}
function drawerOpt(k, v) {
  const o = DRAWER.opt;
  if (k === 'grade') o.grades = v === 'all' ? [] : (o.grades.includes(v) ? o.grades.filter(g => g !== v) : o.grades.concat([v]));
  else if (k === 'team') {
    if (v === 'all') o.teams = null;
    else { const cur = o.teams || []; o.teams = cur.includes(v) ? cur.filter(t => t !== v) : cur.concat([v]); if (!o.teams.length) o.teams = null; }
  } else if (k === 'hide') o.hide = o.hide.includes(v) ? o.hide.filter(h => h !== v) : o.hide.concat([v]);
  else if (k === 'divs') {
    if (v === 'all' || v === 'none') o.divs = v === 'all' ? null : 'none';
    else { const cur = Array.isArray(o.divs) ? o.divs : []; o.divs = cur.includes(v) ? cur.filter(x => x !== v) : cur.concat([v]); if (!o.divs.length) o.divs = null; }
  }
  else if (k === 'event') {
    const all = ((meetRace(DRAWER.rk) || {}).divisions || []).map(x => String(x.event)), cur = o.events || all;
    o.events = cur.includes(v) ? cur.filter(e => e !== v) : cur.concat([v]);
    if (o.events.length === all.length || !o.events.length) o.events = null;
  } else o[k] = v;
  if (k === 'from' || k === 'to') { const s = document.getElementById('dr-sum'); if (s) s.textContent = drawerSummary(); return; }
  renderDrawer();
}
function drawerSummary() {
  const o = DRAWER.opt, race = meetRace(DRAWER.rk) || {};
  const bits = [o.from || o.to ? `Places ${o.from || 1}–${o.to || 'last'}` : 'All places', o.grades.length ? `Grades ${o.grades.join(', ')}` : 'Grades all',
    o.teams ? o.teams.map(t => meetTeamName(t) || t).join(', ') : 'All schools'];
  if (o.hide.length) bits.push('no ' + o.hide.join('/'));
  if (o.events) bits.push(o.events.map(e => ((race.divisions || []).find(x => String(x.event) === e) || {}).name || e).join(', '));
  if (o.divs === 'none') bits.push('no divisions');
  else if (Array.isArray(o.divs)) bits.push('only ' + o.divs.map(i => ((MEET.divisions || []).find(d => d.id === i) || {}).name || i).join(', '));
  return bits.join(' · ');
}
function drawerPrintHtml(race) {
  const o = DRAWER.opt, chip = (on, label, fn) => `<button class="btn small" aria-pressed="${on}" onclick="${fn}" style="font-size:12px;padding:2px 9px;${on ? 'color:var(--boys);border-color:var(--boys)' : 'border-color:var(--border)'}">${label}</button>`;
  const divs = race.divisions || [];
  return `<div class="sec"><div class="t">Print</div><div style="display:grid;gap:8px">
    <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><span style="width:52px;color:var(--ink-3)">Places</span>from
      <input value="${esc(o.from)}" aria-label="From place" class="num" style="width:46px" oninput="drawerOpt('from', this.value.trim())"> to
      <input value="${esc(o.to)}" aria-label="To place" class="num" style="width:46px" oninput="drawerOpt('to', this.value.trim())"> <span style="color:var(--ink-3);font-size:11.5px">blank = all</span></div>
    <div style="display:flex;gap:4px;align-items:center;flex-wrap:wrap"><span style="width:54px;color:var(--ink-3)">Grades</span>
      ${chip(!o.grades.length, 'All', "drawerOpt('grade', 'all')")}${(DRAWER.grades.length ? DRAWER.grades : ['9', '10', '11', '12']).map(g => chip(o.grades.includes(g), esc(g), `drawerOpt('grade', '${esc(g)}')`)).join('')}</div>
    <div style="display:flex;gap:6px;align-items:flex-start"><span style="width:52px;flex:0 0 52px;color:var(--ink-3);padding-top:1px">Schools</span>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px 10px;flex:1">
        <label class="chk"><input type="checkbox" ${o.teams ? '' : 'checked'} onchange="drawerOpt('team', 'all')"> All schools</label>
        ${DRAWER.teams.map(t => `<label class="chk"><input type="checkbox" ${o.teams && o.teams.includes(t.id) ? 'checked' : ''} onchange="drawerOpt('team', '${esc(t.id)}')"> ${esc(t.name)}</label>`).join('')}</div></div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span style="width:52px;color:var(--ink-3)">Hide</span>
      ${['DNF', 'DNS', 'DQ'].map(h => `<label class="chk"><input type="checkbox" ${o.hide.includes(h) ? 'checked' : ''} onchange="drawerOpt('hide', '${h}')"> ${h}</label>`).join('')}</div>
    ${divOptHtml(o, chip)}
    ${divs.length > 1 ? `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span style="width:52px;color:var(--ink-3)">Events</span>
      ${divs.map(x => `<label class="chk"><input type="checkbox" ${!o.events || o.events.includes(String(x.event)) ? 'checked' : ''} onchange="drawerOpt('event', '${esc(x.event)}')"> ${esc(x.name || x.event)}</label>`).join('')}</div>` : ''}
    <div id="dr-sum" style="padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--ink)">${esc(drawerSummary())}</div>
    ${o.grades.length ? '<div class="hint" style="margin:0">With a grade filter, team scores are left out.</div>' : ''}
    <div class="acts"><button class="btn" onclick="drawerPrint('results', 'pdf')">PDF</button>
      <span class="mode" role="group" aria-label="PDF layout"><button class="${o.columns === 1 ? 'on' : ''}" aria-pressed="${o.columns === 1}" onclick="drawerOpt('columns', 1)">1 column</button><button class="${o.columns === 2 ? 'on' : ''}" aria-pressed="${o.columns === 2}" onclick="drawerOpt('columns', 2)">2 columns</button></span>
      <button class="btn" onclick="drawerPrint('results', 'txt')">Text</button></div>
    <div class="acts"><button class="btn" onclick="drawerPrint('team-scores', 'pdf', DRAWER.opt.breakdown ? {breakdown: 1} : {})">Team scores only</button>
      <label class="inl"><input type="checkbox" ${o.breakdown ? 'checked' : ''} onchange="DRAWER.opt.breakdown=this.checked"> Breakdown</label>
      <button class="btn" onclick="drawerPrint('team-scores', 'txt', DRAWER.opt.breakdown ? {breakdown: 1} : {})">Text</button></div>
    <div class="acts"><button class="btn" onclick="drawerPrint('awards', 'pdf')">Awards</button>
      <button class="btn" onclick="drawerPrint('award-labels', 'pdf')">Award labels</button>
      <button class="btn" onclick="drawerPrint('split-scores', 'pdf')">Split scores</button>
      <button class="btn" onclick="drawerPrint('finish-line', 'pdf')">Finish line sheets</button></div>
    <div class="acts" title="Read aloud: the top N finishers, Nth to 1st, then N teams (or All), last to champion"><span style="color:var(--ink-3)">Announcer</span>
      Top <input id="dr-ann-top" class="num short" inputmode="numeric" value="${esc(o.annTop || 10)}" oninput="DRAWER.opt.annTop=this.value" aria-label="Top finishers" style="width:34px;padding-left:5px;padding-right:5px">
      · Teams <input id="dr-ann-teams" class="short" list="ann-team-opts" value="${esc(o.annTeams || 3)}" oninput="DRAWER.opt.annTeams=this.value" aria-label="Teams (a number or All)" style="width:46px;padding-left:5px;padding-right:5px">
      <button class="btn" onclick="announcerPrint('pdf', DRAWER.rk, 'dr-ann')">PDF</button><button class="btn" onclick="announcerPrint('txt', DRAWER.rk, 'dr-ann')">Text</button></div>
  </div></div>`;
}
function drawerMilesplitHtml(d) {
  const ms = d.milesplit || {}, live = (MEET.milesplit || {}).live, logged = (MEET.milesplit || {}).logged_in;
  const mk = ok => ok === true ? `<span class="m ok">${ICO.check}</span>` : ok === false ? '<span class="m bad">✗</span>' : '<span class="m na">–</span>';
  return `<div class="sec"><div class="t">MileSplit</div>
    <div class="setup">
      <div class="r">${mk(ms.uploaded_at ? ms.ok !== false : null)}<div><div>${ms.uploaded_at ? `Results sent <span class="num">${hhmmss(ms.uploaded_at)}</span>${ms.ok === false ? ' — refused' : ''}` : 'Results not sent'}</div>
        ${ms.message ? `<div class="d">${esc(ms.message)}</div>` : ''}
        ${!logged ? '<div class="d">Log in to MileSplit on Meet → Info first.</div>' : ''}</div></div>
      <div class="r">${mk(live ? (live.errors ? false : true) : null)}<div><div>Live ${live ? 'on' : 'off'}</div>${live ? `<div class="d">${esc(liveText(live))}</div>` : ''}</div></div>
    </div>
    <div class="acts" style="margin-top:6px">
      <button class="btn" onclick="drawerUpload()" ${!logged ? 'disabled title="Log in to MileSplit on Meet → Info first"' : d.official ? '' : 'disabled title="Mark the race final first"'}>${ms.uploaded_at ? 'Send again' : 'Send results'}</button>
      <button class="btn" onclick="milesplitLive(${!live})">Live ${live ? 'off' : 'on'}</button></div>
    ${ms.uploaded_at ? '<div class="hint">Sending sends every final race in one upload: it replaces all of this meet&#39;s results on MileSplit.</div>' : ''}
    <div id="dr-ms" class="hint"></div></div>`;
}
function drawerErr(t) { DRAWER.msg = t || ''; const m = document.getElementById('dr-msg'); if (m) m.textContent = DRAWER.msg; }
async function drawerMark(bib, mark) {
  if (!bib) { drawerErr('Type the bib to mark'); return; }
  const r = await meetApi(`/api/meet/races/${DRAWER.rk}/marks`, { bib, mark: mark || null });
  if (!r.ok) { drawerErr(r.data.error); renderDrawer(); return; }
  DRAWER.msg = '';
  drawerLoad();
}
async function drawerFinal() {
  return drawerFinalNow();
}
async function drawerFinalNow() {
  await drawerLoad();
  const r = await meetApi(`/api/meet/races/${DRAWER.rk}/final`, {});
  // 409: unresolved finishers, or no race pane yet (the error says which)
  if (r.status === 409 && (r.data.unresolved || []).length) { DRAWER.data.unresolved = r.data.unresolved; DRAWER.msg = r.data.error || ''; renderDrawer(); return; }
  if (!r.ok) { drawerErr(r.data.error); return; }
  // flagged runners have their own line and chips (2026-10-06)
  const w = (r.data.warnings || []).filter(x => !['not_entered', 'unknown_bib', 'scratched'].includes(x.code));
  DRAWER.msg = w.length ? 'Final. ' + w.map(x => x.text || x).join(' · ') : '';
  drawerLoad();
  refresh();
}
async function drawerReopen() {
  if (!confirm(`Reopen ${meetRaceName(DRAWER.rk)}? Its results stop being official until it is marked final again.`)) return;
  const r = await meetApi(`/api/meet/races/${DRAWER.rk}/reopen`, {});
  if (!r.ok) { drawerErr(r.data.error); return; }
  DRAWER.msg = '';
  drawerLoad();
  refresh();
}
async function drawerUpload() {
  const el = () => document.getElementById('dr-ms');
  if (el()) el().textContent = 'Sending…';
  const r = await meetApi(`/api/meet/races/${DRAWER.rk}/milesplit/upload`, {});
  const probs = r.data.problems || [];
  await drawerLoad();
  if (DRAWER.inline) { await meetLists(true); resultsListRender(); }
  if (el()) el().innerHTML = r.ok ? `<span style="color:var(--good)">Sent</span>${probs.length ? ' · ' + probs.map(p => esc(p.text || p)).join(' · ') : ''}`
    : `<span style="color:var(--crit)">${esc(r.data.error)}</span>${probs.map(p => `<div style="color:var(--warn)">${esc(p.text || p)}</div>`).join('')}`;
}

/* Esc closes the meet popover, then the drawer (a dialog closes itself) */
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape' || document.getElementById('dlg').open) return;
  if (!document.getElementById('mpop').hidden) { closeMpop(); return; }
  if (DRAWER.rk) closeDrawer();
});

/* ---------------------------- wiring ---------------------------- */

const socket = io();
/* Flash a pane when a read lands in its race: compare each race's count of
   assigned reads with the previous snapshot (the read itself carries no
   race key; the races_update that follows it does). */
const FLASH = {}, READ_COUNTS = {};
function noteNewReads(d) {
  if (!d || !d.enabled) return;
  for (const key of d.order) {
    const res = d.results[String(key)] || { finishers: [], on_course: [] };
    const n = res.finishers.concat(res.on_course).reduce((a, r) => a + r.splits.length + (r.finish ? 1 : 0), 0);
    if (key in READ_COUNTS && n > READ_COUNTS[key]) FLASH[key] = Date.now();
    READ_COUNTS[key] = n;
  }
}
let LAST_RACES_AT = Date.now();
socket.on('races_update', d => { LAST_RACES_AT = Date.now(); noteNewReads(d); DATA = d; render(); renderStations(); renderEvtSync(); drawerOnRaces(); });
/* meet management: the summary on every meet edit (badge, header, open page) */
socket.on('meet_sync', () => syncLoad());          // meet sync status (2026-10-07)
socket.on('meet_update', s => { applyMeet(s); meetLiveRefresh(); racesTabLists(); if (DRAWER.rk) drawerLoad(); });
socket.on('connect', () => loadMeetSummary());
/* Pushes missed while the socket was down are gone for good, and a
   minimized/background window is where it drops (2026-10-03: the page sat
   on 08:17 data until a stray camera start pushed again at 08:27). So
   re-fetch on every (re)connect, when the window comes back, and every
   15 s of push silence while it is on screen. */
socket.on('connect', () => refresh());
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
setInterval(() => {
  if (!document.hidden && Date.now() - LAST_RACES_AT > 15000) { LAST_RACES_AT = Date.now(); refresh(); }
}, 5000);
socket.on('status_update', applyStatus);
socket.on('tag_read', onTagRead);
socket.on('reads_cleared', () => { LIVE_READS = []; });
socket.on('remote_unit_update', pollUnits);

(async () => {
  refresh(); pollStatus(); pollUnits(); seedLiveReads();
  loadMeetSummary().then(meetRoute);          // #meet/... opens the Meet tab; anything else stays on Races
  try {
    const c = await (await fetch('/api/config')).json();
    CFG = c;
    if (c.event_directory) {
      showMeet(c.event_directory);
      // athletes reload at boot from the remembered folder
      try {
        const a = await (await fetch('/api/athletes')).json();
        if (a.success) showMeet(c.event_directory, `${Object.keys(a.by_bib || {}).length} athletes · ${(a.schools || []).length} schools`);
      } catch (e) {}
    }
  } catch (e) {}
  // #gun=<race key> opens that pane's Gun picker on load (screenshots/tests);
  // #add=<race key>:<bib>:<point> opens the Add-split dialog prefilled.
  const g = /[#&]gun=(\d+)/.exec(location.hash);
  if (g) setTimeout(() => { if (DATA && DATA.races[g[1]]) openGun(parseInt(g[1])); }, 1500);
  // (append :auto to accept the estimate up front, as the review buttons do)
  const a = /[#&]add=(\d+):([^:&]*):([^:&]*)(?::(auto))?/.exec(location.hash);
  if (a) setTimeout(() => { if (DATA && DATA.races[a[1]]) openAdd(parseInt(a[1]), decodeURIComponent(a[2]), decodeURIComponent(a[3]), !!a[4]); }, 1500);
  // #settings=<key> opens a pane's race settings
  const st = /[#&]settings=(\d+)/.exec(location.hash);
  if (st) setTimeout(() => { if (DATA && DATA.races[st[1]]) openScoring(parseInt(st[1])); }, 1500);
  const sl = /[#&]savelif=(\d+)/.exec(location.hash);
  if (sl) setTimeout(() => { if (DATA && DATA.races[sl[1]]) openSaveLif(parseInt(sl[1])); }, 1500);
  // #pop=stations, #pop=fl, #pop=clocks, #pop=app, #pop=reader or
  // #pop=unit:S1 opens a popover on load (handy for screenshots/tests).
  // Old names still work: sb/cam/film -> fl, pi/lora -> stations,
  // reads -> app, clock:COMx -> clocks.
  const m = /[#&]pop=([a-z]+)(?::([^&]+))?/.exec(location.hash);
  if (m) setTimeout(() => {
    const kind = { sb: 'fl', cam: 'fl', film: 'fl', pi: 'stations', lora: 'stations', reads: 'app', clock: 'clocks' }[m[1]] || m[1];
    const chip = document.querySelector(`.chip[data-pop="${kind}"]`);
    if (chip) togglePop(chip);
    else if (kind === 'unit' || kind === 'reader')
      openPop(kind, kind === 'unit' ? decodeURIComponent(m[2] || '') : null, document.getElementById('chip-st'));
  }, 1500);
})();
setInterval(pollStatus, 3000);
setInterval(pollUnits, 5000);
setInterval(() => { if (DATA && DATA.enabled) render(); }, 1000);
setInterval(tickStartOptions, 1000);
setInterval(renderStationsChip, 1000);     // the dots fade by the second
setInterval(() => { if (CLOCK_STATUS) renderClocksChip(CLOCK_STATUS); }, 1000);   // the clocks tick
</script>
