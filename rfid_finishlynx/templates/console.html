<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RFID Timing Console</title>
<script src="/static/socket.io.min.js"></script>
<style>
  :root {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #242422;
    --border: #383835; --ink: #fff; --ink-2: #c3c2b7; --ink-3: #8a897f;
    --girls: #d55181; --boys: #3987e5;
    --good: #0ca30c; --warn: #fab219; --crit: #d03b3b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink);
         font: 14px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .num { font-variant-numeric: tabular-nums; }

  .topbar { display: flex; align-items: center; gap: 10px; padding: 10px 20px;
            border-bottom: 1px solid var(--border); background: var(--surface); flex-wrap: wrap; }
  .topbar h1 { font-size: 16px; margin: 0 8px 0 0; font-weight: 600; }
  .topbar a { color: var(--ink-3); font-size: 12px; text-decoration: none; }
  .spacer { flex: 1; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px;
          border-radius: 999px; font-size: 12px; background: var(--surface-2);
          border: 1px solid var(--border); color: var(--ink-2); white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--ink-3); }
  .dot.good { background: var(--good); } .dot.warn { background: var(--warn); }
  .dot.crit { background: var(--crit); }
  .chip.click { cursor: pointer; user-select: none; }
  .chip.click:hover, .chip.click.open { border-color: var(--ink-3); color: var(--ink); }

  /* chip popover: device details + quick controls */
  .pop { position: absolute; z-index: 60; width: 380px; max-width: calc(100vw - 24px);
         max-height: calc(100vh - 90px); overflow-y: auto;
         background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
         box-shadow: 0 12px 30px rgba(0,0,0,.55); font-size: 12.5px; color: var(--ink-2); }
  .pop h3 { margin: 0; padding: 10px 14px; font-size: 13.5px; color: var(--ink);
            border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
  .pop h3 .x { margin-left: auto; cursor: pointer; color: var(--ink-3); font-size: 16px; line-height: 1; }
  .pop .rows { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; padding: 10px 14px; }
  .pop .rows[hidden], .pop .hint[hidden] { display: none; }   /* display:grid would otherwise beat hidden */
  .pop .rows .k { color: var(--ink-3); }
  .pop .rows .v { color: var(--ink); overflow-wrap: anywhere; }
  .pop .rows .h { grid-column: 1 / -1; font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em;
                  color: var(--ink-3); margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--border); }
  .pop .sec { padding: 8px 14px 10px; border-top: 1px solid var(--border); }
  .pop .sec .t { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em;
                 color: var(--ink-3); margin-bottom: 6px; }
  .pop .acts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .pop .acts .btn { font-size: 12px; padding: 4px 9px; }
  .pop .btn.danger { border-color: var(--crit); color: var(--crit); background: none; }
  .pop input, .pop select { padding: 4px 8px; font-size: 12.5px; background: var(--surface);
    color: var(--ink); border: 1px solid var(--border); border-radius: 6px; }
  .pop input.short { width: 84px; } .pop input.mid { width: 150px; }
  .pop label.inl { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-2); }
  .pop .msg { padding: 6px 14px 10px; font-size: 12px; min-height: 14px; }
  .pop .msg.ok { color: var(--good); } .pop .msg.bad { color: var(--crit); }
  .pop .hint { font-size: 11.5px; color: var(--ink-3); margin-top: 6px; }
  .pop .trouble { font-size: 11.5px; color: var(--warn); margin-top: 6px; }
  .pop.wide { width: 470px; }
  /* Setup check rows (Console chip) */
  .pop .setup { width: 100%; }
  .pop .setup .g { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); margin: 8px 0 2px; }
  .pop .setup .g:first-child { margin-top: 0; }
  .pop .setup .r { display: flex; gap: 8px; padding: 3px 0; color: var(--ink); }
  .pop .setup .m { flex: 0 0 14px; font-weight: 700; text-align: center; }
  .pop .setup .m.ok { color: var(--good); } .pop .setup .m.bad { color: var(--crit); } .pop .setup .m.na { color: var(--ink-3); }
  .pop .setup .d { font-size: 11.5px; color: var(--ink-3); overflow-wrap: anywhere; }
  .pop .setup .f { font-size: 11.5px; color: var(--warn); }
  .pop .more { padding: 0 14px 8px; }
  .pop .more button { background: none; border: 0; color: var(--boys); font: inherit; font-size: 12px; cursor: pointer; padding: 0; }
  /* (i) beside a section title: shows that section's setup notes */
  .ibtn { display: inline-flex; align-items: center; justify-content: center; width: 15px; height: 15px; border-radius: 50%;
          border: 1px solid var(--ink-3); color: var(--ink-3); font: italic 700 10px Georgia, serif; cursor: pointer;
          background: none; padding: 0; text-transform: none; letter-spacing: 0; margin-left: 6px; }
  .ibtn:hover, .ibtn.on { color: var(--ink); border-color: var(--ink); }
  .pop .logs { max-height: 150px; overflow-y: auto; font: 11px/1.4 ui-monospace, Consolas, monospace;
               background: var(--page); border-radius: 6px; padding: 6px 8px; margin-top: 6px; white-space: pre-wrap; }

  .toolbar { display: flex; align-items: center; gap: 8px; padding: 8px 20px;
             border-bottom: 1px solid var(--border); flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); }
  .toolbar input, .toolbar select { padding: 5px 9px; font-size: 12.5px; background: var(--surface);
    color: var(--ink); border: 1px solid var(--border); border-radius: 7px; }

  .btn { font-size: 12.5px; padding: 6px 12px; border-radius: 7px; cursor: pointer;
         background: var(--surface-2); color: var(--ink); border: 1px solid var(--border); }
  .btn.primary { background: var(--boys); border-color: var(--boys); color: #0d0d0d; font-weight: 600; }
  .btn.go { background: var(--good); border-color: var(--good); color: #0d0d0d; font-weight: 600; }
  .btn.stop { background: none; border-color: var(--crit); color: var(--crit); font-weight: 600; }
  .btn.small { font-size: 11px; padding: 1px 7px; border-radius: 5px; color: var(--ink-3); background: none; }

  .layout { display: grid; grid-template-columns: 1fr 340px; gap: 14px; padding: 16px 20px 40px; align-items: start; }
  @media (max-width: 1100px) { .layout { grid-template-columns: 1fr; } }
  .side { display: grid; gap: 14px; position: sticky; top: 12px; }
  .vsep { border-left: 1px solid var(--border); height: 18px; }

  .pane { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  /* a racing pane stands out; a new read for it gives the pane a soft flash */
  .pane.racing { border-color: var(--warn); box-shadow: 0 0 0 1px var(--warn) inset, 0 0 14px rgba(255, 176, 32, 0.25); }
  .pane.racing .pane-head { background: rgba(255, 176, 32, 0.08); }
  .pane.flash { animation: pane-flash 0.9s ease-out 1; }
  @keyframes pane-flash { 0% { background: rgba(255, 176, 32, 0.28); } 100% { background: var(--surface); } }
  .pane-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px;
               border-bottom: 1px solid var(--border); }
  .pane-head h2 { font-size: 14px; margin: 0; font-weight: 600; }
  .pane-head .sub { font-size: 11.5px; color: var(--ink-3); }
  .g { font-weight: 700; font-size: 11px; padding: 1px 6px; border-radius: 4px; color: #0d0d0d; }
  .g.F { background: var(--girls); } .g.M { background: var(--boys); } .g.U { background: var(--ink-3); }
  .g.X { background: linear-gradient(90deg, var(--girls), var(--boys)); }
  .badge { margin-left: auto; font-size: 11px; font-weight: 700; letter-spacing: .04em;
           padding: 3px 8px; border-radius: 5px; white-space: nowrap; }
  .badge.racing  { color: var(--warn); border: 1px solid var(--warn); }
  .badge.final   { color: var(--good); border: 1px solid var(--good); }
  .badge.checkin { color: var(--boys); border: 1px solid var(--boys); }
  .badge.pending { color: var(--ink-3); border: 1px solid var(--border); }
  .badge.held    { color: var(--warn); border: 1px solid var(--warn); }
  .gunrow { display: flex; justify-content: space-between; align-items: baseline;
            padding: 8px 14px; font-size: 12.5px; color: var(--ink-2); border-bottom: 1px solid var(--border); }
  .gunrow .clock { font-size: 17px; font-weight: 600; color: var(--ink); }
  /* one summary line under the gun row: finished / on course / no-show / top team */
  .summ { display: flex; gap: 18px; padding: 7px 14px; border-bottom: 1px solid var(--border); font-size: 12px;
          color: var(--ink-3); align-items: center; flex-wrap: wrap; }
  .summ .n { font-size: 17px; font-weight: 650; color: var(--ink); }
  .summ .team { color: var(--ink-2); }
  .pane.big .summ .n { font-size: 22px; }
  .pane.big .gunrow .clock { font-size: 26px; }
  .pane.big .scroll { max-height: 560px; }
  .pane.big table { font-size: 13.5px; }
  /* sort arrows beside a count (finished: by time, top team: by team) */
  .sort { display: inline-flex; flex-direction: column; gap: 1px; vertical-align: middle; }
  .sort b { font-size: 9px; line-height: 9px; color: var(--ink-3); cursor: pointer; padding: 0 3px; border-radius: 3px; font-weight: 400; }
  .sort b:hover { color: var(--ink); background: var(--surface-2); }
  .sort b.on { color: var(--boys); font-weight: 700; }
  /* pane layout by status: active races big, upcoming as cards, finished as strips */
  .panes { display: grid; gap: 12px; }
  .grid-active { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(560px, 1fr)); align-items: start; }
  .grid-cards { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); }
  .ccard { display: flex; align-items: center; gap: 10px; padding: 9px 14px; background: var(--surface);
           border: 1px solid var(--border); border-radius: 10px; font-size: 12.5px; cursor: pointer; }
  .ccard:hover, .strip:hover { border-color: var(--ink-3); }
  .ccard.checkin { border-color: rgba(57, 135, 229, .55); }
  .ccard h2 { font-size: 13.5px; margin: 0; font-weight: 600; }
  .ccard .btn, .strip .btn { font-size: 11.5px; padding: 3px 8px; }
  .strip { display: flex; align-items: center; gap: 14px; padding: 8px 14px; background: var(--surface);
           border: 1px solid var(--border); border-radius: 10px; cursor: pointer; font-size: 12.5px; color: var(--ink-2); flex-wrap: wrap; }
  .strip h2 { font-size: 13.5px; margin: 0; font-weight: 600; color: var(--ink); }
  .strip .chev { color: var(--ink-3); }
  .strip .acts { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .strip.heldon { border-color: var(--warn); background: rgba(255, 176, 32, 0.06); }
  /* expand/collapse morph (2026-09-27): the old box flies to the race's new spot */
  /* an opened race folds from a click anywhere on its header, as a card or strip opens (2026-09-27) */
  .pane-head.fold { cursor: pointer; }
  .pane-head.fold:hover { background: var(--surface-2); }
  .pane-ghost { position: absolute; z-index: 60; overflow: hidden; pointer-events: none; box-sizing: border-box;
                background: var(--surface); border: 1px solid var(--ink-3); border-radius: 10px; box-shadow: 0 10px 30px rgba(0, 0, 0, .55); }
  .pane-ghost > * { border: 0 !important; box-shadow: none !important; }
  .landed { animation: pane-landed 1.2s ease-out 1; }
  @keyframes pane-landed { 0% { box-shadow: 0 0 0 2px var(--boys); } 100% { box-shadow: 0 0 0 2px transparent; } }
  .countdown { display: flex; align-items: center; gap: 10px; padding: 6px 14px; font-size: 12px; color: var(--good);
               background: rgba(12, 163, 12, .08); border-bottom: 1px solid var(--border); }
  .countdown .btn { font-size: 11px; padding: 2px 8px; }
  .btn.small.on { color: var(--boys); border-color: var(--boys); }
  tr.newest td { background: rgba(12, 163, 12, 0.14); }
  tr.notseen td { color: var(--ink-3); }             /* checked in, not read yet */
  /* finish FinishLynx has no time for: the timer decides (Save to .lif) */
  .btn.lifsave { font-size: 11.5px; padding: 1px 8px; border-color: var(--warn); color: var(--warn);
                 background: rgba(250, 178, 25, .1); animation: lifpulse 1.4s ease-in-out infinite; }
  @keyframes lifpulse { 50% { background: rgba(250, 178, 25, .35); } }
  @media (prefers-reduced-motion: reduce) { .btn.lifsave { animation: none; } }
  /* floating menu (pane More ▾): lives outside the panes so a re-render never closes it */
  .menu { position: absolute; z-index: 70; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
          box-shadow: 0 10px 24px rgba(0,0,0,.55); padding: 4px; min-width: 190px; }
  .menu button { display: block; width: 100%; text-align: left; background: none; border: 0; color: var(--ink);
                 padding: 6px 10px; border-radius: 5px; font: inherit; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
  .menu button:hover { background: var(--surface); }
  .menu button.danger { color: var(--crit); }
  .menu hr { border: 0; border-top: 1px solid var(--border); margin: 4px 2px; }
  /* Stations chip: one short code + dot per station in use (fades green -> red as it drops) */
  .sta { display: inline-flex; align-items: center; gap: 4px; color: var(--ink); font-weight: 600; }
  .sta .dot { transition: background .9s linear; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em;
       color: var(--ink-3); font-weight: 600; padding: 6px 8px 4px; }
  td { padding: 5px 8px; border-top: 1px solid #232321; color: var(--ink-2); }
  td.bib { color: var(--ink); font-weight: 650; }
  td.right, th.right { text-align: right; }
  .pt { font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 4px;
        border: 1px solid var(--border); color: var(--ink-2); }
  .pt.fin { border-color: var(--good); color: var(--good); }
  .flag { font-size: 10px; color: var(--warn); }
  /* missing-split review: finishers lacking an expected split */
  tr.review td { background: rgba(255, 176, 32, 0.08); }
  .flag.miss { cursor: pointer; border: 1px solid var(--warn); border-radius: 4px; padding: 0 4px; }
  .flag.miss:hover { background: var(--warn); color: #000; }
  /* Needs attention: finishers missing a split, at the top of the pane */
  .attention { margin: 6px 14px; padding: 8px 10px; border: 1px solid var(--warn); border-radius: 8px;
               background: rgba(255, 176, 32, 0.08); font-size: 12px; }
  .attention h4 { margin: 0 0 4px; font-size: 12px; color: var(--warn); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .attention .hint { font-weight: normal; color: var(--ink-3); font-size: 11px; }
  .attention .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 4px 0; border-top: 1px solid var(--border); }
  .attention .row:first-child { border-top: 0; }
  .attention .btn { font-size: 11px; padding: 2px 7px; }
  /* Publishing switch (Stations panel) */
  .switch { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 11.5px; color: var(--ink-2); user-select: none; }
  .switch input { display: none; }
  .switch .track { width: 34px; height: 18px; border-radius: 9px; background: var(--crit); position: relative; transition: background .15s; }
  .switch .track::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: left .15s; }
  .switch input:checked + .track { background: var(--good); }
  .switch input:checked + .track::after { left: 18px; }
  .switch .v { font-weight: 700; min-width: 26px; }
  .pane-foot { display: flex; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--border); flex-wrap: nowrap; overflow-x: auto; }
  /* compact so the row of actions stays on one line at pane width */
  .pane-foot .btn { font-size: 11.5px; padding: 4px 8px; white-space: nowrap; flex: 0 0 auto; }
  .note { padding: 8px 14px; font-size: 11.5px; color: var(--ink-3); }
  #units td { vertical-align: middle; white-space: nowrap; }
  #units td.loc { width: 50%; }
  #units select, #units-foot input { padding: 3px 6px; font-size: 12px; background: var(--surface);
    color: var(--ink); border: 1px solid var(--border); border-radius: 6px; }
  #units select { width: 100%; }
  #units select.finish { color: var(--good); font-weight: 600; }
  /* a real button, not a caption: it opens the reader's settings (2026-09-30) */
  #units .btn.rdr { font-size: 11px; padding: 1px 8px; margin-left: 6px; border-radius: 5px;
                    background: var(--surface-2); color: var(--ink); border: 1px solid var(--ink-3); }
  #units .btn.rdr:hover { background: var(--border); border-color: var(--ink-2); }
  #units-foot input { width: 52px; text-align: right; }
  #units-foot .msg-ok { color: var(--good); } #units-foot .msg-bad { color: var(--crit); }
  .reason { font-size: 10.5px; color: var(--warn); }
  .teams { padding: 4px 0 8px; }
  .scroll { max-height: 340px; overflow-y: auto; }
  /* alarm strip: the finish reader (or the split-station link) is down while a race runs */
  .alarm { grid-column: 1 / -1; margin: 0; padding: 10px 16px; border-radius: 10px; font-weight: 700; font-size: 15px;
           display: flex; flex-direction: column; gap: 4px; }
  .alarm[hidden] { display: none; }   /* display:flex would otherwise beat the hidden attribute */
  .alarm.crit { background: var(--crit); color: #fff; animation: alarm-pulse 1s ease-in-out infinite; }
  .alarm.warn { background: var(--warn); color: #000; }
  .alarm .sub { font-weight: 500; font-size: 12.5px; opacity: .9; }
  @keyframes alarm-pulse { 50% { opacity: .55; } }
  .outage { font-size: 11.5px; color: var(--crit); padding: 2px 14px 6px; }
  td.split { white-space: nowrap; }
  td.split .miss { color: var(--warn); cursor: pointer; }
  .feed { max-height: calc(100vh - 190px); overflow-y: auto; }

  dialog { background: var(--surface-2); color: var(--ink); border: 1px solid var(--boys);
           border-radius: 12px; padding: 0; min-width: 340px; }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  dialog h3 { margin: 0; padding: 12px 16px; font-size: 14px; border-bottom: 1px solid var(--border); }
  dialog .body { padding: 12px 16px; font-size: 12.5px; color: var(--ink-2); }
  dialog .foot { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 16px;
                 border-top: 1px solid var(--border); }
  dialog label { display: block; margin: 8px 0 3px; color: var(--ink-3); font-size: 11.5px; }
  dialog input[type=checkbox] { width: auto; margin: 0; cursor: pointer; }
  dialog input, dialog select { width: 100%; padding: 7px 10px; font-size: 13px;
    background: var(--surface); color: var(--ink); border: 1px solid var(--border); border-radius: 7px; }
</style>
</head>
<body>

<div class="topbar">
  <h1>RFID Timing Console</h1>
  <span class="chip click" data-pop="app" id="chip-app" onclick="togglePop(this)"><span class="dot" id="st-app"></span> <span id="st-app-t">Console</span></span>
  <span class="chip click" data-pop="stations" id="chip-st" onclick="togglePop(this)"><span id="st-st">Stations</span></span>
  <span class="chip click" data-pop="fl" id="chip-fl" onclick="togglePop(this)"><span class="dot" id="st-fl"></span> <span id="st-fl-t">FinishLynx</span></span>
  <span class="chip click" data-pop="clocks" id="chip-clocks" onclick="togglePop(this)" hidden><span class="dot" id="st-clocks"></span> <span id="st-clocks-t">Clocks</span></span>
  <div class="spacer"></div>
  <label class="switch" id="pub-switch" title="ON: finish reads go to FinishLynx and the merged .lif files are written for MeetPro. OFF: reads are still heard, shown and backed up here, but nothing goes out — for warm-ups, tag checks or a test start. Always ON after a restart.">
    <span class="k">Publishing</span><input type="checkbox" id="pub-on" checked onchange="setPublishing(this.checked)"><span class="track"></span><span class="v" id="pub-v">ON</span></label>
  <button class="btn go" id="btn-start" onclick="startStop()">Start</button>
  <a href="/classic">legacy console</a>
</div>

<div id="preview-strip" class="alarm warn" style="border-radius:0;margin:0" hidden></div>

<div class="toolbar">
  <span id="meet-label" title="No meet folder loaded">Meet: <b id="meet-name">none loaded</b> <span id="meet-status" class="num" style="color:var(--ink-3)"></span></span>
  <button class="btn" onclick="openLoadMeet()" title="Load (or reload) a Lynx meet folder: lynx.ppl athletes + lynx.evt races">Load meet…</button>
  <span class="vsep"></span>
  <button class="btn" onclick="quickBib()">Quick bib &rarr; FinishLynx</button>
  <div class="spacer"></div>
  <button class="btn" onclick="exportMeet()" title="Every race's results and team scores in one CSV — you pick where it goes">Export meet…</button>
  <button class="btn" id="btn-evt" onclick="openFromEvt()" title="Pick which races from the meet folder's lynx.evt to time">Races from .evt</button>
  <button class="btn primary" onclick="openCreate()">+ New race</button>
  <button class="btn stop" onclick="openCloseMeet()" title="Archive results, then clear every race pane and read">Close meet</button>
</div>

<div class="layout">
  <div id="alarm" class="alarm" hidden></div>
  <div class="panes" id="panes"></div>
  <div class="side">
    <div class="pane">
      <div class="pane-head"><h2>Live reads</h2>
        <span class="badge pending" id="feed-count">0</span></div>
      <div class="feed"><table id="feed"><tr><th>Bib</th><th>Athlete</th><th>Pt</th><th class="right">Clock</th></tr></table></div>
    </div>
  </div>
</div>

<dialog id="dlg"></dialog>
<div id="pop" class="pop" hidden></div>
<div id="menu" class="menu" hidden></div>

<script>
let DATA = null, STATUS = null, FEEDN = 0;

function fmtElapsed(sec) {
  if (sec == null) return '—';
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const ss = s.toFixed(1).padStart(4, '0');
  return h ? `${h}:${String(m).padStart(2,'0')}:${ss}` : `${m}:${ss}`;
}
function fmtClock(iso) { return iso ? iso.slice(11, 23) : '—'; }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function api(path, body) {
  const r = await fetch(path, { method: 'POST',
    headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body || {}) });
  const d = await r.json();
  if (!r.ok) alert(d.error || 'request failed');
  refresh();
  return d;
}

async function refresh() {
  const d = await (await fetch('/api/races')).json();
  noteNewReads(d);
  DATA = d;
  render();
  renderStations();
  renderEvtSync();
}

/* ---------------------------- system status ---------------------------- */

function dot(id, ok, warn) {
  const el = document.getElementById(id);
  el.className = 'dot ' + (ok ? 'good' : warn ? 'warn' : 'crit');
}

async function pollStatus() {
  try { STATUS = await (await fetch('/api/status')).json(); } catch (e) { return; }
  applyStatus(STATUS);
}

function applyStatus(s) {
  // Preview instance (hw_guard.py): the web UI of a copy that may not touch
  // any hardware. Say so loudly so nobody times a race from it.
  const ps = document.getElementById('preview-strip');
  ps.hidden = !s.preview;
  if (s.preview) ps.innerHTML = `PREVIEW ONLY — this console is not connected to the reader, clocks, radio, camera or FinishLynx. <span class="sub">${esc(s.preview_reason || '')}. The live console is unaffected; nothing you do here reaches the track.</span>`;
  // Console chip: just "Console" while running; says so when it is not
  dot('st-app', s.running, true);
  document.getElementById('st-app-t').textContent = s.preview ? 'Console · preview' : s.running ? 'Console' : 'Console · stopped';
  renderStations();
  applyPublishing(s);
  renderFlChip(s);
  renderClocksChip(s);
  renderStationsChip();
  const b = document.getElementById('btn-start');
  b.textContent = s.running ? 'Stop' : 'Start';
  b.className = 'btn ' + (s.running ? 'stop' : 'go');
  renderAlarm(s);
  livePop();
}

/* Loud, unmissable strip above the panes while a race is running and
   something that records it is down: whichever reader is the finish line
   (critical - every finish in that window is lost; the local mat unless a
   station has been made the finish), the split-station radio link, or a
   station that has gone silent. A short beep on the first appearance. */
let ALARM_KEY = '';
function renderAlarm(s) {
  const el = document.getElementById('alarm');
  const racing = DATA && DATA.enabled ? DATA.order.map(k => DATA.races[String(k)]).filter(r => r.status === 'racing') : [];
  const names = racing.map(r => r.name).join(', ');
  const localFinish = readerIsFinish(LOCAL_READER);
  const finishStations = (UNITS || []).filter(u => readerIsFinish(u.reader_id)).map(u => u.reader_id);
  let cls = '', lines = [];
  const rank = c => { if (c === 'crit' || !cls) cls = c; };
  if (s.running && racing.length && !s.reader_connected && !readerOff(LOCAL_READER)) {
    const since = s.reader_down_since ? fmtClock(s.reader_down_since) : '';
    const secs = s.reader_down_since ? Math.round((Date.now() - new Date(s.reader_down_since)) / 1000) : null;
    // ...and where that falls in each running race (its own gun)
    const at = s.reader_down_since ? racing.filter(r => r.gun).map(r =>
      `${esc(r.name)} ${fmtRace(Math.max(0, (new Date(s.reader_down_since) - new Date(r.gun)) / 1000))}–${fmtRace(Math.max(0, (Date.now() - new Date(r.gun)) / 1000))}`).join(', ') : '';
    const when = `${since ? ` since ${since}` : ''}${secs != null ? ` (${secs} s)` : ''}${at ? ` — race time ${at}` : ''}`;
    if (localFinish) {
      rank('crit');
      lines.push(`⚠ FINISH READER OFFLINE${when} — ${esc(names)} racing: finishes are NOT being recorded`);
    } else {
      rank('warn');
      lines.push(`⚠ Reader offline (counts as ${esc(unitRoleText(LOCAL_READER))})${when} — ${esc(names)} racing: those reads are not being recorded`);
    }
    lines.push(`<span class="sub">Check the reader's power and network cable (${esc(CFG.reader ? CFG.reader.host : '')}). The console reconnects by itself; hand-time anyone who crosses now.</span>`);
  }
  if (s.running && racing.length && s.lora_enabled && !s.lora_connected) {
    if (finishStations.length) {
      rank('crit');
      lines.push(`⚠ RADIO LINK DOWN and station ${finishStations.map(esc).join(', ')} is the FINISH LINE — ${esc(names)} racing: finishes are NOT arriving (the station keeps them and resends when the link is back)`);
    } else if (s.lora_ever_connected) {
      // a gateway that never answered since the console started is not in
      // use at this meet, not an outage (2026-09-30)
      rank('warn');
      lines.push(`⚠ Split-station radio link down — ${esc(names)} racing: split reads are not arriving (stations keep them and resend when the link is back)`);
    }
  }
  const silent = (UNITS || []).filter(u => u.last_seen && (Date.now() - new Date(u.last_seen)) / 1000 > 40 && !readerOff(u.reader_id));
  if (s.running && racing.length && s.lora_connected && silent.length) {
    const silentFinish = silent.filter(u => readerIsFinish(u.reader_id));
    const secs = Math.round((Date.now() - new Date(silent[0].last_seen)) / 1000);
    if (silentFinish.length) {
      rank('crit');
      lines.push(`⚠ FINISH STATION ${silentFinish.map(u => esc(u.reader_id)).join(', ')} SILENT for ${secs} s — ${esc(names)} racing: finishes are NOT arriving (it resends when heard again)`);
    } else {
      rank('warn');
      lines.push(`⚠ Station ${silent.map(u => esc(u.reader_id)).join(', ')} silent for ${secs} s while ${esc(names)} racing`);
    }
  }
  if (s.running && racing.length && !localFinish && !finishStations.length) {
    rank('warn');
    lines.push(`⚠ No station is at the finish line — ${esc(names)} racing: nothing will be placed. Set a station's Location to Finish in the Stations chip.`);
  }
  if (s.publishing === false) {
    // racing while off = finishes are not reaching FinishLynx: shout
    rank(racing.length ? 'crit' : 'warn');
    const since = s.publish_off_since ? ` since ${fmtClock(s.publish_off_since)}` : '';
    const kept = s.publish_kept_back ? ` — ${s.publish_kept_back} read${s.publish_kept_back > 1 ? 's' : ''} kept back` : '';
    lines.push(`⚠ PUBLISHING OFF${since}${racing.length ? ` while ${esc(names)} racing` : ''}: nothing is going to FinishLynx or the MeetPro .lif files${kept}. <span class="sub">Switch it on in the top bar. Reads are still recorded here${s.read_backup ? ` and in ${esc(s.read_backup)}` : ''}.</span>`);
  }
  el.hidden = !lines.length;
  el.className = 'alarm ' + cls;
  el.innerHTML = lines.map(l => `<div>${l}</div>`).join('');   // one block per line: two warnings never run together
  const key = lines.length ? cls + lines[0].slice(0, 40) : '';
  if (key && key !== ALARM_KEY && cls === 'crit') beep();
  ALARM_KEY = key;
}
/* FinishLynx chip: one dot for the three FinishLynx-side links (LapTime
   socket, scoreboard feed, camera start sniffer). Green = all up, amber = the
   LapTime link is up but the feed or the camera is not (or the console is
   stopped), red = LapTime down while running. The text carries the armed
   event and FinishLynx's running clock, proof the scoreboard packets arrive. */
function renderFlChip(s) {
  const cs = s.camera_start || {}, camOn = !!s.camera_start_enabled;
  // a camera never heard since the console started (no Wireshark, no
  // camera at this meet) is not in use, not down - same rule as the radio
  // and the clocks (2026-09-30); the Setup check still lists it
  const sbOk = !!s.scoreboard_connected, camOk = !camOn || !!cs.receiving || !cs.replies;
  dot('st-fl', s.finishlynx_connected && sbOk && camOk, s.finishlynx_connected || !s.running);
  // green: the armed event and FinishLynx's clock; otherwise what is wrong
  // the event FinishLynx is timing: scoreboard feed, else its window title
  const ow = s.finishlynx_open_event;
  const evt = s.scoreboard_event ? `Evt ${s.scoreboard_event}-${s.scoreboard_heat}`
            : ow ? `Evt ${ow.event}-${ow.round}-${ow.heat}` : '';
  const problem = !s.running ? '' : !s.finishlynx_connected ? 'link down' : !sbOk ? 'feed silent' : !camOk ? 'camera silent' : '';
  document.getElementById('st-fl-t').textContent = problem ? `FinishLynx · ${problem}` :
    ['FinishLynx', evt, s.finishlynx_clock_running ? fmtRace(s.finishlynx_race_seconds) : ''].filter(Boolean).join(' · ');
  document.getElementById('chip-fl').title =
    (ow ? `Open in FinishLynx: ${ow.name} (${ow.event}-${ow.round}-${ow.heat}) - finish reads for other races stay out of it\n` : '') +
    `LapTime link: ${s.finishlynx_connected ? 'connected' : 'down'}\n` +
    `Scoreboard feed: ${sbOk ? 'receiving' : s.scoreboard_listener_active ? 'nothing yet' : 'listener off'}` +
    (camOn ? `\nCamera start: ${cs.receiving ? 'hearing the camera' : cs.running ? 'no camera replies' : 'not running'}` : '');
}
/* Stations chip: one short code per reader in use - "M1", "M2", "F" from
   where it stands (Stations popover) - each with a dot. Green while the
   reader is up; once it drops the dot fades through amber to red over 30 s,
   so a glance says how long. A LoRa station counts as dropping when its
   10-s heartbeat is overdue (15 s); one that is heard but whose own RFID
   reader is down is amber. A station only shows once it has been heard
   (since the console started); the local mat once it has connected; a
   reader set to Not in use never shows. Re-drawn every second. */
const FADE_START_SEC = 15, FADE_SEC = 30;
let LOCAL_SEEN = false;
function fadeColor(t) {
  // 0 = green, 0.5 = amber, 1 = red
  const G = [12, 163, 12], A = [250, 178, 25], R = [208, 59, 59];
  t = Math.max(0, Math.min(1, t));
  const [a, b, u] = t < 0.5 ? [G, A, t * 2] : [A, R, (t - 0.5) * 2];
  return `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * u)).join(',')})`;
}
function pointCode(p) {
  if (p === chuteId()) return 'C';
  const x = ((DATA && DATA.points) || []).find(q => q.id === p);
  if (x && x.finish) return 'F';
  const label = x ? x.label : p;
  return label.split(/\s+/).map(w => /^\d/.test(w) ? w : w[0].toUpperCase()).join('');
}
function stationCode(id) {
  const pts = (unitPoints(id) || [id]).filter(p => p !== '-');
  return pts.map(pointCode).join('/');
}
function stationOrder(id) {
  // course order: splits by distance, the finish last
  const all = (DATA && DATA.points) || [];
  const p = (unitPoints(id) || [id]).filter(x => x !== '-')[0];
  if (p === chuteId()) return -1;                      // check-in comes before the course
  const i = all.findIndex(q => q.id === p);
  return i < 0 ? 99 : i;
}
function stationItems() {
  const s = STATUS || {}, now = Date.now(), items = [];
  if (s.reader_connected) LOCAL_SEEN = true;
  if (!readerOff(LOCAL_READER) && s.running && (LOCAL_SEEN || s.reader_down_since)) {
    const down = s.reader_connected ? 0 : s.reader_down_since ? (now - new Date(s.reader_down_since)) / 1000 : FADE_SEC;
    items.push({ id: LOCAL_READER, t: s.reader_connected ? 0 : down / FADE_SEC,
                 why: s.reader_connected ? 'reading' : `down ${Math.round(down)} s` });
  }
  for (const u of UNITS || []) {
    if (!u.last_seen || readerOff(u.reader_id)) continue;
    const age = (now - new Date(u.last_seen)) / 1000;
    const late = (age - FADE_START_SEC) / FADE_SEC;
    const t = late > 0 ? Math.max(late, u.state === 'reading' ? 0 : 0.5) : u.state === 'reading' ? 0 : 0.5;
    items.push({ id: u.reader_id, t,
                 why: late > 0 ? `not heard for ${Math.round(age)} s` : u.state === 'reading' ? 'reading' : `heard, reader ${u.state || '?'}` });
  }
  return items.sort((a, b) => stationOrder(a.id) - stationOrder(b.id));
}
function renderStationsChip() {
  const el = document.getElementById('st-st'), chip = document.getElementById('chip-st');
  if (!el) return;
  const items = stationItems();
  const name = id => id === LOCAL_READER ? 'This PC' : id;
  el.innerHTML = items.length
    ? 'Stations ' + items.map(i => `<span class="sta" title="${esc(name(i.id))} · ${esc(unitRoleText(i.id))} · ${esc(i.why)}">${esc(stationCode(i.id))}<span class="dot" style="background:${fadeColor(i.t)}"></span></span>`).join(' ')
    : `<span class="dot"></span> Stations${STATUS && STATUS.running ? ' · none heard yet' : ''}`;
  chip.style.gap = items.length ? '8px' : '';
}
function fmtOffset(v) { return v == null ? '—' : (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(3) + ' s'; }
/* Film offset: each race learns its own from its evaluated finishes and a
   new race starts at 0 (2026-10-01); a manual value is one for all. */
function raceNameOf(k) { const r = DATA && DATA.races && DATA.races[String(k)]; return r ? r.name : `pane ${k}`; }
function filmSummary(fo) {
  if (!fo.apply) return `<span style="color:var(--crit)">off</span>`;
  if (fo.source === 'manual') return `${fmtOffset(fo.manual)} · <span style="color:var(--warn)">manual, every race</span>`;
  const learned = (fo.races || []).filter(r => r.samples);
  if (!learned.length) return `<span style="color:var(--warn)">learning</span> · each race starts at 0`;
  return learned.map(r => `${esc(raceNameOf(r.race))} ${fmtOffset(r.mean)} (${r.samples})`).join(' · ');
}
/* The pane's own value, in its summary line. */
function filmPaneHtml(f) {
  const tip = !f.apply ? 'Film offset is switched off (FinishLynx chip).'
    : f.source === 'manual' ? 'Manual film offset, the same for every race (FinishLynx chip).'
    : f.samples ? `Learned from the ${f.samples} finish${f.samples === 1 ? '' : 'es'} evaluated on film in this race; subtracted from its mat finishes.`
    : 'Nothing evaluated on film in this race yet: its mat finishes go uncorrected until FinishLynx saves evaluated times for it.';
  const v = !f.apply ? 'off' : (f.source === 'manual' || f.samples) ? fmtOffset(f.applied) : '0';
  return `<span title="${esc(tip)}"><span class="n num">${v}</span> film${!f.apply ? '' : f.source === 'manual' ? ' (manual)' : f.samples ? ` · ${f.samples} eval` : ''}</span>`;
}
async function filmSet(body, okText) {
  await popAct('/api/film_offset', body, okText);
}
function filmSetManual() {
  const v = parseFloat(document.getElementById('p-film-manual').value);
  if (isNaN(v)) { popMsg('Enter the offset in seconds, e.g. 0.65 (positive = RFID later than the film)', false); return; }
  filmSet({ manual: v }, `Manual offset ${fmtOffset(v)}`);
}
/* The same controls in the Film chip and the Reader chip (one popover is
   open at a time, so the ids do not collide). */
function filmControlsHtml(fo) {
  return `<div style="margin-bottom:6px">Applying now: <b>${filmSummary(fo)}</b></div>
     <label class="inl"><input type="checkbox" id="p-film-apply" ${fo.apply ? 'checked' : ''} onchange="filmSet({apply: this.checked}, this.checked ? 'Correction on' : 'Correction off')"> subtract the offset from mat finish times</label>
     <label class="inl">Manual, every race <input class="short" id="p-film-manual" type="number" step="0.01" placeholder="0.65" value="${fo.manual != null ? fo.manual : ''}"> s</label>
     <button class="btn primary" onclick="filmSetManual()">Set</button>
     ${fo.manual != null ? `<button class="btn" onclick="filmSet({manual: null}, 'Back to each race\\'s learned value')">Use learned</button>` : ''}
     <button class="btn danger" onclick="if (confirm('Start learning over from now, in every race? Every evaluation already in the saved .lif files is set aside for good; only finishes you evaluate (or re-evaluate) after this moment count. Each race goes back to 0 (or your manual value) until then.')) filmSet({reset: true}, 'Learning restarted from now')">Reset learned</button>`;
}

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = 880; o.connect(g); g.connect(ctx.destination); g.gain.value = 0.2;
    o.start(); setTimeout(() => { o.stop(); ctx.close(); }, 400);
  } catch (e) {}
}
/* Reader dropouts that overlap a race: shown under the pane's gun row so
   the operator knows which finishers may be missing. */
function outageNote(race, s) {
  if (!race.gun || !s || !(s.reader_outages || []).length || readerOff(LOCAL_READER)) return '';
  const gun = new Date(race.gun).getTime();
  const hits = s.reader_outages.filter(o => (o.end ? new Date(o.end).getTime() : Date.now()) > gun);
  if (!hits.length) return '';
  // Clock window plus the same window as race time, so the operator can
  // see at once which finishers (by expected time) may be missing.
  const rt = t => fmtRace(Math.max(0, (new Date(t).getTime() - gun) / 1000));
  const fin = readerIsFinish(LOCAL_READER);
  return `<div class="outage">⚠ ${fin ? 'Finish reader' : `Reader (${esc(unitRoleText(LOCAL_READER))})`} offline during this race: ${hits.map(o =>
    `${fmtClock(o.start)}–${o.end ? fmtClock(o.end) : 'now'} (${Math.round(o.seconds)} s) = race time ${rt(o.start)}–${o.end ? rt(o.end) : 'now'}`).join(', ')} — ${fin ? 'finishes' : 'reads'} in those windows were not recorded</div>`;
}

/* ------------------------- chip popovers ------------------------- */
/* Click a top-bar chip: details for that device plus the knobs you would
   otherwise dig out of /classic → Settings. Info rows refresh with every
   status poll; the controls keep whatever you have typed. */

let CFG = {};          // last /api/config
let UNITS = [];        // last /api/remote/units
const POP = { kind: null, port: null, chip: null };

async function loadConfig() {
  try { CFG = await (await fetch('/api/config')).json(); } catch (e) {}
}

function togglePop(chip) {
  const kind = chip.dataset.pop, port = chip.dataset.port || null;
  if (POP.kind === kind && POP.port === port) { closePop(); return; }
  openPop(kind, port, chip);
}

async function openPop(kind, port, chip) {
  closePop();
  POP.kind = kind; POP.port = port; POP.chip = chip;
  chip.classList.add('open');
  await loadConfig();
  const el = document.getElementById('pop');
  el.className = 'pop' + (kind === 'stations' || kind === 'app' ? ' wide' : '');
  el.innerHTML = buildPop();
  el.hidden = false;
  if (kind === 'stations') renderStations(true);
  placePop();
  if (kind === 'app') { loadSetup(); updCheck(); }
}

/* Updates & support (Console chip): updater.py / support.py on the server. */
function supKeyHtml() {
  const sp = CFG.support || {};
  return sp.token_set
    ? `<span id="sup-key" style="color:var(--ink-3)">Support key set${sp.site_name ? ' · sends as ' + esc(sp.site_name) : ''} ·
         <a href="#" onclick="event.preventDefault(); document.getElementById('sup-key').outerHTML = supKeyForm()">change</a></span>`
    : supKeyForm();
}
function supKeyForm() {
  const sp = CFG.support || {};
  return `<span id="sup-key" style="display:flex;gap:6px;flex-wrap:wrap;flex-basis:100%">
    <input class="mid" id="sup-token" type="password" placeholder="Support key (github_pat_…)" autocomplete="off" style="flex:1;min-width:180px">
    <input class="short" id="sup-site" placeholder="Site name" value="${esc(sp.site_name || '')}" style="width:120px">
    <button class="btn" onclick="supSaveKey()">Save key</button></span>`;
}
async function supSaveKey() {
  const token = gv('sup-token').trim(), site = gv('sup-site').trim();
  if (!token) { popMsg('Paste the support key first', false); return; }
  const d = await api('/api/support/settings', { token, site_name: site });
  if (d && d.success) {
    CFG.support = Object.assign(CFG.support || {}, { token_set: true, site_name: d.site_name });
    document.getElementById('sup-key').outerHTML = supKeyHtml();
    popMsg('Support key saved', true);
  } else popMsg((d && d.error) || 'could not save', false);
}
async function supSend() {
  const note = gv('sup-note');
  popMsg('Sending logs…', true);
  let d;
  try { d = await api('/api/support/send', { note }); } catch (e) { d = { error: String(e) }; }
  if (d && d.success) {
    popMsg(`Logs sent (${Math.round(d.bytes / 1024)} KB) — ${d.path}`, true);
    const n = document.getElementById('sup-note'); if (n) n.value = '';
  } else popMsg((d && d.error) || 'sending failed', false);
}
let UPD = null;
async function updCheck() {
  const line = document.getElementById('upd-line'), btn = document.getElementById('upd-btn'), rb = document.getElementById('upd-rb');
  if (!line) return;
  line.textContent = 'Version: checking…';
  try { UPD = await (await fetch('/api/update/check')).json(); } catch (e) { UPD = { error: String(e) }; }
  if (!document.getElementById('upd-line')) return;
  const v = x => x ? `${x.commit}${x.stamp ? ' (' + x.stamp + ')' : ''}` : '—';
  rb.hidden = !UPD.can_roll_back;
  if (!UPD.managed) {
    line.innerHTML = `Version ${esc(v(UPD.local) === '—' ? (STATUS && STATUS.version) || '—' : v(UPD.local))} · <span style="color:var(--ink-3)">${esc(UPD.why || '')}</span>`;
    btn.hidden = true;
    return;
  }
  btn.hidden = false;
  if (UPD.error) {
    line.innerHTML = `Version ${esc(v(UPD.local))} · <span style="color:var(--warn)">${esc(UPD.error)}</span>`;
    btn.textContent = 'Check again'; btn.onclick = updCheck; btn.classList.remove('primary');
  } else if (UPD.available) {
    line.innerHTML = `Version ${esc(v(UPD.local))} · <b style="color:var(--good)">update available: ${esc(v(UPD.remote))}</b>`;
    btn.textContent = 'Update now'; btn.onclick = updApply; btn.classList.add('primary');
  } else {
    line.innerHTML = `Version ${esc(v(UPD.local))} · <span style="color:var(--good)">up to date</span>`;
    btn.textContent = 'Check again'; btn.onclick = updCheck; btn.classList.remove('primary');
  }
}
async function updApply(force) {
  if (!force && !confirm('Install the update now? The console restarts (about 15 s): reads and the FinishLynx link pause meanwhile.')) return;
  popMsg('Downloading and installing… (up to a minute)', true);
  let d;
  try { d = await api('/api/update/apply', { force: !!force }); } catch (e) { d = { error: String(e) }; }
  if (d && d.busy) {
    if (confirm(`Not a good moment: ${d.busy.join('; ')}.\n\nUpdate anyway? The console is down for about 15 s.`)) return updApply(true);
    popMsg('Update postponed', true);
    return;
  }
  if (!d || !d.success) { popMsg((d && d.error) || 'update failed', false); return; }
  waitForRestart(`Updated to ${d.to && d.to.commit} — restarting…`);
}
async function updRollback() {
  if (!confirm('Go back to the version before the last update? The console restarts (about 15 s).')) return;
  const d = await api('/api/update/rollback', {});
  if (!d || !d.success) { popMsg((d && d.error) || 'roll back failed', false); return; }
  waitForRestart(`Rolled back to ${d.to} — restarting…`);
}
/* The console goes away and the launcher brings it back: reload once it answers. */
function waitForRestart(msg) {
  popMsg(msg, true);
  const t0 = Date.now();
  setTimeout(async function poll() {
    try { const r = await fetch('/api/status', { cache: 'no-store' }); if (r.ok) { location.reload(); return; } } catch (e) {}
    if (Date.now() - t0 < 180000) setTimeout(poll, 2000);
    else popMsg('The console has not come back after 3 minutes — check its window on the PC.', false);
  }, 6000);
}

/* Setup check (Console chip): what a new timing PC still needs, each ✗
   with its fix. Read-only on the server (setup_check.py). */
async function loadSetup() {
  const box = document.getElementById('setup-rows'), sum = document.getElementById('setup-sum');
  if (!box) return;
  box.textContent = 'Checking…';
  let d;
  try { d = await (await fetch('/api/setup_check')).json(); } catch (e) { d = { rows: [], error: String(e) }; }
  if (!document.getElementById('setup-rows')) return;           // popover closed meanwhile
  if (d.error && !(d.rows || []).length) { box.innerHTML = `<span style="color:var(--crit)">${esc(d.error)}</span>`; return; }
  const bad = d.rows.filter(r => r.ok === false).length;
  sum.innerHTML = bad ? `· <span style="color:var(--crit)">${bad} to fix</span>` : '· <span style="color:var(--good)">all set</span>';
  let group = '';
  box.innerHTML = d.rows.map(r => {
    const head = r.group !== group ? `<div class="g">${esc(group = r.group)}</div>` : '';
    const mark = r.ok === true ? '<span class="m ok">✓</span>' : r.ok === false ? '<span class="m bad">✗</span>' : '<span class="m na">–</span>';
    return `${head}<div class="r" data-id="${esc(r.id)}">${mark}<div><div>${esc(r.label)}</div>
      ${r.detail ? `<div class="d">${esc(r.detail)}</div>` : ''}${r.fix ? `<div class="f">${esc(r.fix)}</div>` : ''}</div></div>`;
  }).join('');
  placePop();
}

function placePop() {
  const el = document.getElementById('pop'), chip = POP.chip;
  if (!chip || el.hidden) return;
  const r = chip.getBoundingClientRect();
  const w = el.offsetWidth;
  let left = r.left + window.scrollX;
  left = Math.max(12, Math.min(left, window.scrollX + document.documentElement.clientWidth - w - 12));
  el.style.left = left + 'px';
  el.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function closePop() {
  const el = document.getElementById('pop');
  el.hidden = true; el.innerHTML = '';
  if (POP.chip) POP.chip.classList.remove('open');
  POP.kind = null; POP.port = null; POP.chip = null;
}

document.addEventListener('click', e => {
  if (POP.kind && !e.target.closest('#pop') && !e.target.closest('.chip.click, .pop-anchor')) closePop();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePop(); });
window.addEventListener('resize', placePop);

function livePop() {
  if (!POP.kind) return;
  const [main, det] = splitRows(POP_ROWS[POP.kind](STATUS || {}));
  const rows = document.querySelector('#pop .rows.main'), more = document.querySelector('#pop .rows.det');
  if (rows) rows.innerHTML = rowsHtml(main);
  if (more) more.innerHTML = rowsHtml(det);
}

/* A popover's rows: the few that matter first; a ['…'] marker row starts
   the rest, which sit behind "Show details" (remembered while the page is
   open). */
let POP_DETAILS = false;
function splitRows(rows) {
  const i = rows.findIndex(r => r.length === 1 && r[0] === '…');
  return i < 0 ? [rows, []] : [rows.slice(0, i), rows.slice(i + 1)];
}
function toggleDetails(b) {
  POP_DETAILS = !POP_DETAILS;
  document.querySelector('#pop .rows.det').hidden = !POP_DETAILS;
  b.textContent = POP_DETAILS ? 'Hide details ▴' : 'Show details ▸';
  placePop();
}
/* (i) on a section title: that section's setup notes, hidden by default */
function toggleNote(b) {
  const h = b.closest('.sec').querySelector(':scope > .hint');
  h.hidden = !h.hidden;
  b.classList.toggle('on', !h.hidden);
}

/* [key, value, cls] rows; a one-element [title] is a group heading */
function rowsHtml(rows) {
  return rows.map(([k, v, cls]) => v === undefined
    ? `<span class="h">${esc(k)}</span>`
    : `<span class="k">${esc(k)}</span><span class="v ${cls || ''}">${v == null || v === '' ? '—' : v}</span>`).join('');
}
function yn(b, yes, no) { return b ? `<span style="color:var(--good)">${yes || 'yes'}</span>`
                                    : `<span style="color:var(--crit)">${no || 'no'}</span>`; }
function fmtUp(sec) {
  if (sec == null) return '—';
  const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60);
  return (d ? d + 'd ' : '') + (h ? h + 'h ' : '') + m + 'm';
}
function parseElapsed(text) {
  // "12:34", "1:02:03", "12:34.5", "754" -> seconds, or null
  const t = String(text || '').trim();
  if (!t) return null;
  const parts = t.split(':');
  if (parts.some(p => p === '' || isNaN(p))) return null;
  let s = 0;
  for (const p of parts) s = s * 60 + parseFloat(p);
  return isFinite(s) && s >= 0 ? s : null;
}
function clockSourceText(s) {
  return { manual: 'manual (set from console)', manual_tod: 'manual: time of day',
           pinned: 'pinned to ' + ((s.led_clock_override && s.led_clock_override.race_name) || 'a race pane'),
           race: 'race pane gun (latest racing pane)', camera: 'start sensor via camera',
           finishlynx: "FinishLynx's running clock",
           lora: 'gun over LoRa', idle: 'idle: time of day' }[s.led_clock_source] || '—';
}

/* Reads per antenna port since start/clear. A configured port with zero
   reads while others are busy is a dead antenna or cable - shown in red. */
function antennaReadsHtml(s) {
  const counts = s.antenna_reads || {};
  const ports = new Set([...(s.reader_antennas || []).map(String), ...Object.keys(counts)]);
  if (!ports.size) return '—';
  const total = Object.values(counts).reduce((a, b) => a + b, 0);
  return [...ports].sort((a, b) => a - b).map(p => {
    const n = counts[p] || 0;
    const dead = total >= 20 && n === 0 && (s.reader_antennas || []).map(String).includes(p);
    return `<span style="${dead ? 'color:var(--crit);font-weight:600' : n ? '' : 'color:var(--ink-3)'}" title="port ${p}">A${esc(p)}: ${n}${dead ? ' !' : ''}</span>`;
  }).join(' · ');
}

function popShell(title, kind, rows, sections) {
  const [main, det] = splitRows(rows);
  return `<h3>${title}<span class="x" onclick="closePop()" title="close">&times;</span></h3>
    <div class="rows main">${rowsHtml(main)}</div>
    ${det.length ? `<div class="rows det" style="padding-top:0"${POP_DETAILS ? '' : ' hidden'}>${rowsHtml(det)}</div>
      <div class="more"><button onclick="toggleDetails(this)">${POP_DETAILS ? 'Hide details ▴' : 'Show details ▸'}</button></div>` : ''}
    ${sections}<div class="msg" id="pop-msg"></div>`;
}
/* A popover section: title, controls; `hint` = setup notes behind the (i)
   on the title; `trouble` = a line about something wrong right now, always
   shown. */
function popSec(title, inner, hint, trouble) {
  return `<div class="sec"><div class="t">${title}${hint ? '<button class="ibtn" title="Setup notes" onclick="toggleNote(this)">i</button>' : ''}</div>
    <div class="acts">${inner}</div>${trouble ? `<div class="trouble">${trouble}</div>` : ''}${hint ? `<div class="hint" hidden>${hint}</div>` : ''}</div>`;
}

/* action helpers */
function popMsg(text, ok) {
  const m = document.getElementById('pop-msg');
  if (!m) return;
  m.textContent = text || ''; m.className = 'msg ' + (ok ? 'ok' : 'bad');
}
async function popAct(path, body, okText) {
  popMsg('…', true);
  let d = {};
  try {
    const r = await fetch(path, { method: 'POST', headers: {'Content-Type': 'application/json'},
                                  body: JSON.stringify(body || {}) });
    d = await r.json().catch(() => ({}));
    const ok = r.ok && d.success !== false && !d.error;
    popMsg(d.message || d.error || (ok ? (okText || 'Done') : 'Failed'), ok);
  } catch (e) { popMsg('request failed: ' + e, false); }
  setTimeout(async () => { await loadConfig(); pollStatus(); refresh(); }, 600);
  return d;
}
async function popConfig(patch, okText, after) {
  const d = await popAct('/api/config', patch, okText);
  if (after && d && d.success) await after(d);
  return d;
}
function applyReaderPower() {
  const power = parseFloat(document.getElementById('p-power').value);
  const every = document.getElementById('p-all').checked;
  const ants = every ? [] : [...document.querySelectorAll('.p-ant:checked')].map(x => parseInt(x.value));
  if (!(power >= 5 && power <= 33)) return popMsg('power must be 5–33 dBm', false);
  if (!every && !ants.length) return popMsg('pick at least one antenna, or every port', false);
  popConfig({ reader: { power_dbm: power, antennas: ants } }, every ? 'Polling every port' : 'Power/antennas applied');
}

/* Split-station reader settings travel by radio: CFGS out, ACK back (the
   web call waits up to 10 s). The station reconnects its reader itself. */
async function unitPost(path, body) {
  try {
    const r = await fetch(path, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
    return await r.json().catch(() => ({}));
  } catch (e) { return { success: false, message: 'request failed: ' + e }; }
}
async function applyUnitReader() {
  const every = document.getElementById('u-all').checked;
  const ants = every ? [] : [...document.querySelectorAll('.u-ant:checked')].map(x => parseInt(x.value));
  if (!every && !ants.length) return popMsg('pick at least one port, or every port', false);
  const values = { antennas: ants };
  const pv = document.getElementById('u-power').value.trim();
  if (pv !== '') {
    const p = parseFloat(pv);
    if (!(p >= 5 && p <= 33)) return popMsg('power must be 5–33 dBm', false);
    values.power_dbm = p;
  }
  popMsg('sending over the radio…', true);
  const d = await unitPost(`/api/remote/units/${encodeURIComponent(POP.port)}/config`, { section: 'reader', values });
  popMsg(d.success ? `Station acknowledged; its reader is reconnecting with ${every ? 'every port' : 'ports ' + ants.join(', ')}`
                   : (d.message || 'no acknowledgement from the station'), !!d.success);
  if (d.success) setTimeout(refreshUnitReader, 8000);   // read back what it actually polls
}
/* Which point(s) a reader's reads count as. races.reader_points in config
   (mirrored in DATA.reader_points) maps a reader id - a station, or the
   local mat (LOCAL_READER) - to an ordered list of points: one entry
   renames, two or more hand out points by pass number. No entry: the id is
   the point (S1 = Mile 1, FINISH = the finish). A station mapped to the
   finish point IS the finish line (places, promotion of splits, the
   FinishLynx feed, film offset, the offline alarm all follow the map). */
const LOCAL_READER = 'FINISH';
function unitPoints(id) {
  const rp = (DATA && DATA.reader_points) || {};
  return Array.isArray(rp[id]) && rp[id].length ? rp[id].slice() : null;
}
function finishPointIds() {
  return ((DATA && DATA.points) || []).filter(p => p.finish).map(p => p.id);
}
function readerIsFinish(id) {
  if (!DATA) return id === LOCAL_READER;          // before the first snapshot
  if (Array.isArray(DATA.finish_reader_ids)) return DATA.finish_reader_ids.includes(id);
  const pts = unitPoints(id), fin = finishPointIds();
  return pts ? pts.some(p => fin.includes(p)) : fin.includes(id);
}
function readerOff(id) { return (unitPoints(id) || [])[0] === 'off'; }
function chuteId() { return (DATA && DATA.chute_reader) || 'CHUTE'; }
function pointLabel(p) {
  if (p === '-') return 'not a split';
  if (p === 'off') return 'not in use';
  if (p === chuteId()) return 'Check-in';
  const x = ((DATA && DATA.points) || []).find(q => q.id === p);
  return x ? x.label : p;
}
function unitRoleText(id) {
  const pts = unitPoints(id);
  if (pts) return pts.map(pointLabel).join(', then ');
  const own = ((DATA && DATA.points) || []).find(q => q.id === id);
  return own ? own.label : `"${id}" (not a known split point)`;
}
/* The Location <select> of one row in the Stations panel: any single point
   (a mile marker or the finish), a run of points for one mat crossed more
   than once (by pass order), and the loop-course "skip the first crossing"
   forms. The value is the comma-joined point list; choosing a station's
   own id (or Finish for the local mat) clears its entry in reader_points. */
function locationValue(id) {
  const cur = unitPoints(id);
  return cur ? cur.join(',') : id;
}
function locationOptions(id) {
  const all = (DATA && DATA.points) || [];
  const splits = all.filter(p => !p.finish), fins = all.filter(p => p.finish);
  const curKey = locationValue(id);
  const opts = [];
  for (const p of fins.concat(splits)) opts.push([p.id, p.label]);
  if (splits.length >= 2)
    opts.push([splits.map(p => p.id).join(','), splits.map(p => p.label).join(', then ') + ' (one mat)']);
  for (const f of fins)
    for (let i = 0; i < splits.length; i++) {
      const run = splits.slice(i).concat([f]);
      opts.push([run.map(p => p.id).join(','), run.map(p => p.label).join(', then ') + ' (one mat)']);
    }
  for (const p of fins.concat(splits)) opts.push([`-,${p.id}`, `${p.label}, skip 1st crossing (loop)`]);
  // check-in chute: every tag read joins the race whose Check-in is open
  opts.push([chuteId(), 'Check-in (chute)']);
  opts.push(['off', 'Not in use']);
  if (!opts.some(o => o[0] === curKey)) opts.push([curKey, (unitPoints(id) || [id]).map(pointLabel).join(', then ')]);
  return opts.map(([v, t]) => `<option value="${esc(v)}" ${v === curKey ? 'selected' : ''}>${esc(t)}</option>`).join('');
}
function stationsMsg(text, ok) {
  const f = document.getElementById('units-foot');
  if (!f) return;                       // the Stations popover was closed meanwhile
  f.hidden = false;
  f.innerHTML = `<span class="${ok ? 'msg-ok' : 'msg-bad'}">${esc(text)}</span>`;
  setTimeout(renderStations, 2500);
}
async function saveReaderPoints(rp, passWindow, okText) {
  const body = { races: { reader_points: rp } };
  if (passWindow != null) body.races.pass_window_sec = passWindow;
  let d = {};
  try {
    const r = await fetch('/api/config', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
    d = await r.json().catch(() => ({}));
    const ok = r.ok && d.success !== false && !d.error;
    stationsMsg(ok ? okText : (d.error || d.message || 'save failed'), ok);
  } catch (e) { stationsMsg('request failed: ' + e, false); }
  await loadConfig(); refresh();
}
async function setLocation(id, v) {
  const pts = v.split(',').filter(Boolean);
  const rp = Object.assign({}, (DATA && DATA.reader_points) || {});
  if (pts.length === 1 && pts[0] === id) delete rp[id]; else rp[id] = pts;
  const fin = finishPointIds();
  const isFin = pts.some(p => fin.includes(p));
  // every other reader that is at the finish right now
  const others = Object.keys(rp).filter(r => r !== id && rp[r].some(p => fin.includes(p)))
    .concat(fin.filter(f => f !== id && !rp[f]));
  const name = r => r === LOCAL_READER ? 'This PC' : r;
  if (!isFin && !others.length
      && !confirm(`No station would be at the finish line: nobody gets placed until one is set to Finish. Move ${name(id)} to ${pts.map(pointLabel).join(', then ')} anyway?`)) {
    renderStations(true); return;
  }
  // One finish line is the normal case: offer to take the others out of
  // use (two mats at the line is legitimate, so Cancel keeps them).
  if (isFin && others.length
      && confirm(`${others.map(name).join(' and ')} ${others.length > 1 ? 'are' : 'is'} also at the finish. Make ${name(id)} the only finish and set ${others.map(name).join(' and ')} to Not in use?\n\nCancel keeps both at the finish (two mats on one line).`))
    for (const o of others) rp[o] = ['off'];
  await saveReaderPoints(rp, null, `${name(id)}: ${pts.map(pointLabel).join(', then ')}${isFin ? ' — the finish line' : ''}`);
}
async function setPassWindow(v) {
  const w = parseFloat(v);
  if (!(w >= 0 && w <= 3600)) return stationsMsg('pass window must be 0–3600 s', false);
  await saveReaderPoints((DATA && DATA.reader_points) || {}, w, `Same pass within ${w} s`);
}

/* One chip for all LED clocks. Green = every clock in use is driving, amber
   = some are (the rest unplugged since, or their port held by FinishLynx),
   red = none is. A configured clock not plugged in since the console
   started is not in use at this meet and is left out. The text says what the clocks show right now. With clocks
   disabled in config the chip is simply absent. */
function fmtRace(sec) {
  if (sec == null || !isFinite(sec)) return '';
  sec = Math.max(0, sec);
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = Math.floor(sec % 60);
  return (h ? `${h}:${String(m).padStart(2, '0')}` : `${m}`) + ':' + String(s).padStart(2, '0');
}
/* What every clock is being sent right now: race time from the gun in use
   (and whose gun it is), a manual count-up, or this PC's time of day in
   the clocks' 12/24-hour format. Worked out on the PC's clock (status
   server_time), so a browser on another laptop shows the same thing. */
let SERVER_SKEW = 0;      // PC clock - browser clock, ms
function clockDisplay(s) {
  const now = Date.now() + SERVER_SKEW;
  const ov = s.led_clock_override;
  if (s.led_clock_gun) {
    const gun = new Date(s.led_clock_gun).getTime();
    const pane = () => {
      const r = (DATA && DATA.enabled ? Object.values(DATA.races) : [])
        .find(r => r.gun && Math.abs(new Date(r.gun).getTime() - gun) < 1000);
      return r ? r.name : 'race pane';
    };
    const what = { manual: 'count-up', pinned: (ov && ov.race_name) || 'pinned race', race: pane(),
                   camera: 'camera start', finishlynx: 'FinishLynx clock', lora: 'gun over radio' }[s.led_clock_source] || 'race time';
    return { value: fmtRace((now - gun) / 1000), what };
  }
  const d = new Date(now);
  const hf = (CFG && CFG.led_clock && CFG.led_clock.hour_format) || '24';
  const h = hf === '12' ? (d.getHours() % 12 || 12) : String(d.getHours()).padStart(2, '0');
  const p2 = n => String(n).padStart(2, '0');
  return { value: `${h}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`,
           what: ov && ov.mode === 'tod' ? 'time of day (held)' : 'time of day' };
}
let CLOCK_STATUS = null;
function renderClocksChip(s) {
  // the skew is taken when a status arrives, not on the per-second redraw
  if (s !== CLOCK_STATUS && s.server_time) SERVER_SKEW = new Date(s.server_time).getTime() - Date.now();
  CLOCK_STATUS = s;
  const chip = document.getElementById('chip-clocks');
  chip.hidden = !s.led_clock_enabled;
  if (chip.hidden) return;
  const all = Array.isArray(s.led_clocks) ? s.led_clocks : [];
  // unidentified serial devices, clocks disabled here, and configured clocks
  // not plugged in since the console started (not used at this meet) do not
  // count; one that was plugged in and went away does (2026-09-30)
  const clocks = all.filter(c => c.enabled !== false && c.status !== 'unknown'
                                 && !(c.status === 'missing' && c.seen === false));
  const driving = clocks.filter(c => c.status === 'driving').length;
  const el = document.getElementById('st-clocks');
  // what the clocks are being sent, then words only for what needs a look
  const show = clockDisplay(s);
  let html = `Clocks <b class="num">${esc(show.value)}</b> · ${esc(show.what)}`;
  if (!clocks.length) { el.className = 'dot'; html = 'Clocks · none found'; }
  else {
    dot('st-clocks', driving === clocks.length, driving > 0);
    if (driving < clocks.length) html += ` · ${driving}/${clocks.length} driving`;
  }
  document.getElementById('st-clocks-t').innerHTML = html;
  chip.title = all.length ? all.map(c => `${c.label}: ${clockWhy(c)}`).join('\n') : 'No clock adapter found (CH340 or PL2303)';
}
function clockCol(c) {
  return c.status === 'driving' ? 'var(--good)' : c.status === 'busy' ? 'var(--warn)'
       : (c.status === 'disabled' || c.status === 'unknown') ? 'var(--ink-3)' : 'var(--crit)';
}
function clockModel(c) {
  return c.kind === 'electro' ? 'Electro Numerics (PL2303)' : c.kind === 'ch340' ? 'LED clock (CH340)' : 'not identified';
}
function clockWhy(c) {
  return c.status === 'driving' ? 'driving'
       : c.status === 'busy' ? 'port busy: ' + (c.error || 'could not open')
       : c.status === 'disabled' ? 'disabled here'
       : c.status === 'unknown' ? 'USB serial device, not identified as a clock'
       : 'not plugged in';
}

/* ---------------- floating menu (pane More ▾) ---------------- */
/* One floating menu element (#menu), outside the panes, so the once-a-
   second pane refresh never closes it. items: [label, fn] or 'hr'. */
function openMenu(btn, items) {
  const m = document.getElementById('menu');
  if (!m.hidden && MENU_BTN === btn) { closeMenu(); return; }
  MENU_FNS = [];
  m.innerHTML = items.map(it => {
    if (it === 'hr') return '<hr>';
    MENU_FNS.push(it[1]);
    return `<button class="${it[2] || ''}" onclick="menuPick(${MENU_FNS.length - 1})">${it[0]}</button>`;
  }).join('');
  m.hidden = false; MENU_BTN = btn;
  const r = btn.getBoundingClientRect(), w = m.offsetWidth, h = m.offsetHeight;
  let left = Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - w - 12);
  let top = r.bottom + window.scrollY + 4;
  if (r.bottom + h + 8 > window.innerHeight && r.top > h + 8) top = r.top + window.scrollY - h - 4;   // no room below: open upward
  m.style.left = Math.max(12, left) + 'px'; m.style.top = top + 'px';
}
let MENU_FNS = [], MENU_BTN = null;
function menuPick(i) { const fn = MENU_FNS[i]; closeMenu(); if (fn) fn(); }
function closeMenu() { document.getElementById('menu').hidden = true; MENU_BTN = null; }
document.addEventListener('click', e => {
  if (!e.target.closest('#menu') && !(MENU_BTN && MENU_BTN.contains(e.target))) closeMenu();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });
window.addEventListener('scroll', closeMenu);

let MEET_COUNTS = '';
function showMeet(dir, counts) {
  MEET_DIR = dir || '';

  document.getElementById('meet-name').textContent = name;

/* The .evt is watched once a meet is loaded: MeetPro's late entries,
   scratches and renamed events reach the panes by themselves. The meet
   label says when that last happened; events new to the file light up
   "Races from .evt" until the picker is opened. */
let EVT_SEEN = '';
function renderEvtSync() {
  const s = DATA && DATA.evt_sync;
  const label = document.getElementById('meet-label');
  let status = MEET_COUNTS, title = MEET_DIR || 'No meet folder loaded';
  if (s && MEET_DIR) {
    const what = [];
    if (s.entries_added || s.entries_removed) what.push(`+${s.entries_added}/−${s.entries_removed} entries`);
    if (s.renamed && s.renamed.length) what.push(`renamed ${s.renamed.join('; ')}`);
    if (s.new_races && s.new_races.length) what.push(`new: ${s.new_races.join(', ')}`);
    status = [MEET_COUNTS, `.evt updated ${String(s.at).slice(11, 16)}`].filter(Boolean).join(' · ');
    title += `\n${s.file} changed at ${String(s.at).slice(11)}: ${what.join(' · ')}`;
  }
  document.getElementById('meet-status').textContent = status;
  label.title = title;
  const btn = document.getElementById('btn-evt');
  const fresh = s && s.new_races && s.new_races.length && s.at !== EVT_SEEN ? s.new_races.length : 0;
  btn.textContent = fresh ? `Races from .evt · ${fresh} new` : 'Races from .evt';
  btn.classList.toggle('primary', !!fresh);
}

async function closeMeet() {
  const btn = document.getElementById('close-meet-go');
  if (btn) { btn.disabled = true; btn.textContent = 'Closing…'; }
  let d;
  try {
    const r = await fetch('/api/meet/close', { method: 'POST',
      headers: {'Content-Type': 'application/json'}, body: '{}' });
    d = await r.json();
  } catch (e) { d = { success: false, error: String(e) }; }
  closeDlg();
  if (!d.success) { alert(d.error || 'close failed - nothing was cleared'); return; }

  await refresh(); pollStatus();

    ${d.archive_dir ? `<br><br>Archive: <span class="num">${esc(d.archive_dir)}</span>` : ''}

/* ---------------------------- live feed + units ---------------------------- */

/* Every read the console has heard, newest first, for the "Add athlete"
   dialog's pick-list. Seeded from /api/reads at load, then fed by the socket. */
let LIVE_READS = [];
const LIVE_READS_MAX = 300;
function noteLiveRead(d) {
  LIVE_READS.unshift({ bib: String(d.bib), ts: d.full_timestamp || d.timestamp, time: d.time || d.timestamp,
                       reader_id: d.reader_id, point: d.point, athlete: d.athlete || null });
  if (LIVE_READS.length > LIVE_READS_MAX) LIVE_READS.length = LIVE_READS_MAX;
}
async function seedLiveReads() {
  try {
    const reads = await (await fetch(`/api/reads?detail=true&limit=${LIVE_READS_MAX}`)).json();
    if (Array.isArray(reads))
      LIVE_READS = reads.map(r => ({ bib: String(r.bib), ts: r.timestamp, time: r.time, reader_id: r.reader_id,
                                     point: r.point || (r.relay_info && r.relay_info.split_point), athlete: r.athlete || null }));
  } catch (e) {}
}
function onTagRead(d) {
  FEEDN++;
  noteLiveRead(d);
  const live = document.getElementById('f-live');
  if (live) live.innerHTML = liveReadsHtml(parseInt(live.dataset.key));   // Add dialog is open: keep its list fresh
  document.getElementById('feed-count').textContent = FEEDN;
  const t = document.getElementById('feed');
  const name = d.athlete ? `${d.athlete.last_name || ''}${d.athlete.school ? ' · ' + d.athlete.school : ''}` : '';
  const row = t.insertRow(1);
  // a pass-numbered station shows "S1→S2": heard at S1, counted as Mile 2;
  // "S2 ✕" is a crossing that is not a split (loop course), ignored
  const pt = d.point === '-' ? `${d.reader_id} ✕`
           : d.point && d.point !== d.reader_id ? `${d.reader_id}→${d.point}` : d.reader_id;
  row.innerHTML = `<td class="bib num">${esc(d.bib)}</td><td>${esc(name)}</td>
    <td><span class="pt" title="${esc(d.point ? pointLabel(d.point) : '')}">${esc(pt)}</span></td>
    <td class="right num">${esc(d.timestamp)}</td>`;
  while (t.rows.length > 60) t.deleteRow(-1);
}
